# mdBook configuration for the BirdNet-Behavior operator manual.
#
# Rendered to `docs/book/_generated/html/` by the root `build.rs` at every
# cargo build (the operator does not run mdbook directly — the build-time
# integration was the maintainer's locked-in RFC answer for O-20).
#
# At runtime, the `birdnet-web::routes::pages::help::router()` ServeDir
# mounts that directory under `/help/*`. An installer that ships the
# rendered docs to a non-default location can set `BNB_HELP_DIR` instead.

[book]
title = "BirdNet-Behavior — Operator Manual"
description = "Field guide, admin reference, and troubleshooting for BirdNet-Behavior stations"
authors = ["BirdNet-Behavior contributors"]
language = "en"
src = "."
multilingual = false

[build]
# Where build.rs expects the rendered HTML to land. Matches the
# `help_dir()` fallback in `pages::help`.
build-dir = "_generated/html"
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/tomtom215/BirdNet-Behavior"
edit-url-template = "https://github.com/tomtom215/BirdNet-Behavior/edit/main/docs/book/{path}"
mathjax-support = false
copy-fonts = true
no-section-label = false
# `index = false` would prevent index.html generation; we keep it so that
# `/help/` (without an explicit topic) lands on the introduction.
[output.html.fold]
enable = false
