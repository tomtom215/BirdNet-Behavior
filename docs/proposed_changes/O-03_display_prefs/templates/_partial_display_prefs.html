<!--
  Display preferences card.
  Drop-in: insert into the /system page template, or render as a standalone
  partial from /pages/display-prefs and embed there.

  Reads/writes localStorage keys already wired by layout.html:
    theme         → 'light' | 'dark'
    bnb-density   → 'compact' | 'regular' | 'comfy'

  Adds two new keys (read by app.css media-query overrides — see DIFF.md):
    bnb-motion    → 'auto' | 'reduced'
    bnb-contrast  → 'auto' | 'high'
-->
<div class="bnb-card pad" id="display-prefs" data-screen-label="Display preferences">
  <div class="section-header">
    <div>
      <div class="bnb-eyebrow">Display</div>
      <h3>How the dashboard looks</h3>
    </div>
    <button type="button" class="bnb-btn ghost" data-prefs-reset>Reset</button>
  </div>

  <div class="prefs-grid">
    <!-- Theme -->
    <div class="prefs-row">
      <div class="prefs-label">
        <div style="font-weight:500;">Theme</div>
        <div class="bnb-meta">Light, dark, or follow the OS.</div>
      </div>
      <div class="seg" data-prefs-key="theme" role="radiogroup" aria-label="Theme">
        <button type="button" class="btn" data-value="light">Light</button>
        <button type="button" class="btn" data-value="dark">Dark</button>
        <button type="button" class="btn" data-value="auto">Auto</button>
      </div>
    </div>

    <!-- Density -->
    <div class="prefs-row">
      <div class="prefs-label">
        <div style="font-weight:500;">Density</div>
        <div class="bnb-meta">How much breathing room between elements.</div>
      </div>
      <div class="seg" data-prefs-key="bnb-density" role="radiogroup" aria-label="Density">
        <button type="button" class="btn" data-value="compact">Compact</button>
        <button type="button" class="btn" data-value="regular">Regular</button>
        <button type="button" class="btn" data-value="comfy">Comfy</button>
      </div>
    </div>

    <!-- Motion -->
    <div class="prefs-row">
      <div class="prefs-label">
        <div style="font-weight:500;">Motion</div>
        <div class="bnb-meta">Live pulse and feed-row transitions.</div>
      </div>
      <div class="seg" data-prefs-key="bnb-motion" role="radiogroup" aria-label="Motion">
        <button type="button" class="btn" data-value="auto">Full</button>
        <button type="button" class="btn" data-value="reduced">Reduced</button>
      </div>
    </div>

    <!-- Contrast -->
    <div class="prefs-row">
      <div class="prefs-label">
        <div style="font-weight:500;">Contrast</div>
        <div class="bnb-meta">Stronger borders and ink.</div>
      </div>
      <div class="seg" data-prefs-key="bnb-contrast" role="radiogroup" aria-label="Contrast">
        <button type="button" class="btn" data-value="auto">Standard</button>
        <button type="button" class="btn" data-value="high">High</button>
      </div>
    </div>
  </div>

  <div class="bnb-meta" style="margin-top:14px;padding-top:14px;border-top:0.5px solid var(--hairline);">
    All choices are stored on this device only — no account, no sync.
  </div>
</div>

<style>
  #display-prefs .prefs-grid { display: grid; gap: var(--pad-2); margin-top: 4px; }
  #display-prefs .prefs-row {
    display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
    padding: var(--pad-2) 0; border-top: 0.5px solid var(--hairline);
  }
  #display-prefs .prefs-row:first-child { border-top: 0; padding-top: 0; }
  #display-prefs .seg .btn { min-width: 76px; }
  @media (max-width: 540px) {
    #display-prefs .prefs-row { grid-template-columns: 1fr; }
    #display-prefs .seg { width: 100%; }
    #display-prefs .seg .btn { flex: 1; }
  }
</style>

<script>
(function () {
  var root = document.getElementById('display-prefs');
  if (!root) return;
  var html = document.documentElement;
  var DENSITY = { compact: '0.78', regular: '1', comfy: '1.15' };

  function get(key, fallback) {
    try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
  }
  function set(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* noop */ }
  }
  function osDark() {
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function applyTheme(value) {
    var resolved = value === 'auto' ? (osDark() ? 'dark' : 'light') : value;
    html.setAttribute('data-theme', resolved);
    set('theme', value);
    // mirror to the toolbar toggle's icon if present
    var icon = document.getElementById('theme-icon');
    if (icon) icon.textContent = resolved === 'dark' ? '☀' : '☽';
  }
  function applyDensity(value) {
    html.style.setProperty('--density', DENSITY[value] || '1');
    set('bnb-density', value);
  }
  function applyMotion(value) {
    html.setAttribute('data-motion', value);
    set('bnb-motion', value);
  }
  function applyContrast(value) {
    html.setAttribute('data-contrast', value);
    set('bnb-contrast', value);
  }

  var APPLIERS = {
    'theme': applyTheme,
    'bnb-density': applyDensity,
    'bnb-motion': applyMotion,
    'bnb-contrast': applyContrast,
  };
  var DEFAULTS = {
    'theme': 'auto',
    'bnb-density': 'regular',
    'bnb-motion': 'auto',
    'bnb-contrast': 'auto',
  };

  // Mark the currently-selected button in each group + apply current values.
  Object.keys(APPLIERS).forEach(function (key) {
    var current = get(key, DEFAULTS[key]);
    var group = root.querySelector('[data-prefs-key="' + key + '"]');
    if (!group) return;
    var match = group.querySelector('[data-value="' + current + '"]');
    if (match) match.classList.add('active');
    else {
      var first = group.querySelector('button');
      if (first) first.classList.add('active');
    }
    APPLIERS[key](current);

    group.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-value]');
      if (!btn) return;
      e.preventDefault();
      group.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      APPLIERS[key](btn.dataset.value);
    });
  });

  // Reset.
  var resetBtn = root.querySelector('[data-prefs-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', function () {
      Object.keys(DEFAULTS).forEach(function (k) {
        APPLIERS[k](DEFAULTS[k]);
        var group = root.querySelector('[data-prefs-key="' + k + '"]');
        if (!group) return;
        group.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
        var match = group.querySelector('[data-value="' + DEFAULTS[k] + '"]');
        if (match) match.classList.add('active');
      });
    });
  }

  // Track OS theme changes while in 'auto'.
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (get('theme', 'auto') === 'auto') applyTheme('auto');
    });
  } catch (e) { /* older browsers */ }
})();
</script>
