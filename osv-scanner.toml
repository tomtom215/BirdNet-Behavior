# Waivers for OSV-Scanner (`.github/workflows/osv.yml`), read from the directory of the
# lockfile it scans, so this file applies to `Cargo.lock` and to nothing under `tools/`.
# `deny.toml` keeps the same rule for RustSec: an entry carries its reason, an expiry,
# and says what would let it go. An expired entry stops waiving, so the job goes red
# again on the day it is due rather than the waiver outliving what it was written for.

# No waivers at present.
#
# The last one, GHSA-qwgh-2vcv-g2f7 (block_buffer 0.10.4, waived until 2026-12-01 by #272), was
# removed on 2026-10-31. The advisory's record, last modified 2026-10-30, now lists block_buffer
# 0.11.0 up to 0.12.1 as affected; this lockfile holds 0.10.4 and 0.12.1, so nothing matched and
# `scripts/osv-check.py` reported no advisory for any of the 649 locked packages. If the record
# changes back and the job goes red, add a waiver then, with the evidence of that day.
