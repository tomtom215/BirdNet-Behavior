# Waivers for OSV-Scanner (`.github/workflows/osv.yml`), read from the directory of the
# lockfile it scans, so this file applies to `Cargo.lock` and to nothing under `tools/`.
# `deny.toml` keeps the same rule for RustSec: an entry carries its reason, an expiry,
# and says what would let it go. An expired entry stops waiving, so the job goes red
# again on the day it is due rather than the waiver outliving what it was written for.

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2026-12-01
reason = """
block_buffer 0.10.4: a panic caught inside the compression callback of EagerBuffer, or the \
generator of ReadBuffer, leaves its cursor corrupted. The crate is reached only through \
sha1 0.10.7 (digest 0.10.7), which axum and tungstenite use for the WebSocket handshake \
(`cargo tree -i block-buffer@0.10.4`); no code in this workspace uses it directly, and \
release builds set panic = "abort" (Cargo.toml, [profile.release]), so a panic cannot be \
caught there. The fix, block-buffer 0.12.1, is already in Cargo.lock for the newer digest \
chain; this entry goes when axum and tungstenite move to a sha1 that uses it.
"""
