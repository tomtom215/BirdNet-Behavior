    # once the setting is on, point this back at the advisory form.
    url: https://github.com/tomtom215/BirdNet-Behavior/blob/main/SECURITY.md
    about: Found a vulnerability? Do not open a public issue with the details. SECURITY.md says how to reach the maintainer privately.
  - name: Getting help
    # Not /discussions: GitHub Discussions are not enabled for this repository.
    url: https://github.com/tomtom215/BirdNet-Behavior/blob/main/SUPPORT.md
    about: Setup questions? Run the built-in diagnostic and read the troubleshooting guide first; SUPPORT.md says where each kind of question goes.
