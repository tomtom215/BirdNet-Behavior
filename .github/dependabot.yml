# Automated dependency updates via GitHub Dependabot.
#
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Strategy:
#   - Cargo deps grouped weekly so we get one PR per ecosystem instead of dozens
#   - Patch + minor releases are auto-grouped; majors get individual PRs so the
#     review can scrutinise behavioural changes
#   - GitHub Actions and Docker base images get their own weekly cadence to
#     avoid mixing supply-chain bumps with code dep bumps
version: 2
updates:
  # ── Rust crates ─────────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies", "rust"]
    groups:
      # Two pairs that must move together, so each arrives as ONE pull request
      # rather than two that can never be green apart (they were proposed apart
      # as #148, #202, #228 and #260, and held by `ignore` rules, until both
      # upstream releases existed; both pairs were taken together on 2026-10-15).
      #
      # `argon2` and `password-hash`: argon2 implements password-hash's
      # PasswordHasher/PasswordVerifier traits and the accounts code passes
      # password-hash types straight into it, so one alone puts two distinct
      # `PasswordHasher` traits in the graph.
      #
      # `rubato` and `audioadapter-buffers`: `resample.rs` hands an
      # `audioadapter_buffers::direct::InterleavedSlice` to rubato, which needs
      # the same major of `audioadapter`; one alone fails with "multiple
      # different versions of crate `audioadapter_buffers`".
      #
      # These two groups come first: a dependency that matches several groups
      # goes to the first one listed.
      cargo-argon2-pair:
        patterns:
          - "argon2"
          - "password-hash"
      cargo-rubato-pair:
        patterns:
          - "rubato"
          - "audioadapter-buffers"
      cargo-patch-and-minor:
        update-types: ["patch", "minor"]
        exclude-patterns:
          - "ort"
          - "duckdb"
          - "tokio"
          - "axum"
      cargo-async-runtime:
        patterns:
          - "tokio*"
      cargo-web-framework:
        patterns:
          - "axum*"
          - "tower*"
          - "tower-http"

  # ── GitHub Actions workflows ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: ["dependencies", "ci"]
    ignore:
      # dtolnay/rust-toolchain must never be auto-bumped, at ANY update type.
      #
      # Every use is SHA-pinned and names its Rust in an explicit `toolchain:`
      # input (`stable`, or the MSRV for the `msrv` job). The action's own
      # revision rarely matters, and a bump PR that also moved the toolchain
      # input would silently change which Rust the MSRV job tests, decoupling it
      # from the `rust-version` we actually promise. Before the pins this was
      # worse: the toolchain was the action's *ref*, and PR #188 proposed
      # `@1.95` -> `@1.100`, which dependabot classifies as a *minor* bump, so a
      # `semver-major` ignore never fired. The `MSRV input matches Cargo.toml
      # rust-version` step in ci.yml is the belt to this braces: it fails if the
      # input and `rust-version` ever disagree. Re-pin by hand when wanted
      # (`git ls-remote https://github.com/dtolnay/rust-toolchain master`).
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        update-types: ["patch", "minor"]

  # ── Docker base image ───────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
      include: "scope"
    labels: ["dependencies", "docker"]
    # Both base images in the Dockerfile are pinned `tag@digest`, and Dependabot
    # moves the digest when the tag is rebuilt (Debian security updates, Rust
    # patch releases). It must not move the *tag* of the builder: that is
    # `rust:1.95-slim-trixie` because 1.95 is the MSRV, so the image compiles with
    # the oldest compiler the project promises to support (`rust-version` in
    # Cargo.toml). Raising it is a deliberate change made together with the MSRV,
    # in a minor release.
    ignore:
      - dependency-name: "rust"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
