# Automated dependency updates via GitHub Dependabot.
#
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#
# Strategy:
#   - Cargo deps grouped weekly so we get one PR per ecosystem instead of dozens
#   - Patch + minor releases are auto-grouped; majors get individual PRs so the
#     review can scrutinise behavioural changes
#   - GitHub Actions and Docker base images get their own weekly cadence to
#     avoid mixing supply-chain bumps with code dep bumps
version: 2
updates:
  # ── Rust crates ─────────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    labels: ["dependencies", "rust"]
    ignore:
      # `password-hash` must move in lock-step with `argon2`: argon2 0.5.x
      # implements password-hash 0.5's PasswordHasher/PasswordVerifier traits,
      # and our accounts code passes password-hash types straight into Argon2.
      # Taking password-hash 0.6 alone puts two distinct PasswordHasher traits
      # in the graph and does not compile.
      #
      # Checked against the registry index on 2026-08-08: argon2's newest
      # published version is `0.6.0-rc.8` — there is no stable 0.6, so the
      # pairing cannot be taken yet at all. PR #148 proposed exactly this and
      # sat open for two months because it can never be green.
      #
      # Remove this entry when argon2 0.6.0 ships, and take both together.
      - dependency-name: "password-hash"
        versions: ["0.6.x"]
      # `audioadapter-buffers` must move in lock-step with `rubato`, for the
      # same reason and with the same failure mode. rubato 4 requires
      # `audioadapter ^4.0`, and `resample.rs` hands an
      # `audioadapter_buffers::direct::InterleavedSlice` straight to
      # `rubato::audioadapter::Adapter`. Taking a new major alone puts two
      # versions of the crate in the graph, and the v5 type cannot implement
      # the v4 trait:
      #
      #   error[E0277]: ... there are multiple different versions of crate
      #   `audioadapter_buffers` in the dependency graph
      #   note: required for `audioadapter_buffers::direct::InterleavedSlice
      #         <&[f32]>` to implement `Adapter<f32>`
      #
      # That is PR #202 (4.0.0 -> 5.1.0), which failed 9 of 15 checks. The
      # coupling was already written down at the top of `resample.rs`; nothing
      # enforced it, so the bot proposed it anyway.
      #
      # Checked against the registry index on 2026-08-10: rubato's newest
      # published version is 4.0.0, so there is no rubato that accepts
      # audioadapter 5 — this cannot be taken at all yet, by anyone.
      #
      # Majors only: 4.x patch and minor updates are still wanted. Remove this
      # entry when rubato publishes a release built on the newer audioadapter,
      # and take both together.
      - dependency-name: "audioadapter-buffers"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-patch-and-minor:
        update-types: ["patch", "minor"]
        exclude-patterns:
          - "ort"
          - "duckdb"
          - "tokio"
          - "axum"
      cargo-async-runtime:
        patterns:
          - "tokio*"
      cargo-web-framework:
        patterns:
          - "axum*"
          - "tower*"
          - "tower-http"

  # ── GitHub Actions workflows ────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: ["dependencies", "ci"]
    ignore:
      # dtolnay/rust-toolchain must never be auto-bumped, at ANY update type.
      #
      # Every use is SHA-pinned and names its Rust in an explicit `toolchain:`
      # input (`stable`, or the MSRV for the `msrv` job). The action's own
      # revision rarely matters, and a bump PR that also moved the toolchain
      # input would silently change which Rust the MSRV job tests, decoupling it
      # from the `rust-version` we actually promise. Before the pins this was
      # worse: the toolchain was the action's *ref*, and PR #188 proposed
      # `@1.95` -> `@1.100`, which dependabot classifies as a *minor* bump, so a
      # `semver-major` ignore never fired. The `MSRV input matches Cargo.toml
      # rust-version` step in ci.yml is the belt to this braces: it fails if the
      # input and `rust-version` ever disagree. Re-pin by hand when wanted
      # (`git ls-remote https://github.com/dtolnay/rust-toolchain master`).
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        update-types: ["patch", "minor"]

  # ── Docker base image ───────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
      include: "scope"
    labels: ["dependencies", "docker"]
    # Both base images in the Dockerfile are pinned `tag@digest`, and Dependabot
    # moves the digest when the tag is rebuilt (Debian security updates, Rust
    # patch releases). It must not move the *tag* of the builder: that is
    # `rust:1.95-slim-trixie` because 1.95 is the MSRV, so the image compiles with
    # the oldest compiler the project promises to support (`rust-version` in
    # Cargo.toml). Raising it is a deliberate change made together with the MSRV,
    # in a minor release.
    ignore:
      - dependency-name: "rust"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
