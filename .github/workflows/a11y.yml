name: A11y & Visual QA

# Accessibility (axe-core) + structural visual-QA gates for the web UI, run
# against the seeded `screenshot_server` fixture. Both gates share one build of
# the analytics fixture (building it twice would cost ~10 min of CI for nothing),
# so they live in a single job with two clearly-named steps.
#
# Path-filtered: only runs when the web crate, the QA tooling, or this workflow
# changes — it is not a universal gate. The visual-QA step is structural
# (overflow / console errors / broken images / stuck loaders via qa.mjs), not a
# flaky pixel-diff, so it stays deterministic across runner images.

on:
  push:
    branches: ["master", "main"]
    paths:
      - "crates/birdnet-web/**"
      - "tools/visual-qa/**"
      - ".github/workflows/a11y.yml"
  pull_request:
    branches: ["master", "main", "claude/**"]
    paths:
      - "crates/birdnet-web/**"
      - "tools/visual-qa/**"
      - ".github/workflows/a11y.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  frontend-qa:
    name: Accessibility (axe) + visual-QA sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # observed 21m41s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free up runner disk space
        # The analytics fixture statically links bundled libduckdb; reclaim the
        # unused SDKs so the build doesn't run the runner out of disk.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-a11y
      - name: Build screenshot server (analytics fixture)
        run: cargo build -p birdnet-web --example screenshot_server --features analytics
      - name: Install QA tooling (Playwright + axe-core)
        working-directory: tools/visual-qa
        # ubuntu-24.04 runners ship Node 20+, so no setup-node action is needed.
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start screenshot server (127.0.0.1:8502)
        run: |
          set -euo pipefail
          cargo run -p birdnet-web --example screenshot_server --features analytics \
            > "$RUNNER_TEMP/screenshot-server.log" 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8502/ >/dev/null 2>&1; then
              echo "screenshot server is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::screenshot server did not become ready in time"
          cat "$RUNNER_TEMP/screenshot-server.log" || true
          exit 1
      - name: Accessibility gate (axe-core, WCAG 2.1 A/AA + 2.2 + best-practice)
        working-directory: tools/visual-qa
        # Both viewports. The gate ran at 1280x900 only, so the entire phone
        # layout had never been through an accessibility rule; adding the
        # mobile leg immediately found six serious scrollable-region-focusable
        # violations and a squeezed Recordings row.
        env:
          VPS: desktop,mobile
        run: node axe.mjs
      - name: Interaction gate (controls do not undo their own work)
        working-directory: tools/visual-qa
        run: node interactions.mjs
      - name: Legibility gate (chart labels stay readable on a phone)
        working-directory: tools/visual-qa
        # Measures the on-screen size of every SVG label on every route at
        # 1440 and 390 px. Labels authored at 8 px rendered at 2.7-5 px on a
        # phone while axe, the sweep and every screenshot called the pages clean.
        run: node legibility.mjs
      - name: Layout gate self-test (clipped text is not overlap; painted overlap is)
        working-directory: tools/visual-qa
        # The gate measured a species name cut off by `overflow: hidden` and an
        # ellipsis as running under the play button beside it, because a text
        # run's box includes what is not painted. It failed this job on the first
        # CI run of the gate, on a day whose seeded feed held a long name. This
        # holds both directions: the clipped name is not reported, two painted
        # lines over each other are.
        run: node layout-selftest.mjs
      - name: Layout gate (nothing overlaps, squeezes or escapes its card)
        working-directory: tools/visual-qa
        # What axe cannot see: text drawn over text or over a form control, a
        # column squeezed to nothing, a control that escapes its card, text under
        # 9 px. It found form hints struck through by the input above them and a
        # species-name column at 0 px on a phone, on pages every other gate
        # called clean. Both viewports, both themes.
        run: node layout.mjs
      - name: Design-token gate (what the browser paints, graded)
        working-directory: tools/visual-qa
        # Reads the colours the browser paints after color-mix(), var() and the
        # theme cascade, not the stylesheet's source: confidence tiers, tints that
        # keep their hue, the chart palette, the sign-in fields, the theme-color
        # bar. It is the check that a stylesheet's literals cannot answer.
        run: node tokens.mjs
      - name: Reduced-motion gate (the OS and the operator's setting both stop motion)
        working-directory: tools/visual-qa
        # No animation may be running on any route under either request, and a
        # control run with neither must find some, so the probe is known to see.
        run: node motion.mjs
      - name: Focus gate (a focused control keeps its shape and shows a ring)
        working-directory: tools/visual-qa
        # Tabs through every route in both themes and reads the computed style
        # of the focused element. A `border-radius` written onto :focus-visible
        # squared off 948 of 1,156 stops while every other gate called the pages
        # clean.
        run: node focus.mjs
      - name: Figures gate (numbers are set in tabular figures)
        working-directory: tools/visual-qa
        run: node figures.mjs --fail
      - name: Base-path gate (served under a prefix, nothing leaves it)
        working-directory: tools/visual-qa
        run: |
          set -euo pipefail
          BIRDNET_BASE_PATH=/bn BNB_FIXTURE_ADDR=127.0.0.1:8503 \
            BNB_FIXTURE_DIR="$RUNNER_TEMP/bnb-base-path" \
            ../../target/debug/examples/screenshot_server \
            > "$RUNNER_TEMP/screenshot-server-bp.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8503/bn/species >/dev/null 2>&1; then break; fi
            sleep 2
          done
          node base-path.mjs

      - name: Visual-QA sweep (overflow / console / broken images)
        working-directory: tools/visual-qa
        env:
          STRICT: "1"
          OUT: shots
        run: node qa.mjs
      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-qa-shots
          path: tools/visual-qa/shots/
          if-no-files-found: ignore
      - name: Stop screenshot server
        if: always()
        run: kill "${SERVER_PID:-0}" 2>/dev/null || true
