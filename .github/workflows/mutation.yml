# Mutation testing across the most regression-prone modules.
#
# `cargo-mutants` rewrites the source under test in small, well-defined
# ways (replace a `>` with `<`, return `Default::default()`, drop a branch,
# etc.) and re-runs the test suite. A mutant that survives means the
# tests pass even though the module's behaviour was changed — almost
# always a sign that the assertion is too weak.
#
# Scope per the carryover-from-PR-#35 plan in CLAUDE.md, ratcheted
# outward one module at a time:
#
#   1. crates/birdnet-core/src/config/validate.rs  — first expansion;
#      0 missed at last run. This is the canonical gate.
#   2. crates/birdnet-core/src/inference/model.rs  — added after the
#      sigmoid-on-probabilities bug shipped despite unit-test coverage.
#   3. crates/birdnet-core/src/audio/extraction/extractor.rs — added
#      after the range-inversion clip-extraction bug shipped likewise.
#      Its sibling crates/birdnet-core/src/audio/extraction/convert.rs
#      (ffmpeg/sox format conversion + frequency shift) joined the matrix
#      once its arithmetic and codec-arg mapping were extracted into pure
#      helpers and its command-execution branches covered by ffmpeg-gated
#      tests — 0 missed (26 mutants: 23 caught, 3 unviable).
#   4. crates/birdnet-db/src/sqlite/queries/detections.rs — added so the
#      "explicit column list" + UNIQUE-on-chunk-offset contracts that
#      PR #35 fixed can't quietly regress. The full CRUD surface is
#      now under tests, so the gate stays at 0 missed.
#   5. src/daemon/ — the daemon orchestrator. The inline struct-literal
#      "delete field" mutants the PR #50 carryover flagged were dissolved
#      by extracting per-config builder helpers (`build_pipeline_config`,
#      `build_model_config`, `build_species_filter_config`,
#      `build_extraction_config`) plus smaller pure helpers for the inline
#      arithmetic / boolean / boundary checks that no test could observe
#      before. The orchestrator's body-replacement mutants (return None,
#      return ()) are caught by in-process integration tests that exercise
#      `start_detection_daemon` and `event_processor` against the tiny
#      V2.4 ONNX model bundled at
#      `crates/birdnet-core/src/testdata/tiny_v24_test.onnx`. Originally a
#      single src/daemon.rs; split into src/daemon/{mod,config,disposition,
#      webhook,processor}.rs for readability, so the gate globs the dir.
#
# Each file is its own matrix job so a survivor in one doesn't tank the
# whole pipeline. Per-file threshold: 0 missed on every file — we follow
# the PR #49 pattern (refactor the source until the boundary is
# observable, never lift the threshold) rather than letting mutants
# accumulate.
#
# Runs on:
#   - PRs that touch any of the in-scope files (path filter below)
#   - Weekly cron so the mutant catalogue stays fresh
#   - Manual dispatch

name: Mutation testing

on:
  push:
    branches: ["main", "master"]
    paths:
      - "crates/birdnet-core/src/config/**"
      - "crates/birdnet-core/src/inference/**"
      - "crates/birdnet-core/src/audio/extraction/**"
      - "crates/birdnet-core/tests/**"
      - "crates/birdnet-db/src/sqlite/queries/detections.rs"
      - "src/daemon/**"
      - "src/capture/**"
      - ".github/workflows/mutation.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "crates/birdnet-core/src/config/**"
      - "crates/birdnet-core/src/inference/**"
      - "crates/birdnet-core/src/audio/extraction/**"
      - "crates/birdnet-core/tests/**"
      - "crates/birdnet-db/src/sqlite/queries/detections.rs"
      - "src/daemon/**"
      - "src/capture/**"
      - ".github/workflows/mutation.yml"
  schedule:
    # Mondays at 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  mutants:
    name: cargo-mutants on ${{ matrix.label }}
    runs-on: ubuntu-24.04
    # Matrix-driven so the slow binary-crate shards get a longer budget. The
    # library-crate shards (birdnet-core / birdnet-db) reuse a warm `target/`
    # and finish well inside 45 min; the binary-crate shards (the binary's own
    # src/daemon/ + src/capture/* modules) relink the statically-bundled DuckDB
    # per mutant, so the larger files are split across several `--shard` jobs
    # (see the matrix) and each sets `timeout_minutes: 120`. Splitting keeps the
    # critical path near one baseline build instead of growing with the whole
    # file's mutant count, which had been overrunning the wall.
    timeout-minutes: ${{ matrix.timeout_minutes || 45 }}
    strategy:
      # One file's surviving mutants must not abort the rest of the matrix —
      # we want the PR comment to show the full landscape across all scoped
      # files, not just whichever finished first.
      fail-fast: false
      matrix:
        include:
          - label: validate.rs
            # `slug` is the same as `label` with forward slashes replaced
            # by hyphens so it can appear in artifact names (GitHub
            # rejects `/` in artifact names — see
            # https://docs.github.com/en/actions/using-workflows/storing-workflow-data-as-artifacts).
            slug: validate.rs
            file: crates/birdnet-core/src/config/validate.rs
            # The validator has been mutation-clean since it was added; any
            # regression at all is a real test-coverage gap.
            max_missed: 0
          - label: inference/model.rs
            slug: inference-model.rs
            file: crates/birdnet-core/src/inference/model.rs
            # Wrapper-method mutants on `BirdNetModel` (`infer_sample_rate`,
            # `recommended_chunk_samples`, `is_probability_output`,
            # setters, `predict`) used to be uncatchable without a real
            # 541 MB BirdNET+ model. Two tiny (~220-byte) embedded ONNX
            # models — `tiny_v24_test.onnx` and `tiny_v30_test.onnx` —
            # now let those methods run inside unit tests. Threshold set
            # to 0 because every mutant has a covering test today.
            max_missed: 0
          - label: audio/extraction/extractor.rs
            slug: audio-extraction-extractor.rs
            file: crates/birdnet-core/src/audio/extraction/extractor.rs
            # Threshold 0 — every remaining mutant on the spacer
            # arithmetic, the `||` predicate that gates conversion, the
            # freq-shift fallback, and the WAV-metadata-embed branch is
            # now covered by a dedicated test. The freq-shift and
            # format-conversion tests skip themselves when neither
            # ffmpeg nor sox is on PATH so a stripped-down CI runner
            # doesn't false-fail; the main CI image has ffmpeg.
            max_missed: 0
          - label: audio/extraction/convert.rs
            slug: audio-extraction-convert.rs
            file: crates/birdnet-core/src/audio/extraction/convert.rs
            # The format-conversion + frequency-shift module. The arithmetic
            # (resample-rate, cents) and the ffmpeg codec-argument mapping
            # were extracted into pure helpers (freq_shift_resample_rate,
            # freq_shift_cents, ffmpeg_codec_args) so their mutants die to
            # unit tests that need no external tool. The command-execution
            # branches — ffmpeg success vs. non-zero exit, the sox fallback,
            # and the rename-on-failure path — are covered by tests that run
            # the real ffmpeg (gated on its presence; the CI image installs
            # it). 0 missed at introduction: 26 mutants, 23 caught, 3
            # unviable.
            max_missed: 0
          - label: sqlite/queries/detections.rs
            slug: sqlite-queries-detections.rs
            file: crates/birdnet-db/src/sqlite/queries/detections.rs
            package: birdnet-db
            # The detections-CRUD layer. PR #35 caught a positional-VALUES
            # / column-list-drift bug here; the explicit column list +
            # 30+ tests we have today should make every mutant
            # observable, but the gate stays at 0 missed so a future
            # regression of the same shape lights up immediately.
            max_missed: 0
          # ── Binary-crate shards (the birdnet-behavior binary) ───────────────
          # These mutate the binary's own modules, so every mutant relinks the
          # binary against the statically-bundled DuckDB. Three economics layers
          # keep that affordable (each measured on a warm target/):
          #   1. `--shard k/n` (deterministic under --no-shuffle): shards
          #      partition the mutant list with no overlap or gaps, each
          #      enforcing 0-missed on its slice, running in parallel.
          #   2. The `mutants` build profile (no debug info) + unit-test-only
          #      target selection (`-- --bins`): per-mutant cost dropped from
          #      ~132 s (full dev-profile build + whole suite incl. the
          #      binary-booting e2e tests) to ~36 s, and the baseline from
          #      90 s + 91 s to 16 s + 21 s — the integration executables are
          #      no longer rebuilt or run at all in the mutant loop.
          #   3. `--in-diff` on PRs: only mutants on changed lines are tested,
          #      so a one-line change tests ~1 mutant per touched shard and
          #      untouched shards finish in seconds ("No mutants to filter").
          #      Whole-file coverage is still enforced by the weekly cron,
          #      pushes to main, and manual dispatch, which skip the diff.
          # NOTE: the first run after the profile change pays a one-time cold
          # build of the deps under the new profile per cache key; subsequent
          # runs reuse it. Counts are sized to ~13 mutants/shard. The library
          # shards above need no split: no per-mutant DuckDB relink.

          # src/capture/schedule.rs — 107 mutants. Schedule parsing + the
          # hand-rolled UTC clock: `utc_now`'s date arithmetic was extracted into
          # the pure `civil_from_unix_secs`, cross-checked against an independent
          # inverse oracle for every calendar day across two centuries (every
          # month length, every leap day, the 2100 century rule) plus a proptest
          # round-trip, so its arithmetic mutants die; the parse helpers and
          # `resolve_location` have per-branch/boundary tests. 0 missed.
          - { label: "src/capture/schedule.rs [1/8]", slug: src-capture-schedule.rs-1, shard: "0/8", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/schedule.rs [2/8]", slug: src-capture-schedule.rs-2, shard: "1/8", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/schedule.rs [3/8]", slug: src-capture-schedule.rs-3, shard: "2/8", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/schedule.rs [4/8]", slug: src-capture-schedule.rs-4, shard: "3/8", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/schedule.rs [5/8]", slug: src-capture-schedule.rs-5, shard: "4/8", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/schedule.rs [6/8]", slug: src-capture-schedule.rs-6, shard: "5/8", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/schedule.rs [7/8]", slug: src-capture-schedule.rs-7, shard: "6/8", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/schedule.rs [8/8]", slug: src-capture-schedule.rs-8, shard: "7/8", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }

          # src/daemon/*.rs — 63 mutants across the orchestrator tree (split from
          # a single src/daemon.rs into {mod,config,disposition,webhook,
          # processor}.rs; the glob mutates every moved function — test_support.rs
          # is cfg(test) and generates none). 0 missed is held by:
          #   * config.rs      — per-config builders + resolve_f32_with_default /
          #     resolve_required_paths / species_thresholds_log_count, each with a
          #     unit test pinning every field/branch.
          #   * disposition.rs — decide_disposition, the confidence-%/latency
          #     arithmetic, and the boolean notification gates (passes_filter /
          #     should_dispatch_notification), all pure and unit-tested.
          #   * webhook.rs     — build_webhook_spec (unit-tested decision matrix);
          #     dispatch_webhook returns Result<u16, WebhookError> so its
          #     body-replacement mutant is unviable by return type.
          #   * processor.rs   — event_processor, covered by in-process
          #     integration tests (in-memory AppState + tempdir) for the
          #     accept / quarantine / drop / alert-rule paths.
          #   * mod.rs         — start_detection_daemon, covered by the in-process
          #     test against the tiny V2.4 ONNX model.
          - { label: "src/daemon/*.rs [1/5]", slug: src-daemon-1, shard: "0/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/daemon/*.rs [2/5]", slug: src-daemon-2, shard: "1/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/daemon/*.rs [3/5]", slug: src-daemon-3, shard: "2/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/daemon/*.rs [4/5]", slug: src-daemon-4, shard: "3/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/daemon/*.rs [5/5]", slug: src-daemon-5, shard: "4/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }

          # src/capture/supervisor.rs — 40 mutants. The field-survival core: a
          # dead arecord/ffmpeg subprocess is restarted with capped exponential
          # backoff, the recording schedule pauses/resumes capture, and the
          # birdnet_audio_source_up gauge is driven from real process health.
          # Every restart/backoff/schedule decision lives in `reconcile` + the
          # pure helpers (`backoff_delay`, `should_warn_down`,
          # `source_gauge_label`) behind the `Source` trait, so a fake source
          # drives each branch — death -> backoff -> recovery, the schedule gate,
          # the backoff-window boundary — without a real capture tool. 0 missed.
          - { label: "src/capture/supervisor.rs [1/3]", slug: src-capture-supervisor.rs-1, shard: "0/3", file: "src/capture/supervisor.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/supervisor.rs [2/3]", slug: src-capture-supervisor.rs-2, shard: "1/3", file: "src/capture/supervisor.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/supervisor.rs [3/3]", slug: src-capture-supervisor.rs-3, shard: "2/3", file: "src/capture/supervisor.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the PR jobs can compute the merge-base diff that
          # scopes mutation to changed lines (`--in-diff` below). The repo is
          # a few MB; a full clone is cheaper than a flaky shallow merge-base.
          fetch-depth: 0

      - name: Compute PR diff (incremental mutation scope)
        # On pull requests, mutate ONLY the lines this PR touches: a one-line
        # change in a 107-mutant file should test ~1 mutant, not 107. The
        # weekly cron, pushes to main, and manual dispatch skip this step and
        # run every shard's full mutant set, so whole-file coverage stays
        # enforced on a cadence while PR feedback stays fast.
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/${{ github.base_ref }}"...HEAD > pr.diff
          echo "diff spans $(grep -c '^+++' pr.diff) file(s)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Free disk space for the cache restore
        # The cached `target/` (a debug build whose test binaries each
        # statically link the bundled DuckDB) restores to ~15 GB. On a runner
        # with only ~14 GB free that overran the disk mid-extraction
        # (`tar: Wrote only N of M bytes` = ENOSPC), failing the job before
        # cargo-mutants ever ran. Drop the large preinstalled SDKs we never use
        # in a Rust job so the restore — and the per-mutant rebuilds on top of
        # it — have ample headroom.
        run: |
          echo "Disk before:"; df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after:"; df -h /

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Cache ONLY the `mutants` profile tree — the sole build dir this
          # job populates since the profile/scoping overhaul. The previous
          # `target/` cache carried the legacy dev-profile artifacts (full
          # debug info + every DuckDB-linking integration-test executable
          # the old per-mutant loop built) and had grown past what a runner
          # can even EXTRACT: the "Cache Cargo" restore step itself died on
          # ENOSPC before mutation testing ran. The `-v2-` key generation
          # orphans those oversized caches (GitHub evicts them); the first
          # run per shard pays a one-time cold dependency build, after which
          # the no-debuginfo cache stays a fraction of the old size.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/mutants/
          key: ${{ runner.os }}-mutants-v2-${{ matrix.label }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-v2-${{ matrix.label }}-
            ${{ runner.os }}-mutants-v2-

      - name: Install cargo-mutants
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-mutants

      - name: Install ffmpeg
        # The extractor.rs tests for the format-conversion / freq-shift
        # branches skip themselves when neither ffmpeg nor sox is on
        # PATH. We need the tests to actually run during mutation testing
        # (so the surviving-mutant count for those branches stays at 0),
        # so install ffmpeg unconditionally.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run mutation testing on ${{ matrix.file }}
        # `--file` restricts mutation to one source file at a time so each
        # matrix job's report stays focused. Test timeout, the debug-info-less
        # `mutants` build profile, and the unit-test-only scoping all live in
        # .cargo/mutants.toml so local `cargo mutants` runs share them.
        #
        # cargo-mutants exits 2 when any mutant survives — we don't want
        # that to fail the step, because the per-file threshold check
        # below is the gate that decides pass/fail. A build failure
        # (exit 4 from cargo-mutants) still propagates, so we only
        # swallow the specific "some mutants survived" exit code.
        #
        # `--package` defaults to `birdnet-core`; per-row matrix entries
        # can override via `matrix.package` for files in other workspace
        # crates or the binary itself.
        run: |
          set +e
          # Large files are split across jobs via the matrix `shard` field
          # ("k/n", k zero-based); cargo-mutants slices the mutant list
          # deterministically (with --no-shuffle below) so the shards partition
          # it with no overlap or gaps. Unsharded rows leave `shard` empty and
          # run the file's whole mutant set in one job.
          shard_args=()
          if [ -n "${{ matrix.shard }}" ]; then
            shard_args=(--shard "${{ matrix.shard }}")
          fi
          # PRs additionally scope to the merge-base diff (see the step
          # above): each shard then tests only its slice of the mutants on
          # CHANGED lines. Build profile (`mutants`, no debug info) and the
          # unit-test-only scoping live in .cargo/mutants.toml so local runs
          # get identical economics.
          diff_args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_args=(--in-diff pr.diff)
          fi
          # Unit-test-only target selection, per package kind: the root
          # binary package has no lib target (`--lib` hard-errors there),
          # and `--bins` on a lib-only crate would select nothing. See
          # .cargo/mutants.toml for why integration tests are excluded
          # from the mutant loop.
          pkg="${{ matrix.package || 'birdnet-core' }}"
          if [ "$pkg" = "birdnet-behavior" ]; then
            test_target=(--bins)
          else
            test_target=(--lib)
          fi
          cargo mutants \
            --workspace \
            --package "$pkg" \
            --file "${{ matrix.file }}" \
            --in-place \
            --no-shuffle \
            "${shard_args[@]}" \
            "${diff_args[@]}" \
            --json \
            -- "${test_target[@]}"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::cargo-mutants exited with status $status (not the survived-mutants exit code 2)"
            exit "$status"
          fi
          exit 0

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report-${{ matrix.slug }}
          path: mutants.out
          retention-days: 14

      - name: Summarise mutants
        if: always()
        id: summary
        run: |
          if [ ! -f mutants.out/outcomes.json ]; then
            echo "summary=No outcomes.json produced." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mutants=$(jq '[.outcomes[] | select((.scenario | type) == "object")] | length' mutants.out/outcomes.json)
          caught=$(jq '[.outcomes[] | select(.summary == "CaughtMutant")] | length' mutants.out/outcomes.json)
          missed=$(jq '[.outcomes[] | select(.summary == "MissedMutant")] | length' mutants.out/outcomes.json)
          unviable=$(jq '[.outcomes[] | select(.summary == "Unviable")] | length' mutants.out/outcomes.json)
          timeout=$(jq '[.outcomes[] | select(.summary == "Timeout")] | length' mutants.out/outcomes.json)
          echo "total=$mutants" >> "$GITHUB_OUTPUT"
          echo "caught=$caught" >> "$GITHUB_OUTPUT"
          echo "missed=$missed" >> "$GITHUB_OUTPUT"
          echo "unviable=$unviable" >> "$GITHUB_OUTPUT"
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"
          jq -r '[.outcomes[] | select(.summary == "MissedMutant") | "\(.scenario.Mutant.file):\(.scenario.Mutant.span.start.line)  \(.scenario.Mutant.name)"] | join("\n")' \
            mutants.out/outcomes.json > missed.txt
          {
            echo 'missed_table<<MUT_EOF'
            head -50 missed.txt
            echo 'MUT_EOF'
          } >> "$GITHUB_OUTPUT"
          # Per-job line in the Actions run summary, so sharded files (which do
          # not post a PR comment) still surface their counts in the UI.
          shard="${{ matrix.shard }}"
          {
            printf '### 🧬 `%s`%s\n\n' "${{ matrix.file }}" "${shard:+ (shard $shard)}"
            printf '| total | caught | missed | unviable | timeout |\n'
            printf '| --- | --- | --- | --- | --- |\n'
            printf '| %s | %s | %s | %s | %s |\n' "$mutants" "$caught" "$missed" "$unviable" "$timeout"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment summary on PR
        # Only unsharded rows comment: a sharded file would otherwise post one
        # comment per shard (e.g. 8 for schedule.rs), burying the PR. Each
        # shard's counts still land in the job's Step Summary (above) and its
        # artifact, and its pass/fail shows as its own check.
        if: github.event_name == 'pull_request' && always() && ! matrix.shard
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: mutants-${{ matrix.slug }}
          message: |
            ### 🧬 Mutation testing on `${{ matrix.file }}`

            | Outcome | Count |
            | --- | --- |
            | Total mutants | ${{ steps.summary.outputs.total }} |
            | Caught (tests failed → good) | ${{ steps.summary.outputs.caught }} |
            | **Missed (tests passed → tighten an assertion)** | **${{ steps.summary.outputs.missed }}** |
            | Unviable (would not compile) | ${{ steps.summary.outputs.unviable }} |
            | Timeout | ${{ steps.summary.outputs.timeout }} |

            Threshold for this file: **`missed > ${{ matrix.max_missed }}` fails the gate**.

            <details>
            <summary>Missed mutants (top 50)</summary>

            ```
            ${{ steps.summary.outputs.missed_table }}
            ```
            </details>

            Full report: see the `mutants-report-${{ matrix.slug }}` artifact on this run.

      - name: Fail if too many mutants survived
        # Per-file threshold from the matrix above.
        run: |
          missed="${{ steps.summary.outputs.missed }}"
          limit="${{ matrix.max_missed }}"
          if [ -z "$missed" ]; then
            echo "::warning::no missed-mutants count produced; treating as 0"
            exit 0
          fi
          if [ "$missed" -gt "$limit" ]; then
            echo "::error::$missed mutants survived in ${{ matrix.file }} (limit $limit); tighten the assertions"
            exit 1
          fi
