# Mutation testing across the most regression-prone modules.
#
# `cargo-mutants` rewrites the source under test in small, well-defined
# ways (replace a `>` with `<`, return `Default::default()`, drop a branch,
# etc.) and re-runs the test suite. A mutant that survives means the
# tests pass even though the module's behaviour was changed — almost
# always a sign that the assertion is too weak.
#
# Scope per the carryover-from-PR-#35 plan in CLAUDE.md, ratcheted
# outward one module at a time:
#
#   1. crates/birdnet-core/src/config/validate.rs  — first expansion;
#      0 missed at last run. This is the canonical gate.
#   2. crates/birdnet-core/src/inference/model.rs  — added after the
#      sigmoid-on-probabilities bug shipped despite unit-test coverage.
#   3. crates/birdnet-core/src/audio/extraction/extractor.rs — added
#      after the range-inversion clip-extraction bug shipped likewise.
#      Its sibling crates/birdnet-core/src/audio/extraction/convert.rs
#      (ffmpeg/sox format conversion + frequency shift) joined the matrix
#      once its arithmetic and codec-arg mapping were extracted into pure
#      helpers and its command-execution branches covered by ffmpeg-gated
#      tests — 0 missed (26 mutants: 23 caught, 3 unviable).
#   4. crates/birdnet-db/src/sqlite/queries/detections/*.rs — added so the
#      "explicit column list" + UNIQUE-on-chunk-offset contracts that
#      PR #35 fixed can't quietly regress. The full CRUD surface is
#      now under tests, so the gate stays at 0 missed.
#      This row named `detections.rs` until 0.14.0. That file stopped
#      existing in 0.7.2 (#145), which split it into a directory, and the
#      job went on reporting success for two months while mutating nothing:
#      no source matched, no mutants were generated, and the threshold step
#      read the resulting empty count as "0 missed". Item 6 below warns
#      about precisely this move dropping a file out of coverage; it had
#      already happened here. The threshold step now fails a non-PR run that
#      generates zero mutants, so the next stale path announces itself
#      instead of going quietly green.
#   7. crates/birdnet-db/src/migration.rs — the migration list and the
#      pre-migration backup. Migration 24 rewrites rows that already exist
#      and cannot be undone, so the predicates choosing which rows move, and
#      the branch deciding whether a backup was taken, are where a surviving
#      mutant costs an operator their history rather than a test run.
#   5. src/daemon/ — the daemon orchestrator. The inline struct-literal
#      "delete field" mutants the PR #50 carryover flagged were dissolved
#      by extracting per-config builder helpers (`build_pipeline_config`,
#      `build_model_config`, `build_species_filter_config`,
#      `build_extraction_config`) plus smaller pure helpers for the inline
#      arithmetic / boolean / boundary checks that no test could observe
#      before. The orchestrator's body-replacement mutants (return None,
#      return ()) are caught by in-process integration tests that exercise
#      `start_detection_daemon` and `event_processor` against the tiny
#      V2.4 ONNX model bundled at
#      `crates/birdnet-core/src/testdata/tiny_v24_test.onnx`. Originally a
#      single src/daemon.rs; split into src/daemon/{mod,config,disposition,
#      webhook,processor}.rs for readability, so the gate globs the dir.
#   6. crates/birdnet-core/src/civil.rs — not an outward ratchet so much as
#      following the code: the Hinnant civil-date arithmetic used to live in
#      src/capture/schedule.rs (already in this matrix) and moved down here
#      when the capture tee began formatting the same calendar into segment
#      filenames. Without this row that move would have silently dropped it
#      out of mutation coverage, and the stakes went *up* with the move —
#      a wrong day here is a wrong `Date` on every detection, because the
#      recording filename is the timestamp.
#
# Each file is its own matrix job so a survivor in one doesn't tank the
# whole pipeline. Per-file threshold: 0 missed on every file — we follow
# the PR #49 pattern (refactor the source until the boundary is
# observable, never lift the threshold) rather than letting mutants
# accumulate.
#
# Runs on:
#   - PRs that touch any of the in-scope files (path filter below)
#   - Weekly cron so the mutant catalogue stays fresh
#   - Manual dispatch

name: Mutation testing

on:
  push:
    branches: ["main", "master"]
    paths:
      - "crates/birdnet-core/src/config/**"
      - "crates/birdnet-core/src/inference/**"
      - "crates/birdnet-core/src/audio/extraction/**"
      - "crates/birdnet-core/src/civil.rs"
      - "crates/birdnet-core/tests/**"
      - "crates/birdnet-db/src/sqlite/queries/detections/**"
      - "crates/birdnet-db/src/migration.rs"
      - "src/daemon/**"
      - "src/capture/**"
      # The config job checks every workflow (timeouts and their
      # `# observed` annotations), so an edit to any of them re-runs it.
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "crates/birdnet-core/src/config/**"
      - "crates/birdnet-core/src/inference/**"
      - "crates/birdnet-core/src/audio/extraction/**"
      - "crates/birdnet-core/src/civil.rs"
      - "crates/birdnet-core/tests/**"
      - "crates/birdnet-db/src/sqlite/queries/detections/**"
      - "crates/birdnet-db/src/migration.rs"
      - "src/daemon/**"
      - "src/capture/**"
      # The config job checks every workflow (timeouts and their
      # `# observed` annotations), so an edit to any of them re-runs it.
      - ".github/workflows/**"
  schedule:
    # Mondays at 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Check 4 in scripts/check-ci-config.py reads each job's recent wall-clock
  # from the Actions API to compare it against the timeout it declares.
  actions: read

jobs:
  # Config checks first: they cost about a minute and they cover the three ways
  # this matrix has silently stopped testing things — a row aimed at a path that
  # no longer exists, a shard that is empty by construction, and a job with no
  # timeout. All three previously shipped and stayed broken for weeks, because
  # each fails in a direction that looks fine from the outside. See
  # scripts/check-ci-config.py for the incident behind every assertion.
  config:
    name: CI config (paths, shards, timeouts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # observed 1m01s
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install cargo-mutants
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-mutants
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Check the CI configuration
        # `cargo mutants --list` parses the workspace; it builds nothing, so the
        # whole job is dominated by checkout and the tool install.
        #
        # GITHUB_TOKEN is not in a `run:` step's environment by default, and
        # checks 4 and 5 need it to read run history. Without it they report
        # themselves broken rather than passing quietly.
        #
        # If check 5 fails, the `# observed` annotations are stale. They are
        # generated, not hand-written — regenerate and commit:
        #     python3 scripts/check-ci-config.py --update-observed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-ci-config.py

  mutants:
    name: cargo-mutants on ${{ matrix.label }}
    runs-on: ubuntu-24.04
    # Matrix-driven so the slow binary-crate shards get a longer budget. The
    # binary-crate shards (the binary's own src/daemon/ + src/capture/* modules)
    # relink the statically-bundled DuckDB per mutant, so the larger files are
    # split across several `--shard` jobs (see the matrix) and each sets
    # `timeout_minutes: 120`. Splitting keeps the critical path near one
    # baseline build instead of growing with the whole file's mutant count,
    # which had been overrunning the wall.
    #
    # This used to say the library-crate rows (birdnet-core / birdnet-db) reuse
    # a warm `target/` and "finish well inside 45 min", so they needed no split.
    # That stopped being true: the detections glob reached 109 mutants and was
    # cancelled at the 45-minute default on three consecutive full runs without
    # anyone noticing, because a timeout renders as "cancelled" rather than
    # "failed". Mutant count, not crate kind, decides whether a row fits — size
    # a row by counting (`cargo mutants --list --package P --file F | wc -l`),
    # not by which crate it lives in.
    timeout-minutes: ${{ matrix.timeout_minutes || 45 }}
    strategy:
      # One file's surviving mutants must not abort the rest of the matrix —
      # we want the PR comment to show the full landscape across all scoped
      # files, not just whichever finished first.
      fail-fast: false
      matrix:
        include:
          # `slug` is the same as `label` with forward slashes replaced
          # by hyphens so it can appear in artifact names (GitHub
          # rejects `/` in artifact names — see
          # https://docs.github.com/en/actions/using-workflows/storing-workflow-data-as-artifacts).
          #
          # Two shards. Unsharded, the validator had reached 67 mutants and
          # 39m00s against the 45-minute default — 87% of budget, and on the
          # same trajectory that took the detections row down: a timeout
          # renders as "cancelled", so the row would have stopped gating
          # without ever going red, and nobody would have been told. Split
          # before that rather than after, on the measured precedent of
          # db/migration.rs below, which was split at half this level of risk.
          # 67 over 2 is 34 33, the same slice size as the shards that run
          # 12-16 min. Guard: (n-1)*ceil(67/2) = 34 < 67.
          #
          # `check_duration_headroom` in scripts/check-ci-config.py now watches
          # for the next row on this trajectory, so the next one is found by CI
          # rather than by reading run times by hand.
          #
          # The validator has been mutation-clean since it was added; any
          # regression at all is a real test-coverage gap, so both shards keep
          # max_missed at 0.
          - { label: "validate.rs [1/2]", slug: validate.rs-1, shard: "0/2", file: crates/birdnet-core/src/config/validate.rs, max_missed: 0 }
          - { label: "validate.rs [2/2]", slug: validate.rs-2, shard: "1/2", file: crates/birdnet-core/src/config/validate.rs, max_missed: 0 }
          - label: inference/model.rs
            slug: inference-model.rs
            file: crates/birdnet-core/src/inference/model.rs
            # Wrapper-method mutants on `BirdNetModel` (`infer_sample_rate`,
            # `recommended_chunk_samples`, `is_probability_output`,
            # setters, `predict`) used to be uncatchable without a real
            # 541 MB BirdNET+ model. Two tiny (~220-byte) embedded ONNX
            # models — `tiny_v24_test.onnx` and `tiny_v30_test.onnx` —
            # now let those methods run inside unit tests. Threshold set
            # to 0 because every mutant has a covering test today.
            max_missed: 0
          - label: audio/extraction/extractor.rs
            slug: audio-extraction-extractor.rs
            file: crates/birdnet-core/src/audio/extraction/extractor.rs
            # Threshold 0 — every remaining mutant on the spacer
            # arithmetic, the `||` predicate that gates conversion, the
            # freq-shift fallback, and the WAV-metadata-embed branch is
            # now covered by a dedicated test. The freq-shift and
            # format-conversion tests skip themselves when neither
            # ffmpeg nor sox is on PATH so a stripped-down CI runner
            # doesn't false-fail; the main CI image has ffmpeg.
            max_missed: 0
          - label: audio/extraction/convert.rs
            slug: audio-extraction-convert.rs
            file: crates/birdnet-core/src/audio/extraction/convert.rs
            # The format-conversion + frequency-shift module. The arithmetic
            # (resample-rate, cents) and the ffmpeg codec-argument mapping
            # were extracted into pure helpers (freq_shift_resample_rate,
            # freq_shift_cents, ffmpeg_codec_args) so their mutants die to
            # unit tests that need no external tool. The command-execution
            # branches — ffmpeg success vs. non-zero exit, the sox fallback,
            # and the rename-on-failure path — are covered by tests that run
            # the real ffmpeg (gated on its presence; the CI image installs
            # it). 0 missed at introduction: 26 mutants, 23 caught, 3
            # unviable.
            max_missed: 0
          # Added when the capture tee started formatting segment filenames:
          # the Hinnant civil-date arithmetic moved down here out of
          # src/capture/schedule.rs (which now delegates), and without this
          # row that move would have quietly dropped it out of the mutation
          # matrix. It is also load-bearing in a new way — a wrong day here
          # is a wrong `Date` on every detection, because the filename *is*
          # the timestamp. 0 missed at introduction: 82 caught, 1 unviable.
          #
          # Three shards, sized from measurement rather than from the ~13 and
          # ~28 mutants/shard figures the rows around this one use — those were
          # measured on files whose mutants are far more expensive than this
          # one's. Fitting the two costs from run history:
          #
          #   full run on main, 181 mutants          21.9 min
          #   PR run, `--in-diff`, ~baseline only     4.9 min
          #   => baseline build ~4.9 min, ~5.6 s per mutant
          #
          # The file has since reached 307 mutants — it became the workspace's
          # one home for this arithmetic, absorbing ten scattered copies — and
          # unsharded that projects to 33.7 min, which is 75% of the 45-minute
          # budget: exactly the threshold, so it fails. Three shards put each at
          # ~14.6 min (32%), which leaves room for the file to roughly double
          # again before this needs revisiting. Four would buy 5 min for a
          # fourth cold baseline build, which is not worth it.
          #
          # Guard against the empty-tail-shard bug this matrix has hit before:
          # ceil(307/3) = 103, and (3-1)*103 = 206 < 307, so every shard gets
          # work.
          #
          # ## Renaming a row costs one slow run — do not resize budgets from it
          #
          # The Cargo cache below is keyed on `matrix.label`, and its last
          # restore-key is the bare `<os>-mutants-v2-`. A row whose label is
          # *new* therefore has no cache of its own and restores an arbitrary
          # other row's `target/mutants/` — which, when that row builds the
          # binary crate, is a DuckDB- and ONNX-linked tree this job cannot
          # use. That is worse than cold: cargo invalidates it and rebuilds
          # anyway.
          #
          # Splitting `civil.rs` into three retired one label and created three
          # that had never run. Measured across the two runs that followed:
          #
          #   first run, foreign cache   civil.rs [1/3]        45.4m (wall)
          #                              civil.rs [3/3]        44.0m
          #                              db/migration.rs [1/2] 45.4m (wall)
          #                              detections [1..4/4]   all ~45m
          #   next run, own cache        civil.rs [1/3]         9.5m
          #                              civil.rs [3/3]         7.2m
          #                              db/migration.rs [1/2]  8.1m
          #                              detections [1..4/4]  6.9-10.0m
          #
          # Eight rows spent 45 minutes each learning that, and the `CI config`
          # job reported every one as "used 45m of its 45m budget" — true, and
          # nothing to do with the code. `validate.rs` was briefly given a
          # 60-minute budget on the strength of one such sample; it takes three
          # minutes with its own cache, and the override is gone again.
          #
          # So: expect one bad run after any re-shard or rename, and size
          # nothing from it. The underlying fix is to stop `target/mutants/`
          # sharing a restore-key across rows — `~/.cargo/registry/` is the
          # only part of that cache worth pooling between them.
          - { label: "civil.rs [1/3]", slug: civil.rs-1, shard: "0/3", file: crates/birdnet-core/src/civil.rs, max_missed: 0 }
          - { label: "civil.rs [2/3]", slug: civil.rs-2, shard: "1/3", file: crates/birdnet-core/src/civil.rs, max_missed: 0 }
          - { label: "civil.rs [3/3]", slug: civil.rs-3, shard: "2/3", file: crates/birdnet-core/src/civil.rs, max_missed: 0 }
          # Globbed, because this stopped being one file in 0.7.2 (#145),
          # which split it into mod/read/write/search/locks. The matrix kept
          # naming `detections.rs` and nothing noticed for two months: the
          # job matched no source, produced no mutants, and the gate below
          # read an empty count as "0 missed" and went green. The comment on
          # civil.rs one row up warns about exactly this move dropping a file
          # out of coverage — it happened here instead, and silently.
          #
          # The detections-CRUD layer. PR #35 caught a positional-VALUES /
          # column-list-drift bug here; the explicit column list + 30+ tests we
          # have today should make every mutant observable, but the gate stays
          # at 0 missed so a future regression of the same shape lights up
          # immediately.
          #
          # Four shards, and the reason is measured rather than assumed: the
          # glob now yields 109 mutants, and unsharded it did not fit the
          # 45-minute default — it was cancelled at 45m on three separate full
          # mutant runs (the v0.14.0-era push, and twice more, the second on a
          # completely idle runner pool, which rules out contention). A
          # timeout renders as "cancelled", which reads as benign, so this row
          # had never once completed a full run and its gate had never
          # actually gated. Splitting is the fix rather than a bigger budget:
          # 109/4 is 28 28 28 25 (measured, not derived), in the same range as
          # src/daemon/*.rs at 20/shard, which finishes comfortably. Shard
          # counts here must also satisfy `(n-1)*ceil(total/n) < total` or the
          # tail shard is empty by construction — see src/capture/schedule.rs
          # below; at n=4 that is 84 < 109.
          - { label: "sqlite/queries/detections/*.rs [1/4]", slug: sqlite-queries-detections-1, shard: "0/4", file: "crates/birdnet-db/src/sqlite/queries/detections/*.rs", package: birdnet-db, max_missed: 0 }
          - { label: "sqlite/queries/detections/*.rs [2/4]", slug: sqlite-queries-detections-2, shard: "1/4", file: "crates/birdnet-db/src/sqlite/queries/detections/*.rs", package: birdnet-db, max_missed: 0 }
          - { label: "sqlite/queries/detections/*.rs [3/4]", slug: sqlite-queries-detections-3, shard: "2/4", file: "crates/birdnet-db/src/sqlite/queries/detections/*.rs", package: birdnet-db, max_missed: 0 }
          - { label: "sqlite/queries/detections/*.rs [4/4]", slug: sqlite-queries-detections-4, shard: "3/4", file: "crates/birdnet-db/src/sqlite/queries/detections/*.rs", package: birdnet-db, max_missed: 0 }
          # Two shards. 56 mutants unsharded took 23m13s — the longest job in
          # the matrix and the next one that would have hit the 45-minute wall
          # as it grew, which is exactly how the detections row went unnoticed.
          # 56 over 2 is 28 28 (measured), the same slice size as the detections
          # shards, which run 12-16 min. Guard: (n-1)*ceil(56/2) = 28 < 56.
          # Added with the pre-migration backup and the `--migration-report`
          # dry-run. Migration 24 rewrites rows that already exist and cannot
          # be undone, so the predicates deciding *which* rows move, and the
          # branch deciding whether a backup was taken at all, are the two
          # places where a survived mutant costs an operator their history.
          - { label: "db/migration.rs [1/2]", slug: db-migration.rs-1, shard: "0/2", file: crates/birdnet-db/src/migration.rs, package: birdnet-db, max_missed: 0 }
          - { label: "db/migration.rs [2/2]", slug: db-migration.rs-2, shard: "1/2", file: crates/birdnet-db/src/migration.rs, package: birdnet-db, max_missed: 0 }
          # ── Binary-crate shards (the birdnet-behavior binary) ───────────────
          # These mutate the binary's own modules, so every mutant relinks the
          # binary against the statically-bundled DuckDB. Three economics layers
          # keep that affordable (each measured on a warm target/):
          #   1. `--shard k/n` (deterministic under --no-shuffle): shards
          #      partition the mutant list with no overlap or gaps, each
          #      enforcing 0-missed on its slice, running in parallel.
          #   2. The `mutants` build profile (no debug info) + unit-test-only
          #      target selection (`-- --bins`): per-mutant cost dropped from
          #      ~132 s (full dev-profile build + whole suite incl. the
          #      binary-booting e2e tests) to ~36 s, and the baseline from
          #      90 s + 91 s to 16 s + 21 s — the integration executables are
          #      no longer rebuilt or run at all in the mutant loop.
          #   3. `--in-diff` on PRs: only mutants on changed lines are tested,
          #      so a one-line change tests ~1 mutant per touched shard and
          #      untouched shards finish in seconds ("No mutants to filter").
          #      Whole-file coverage is still enforced by the weekly cron,
          #      pushes to main, and manual dispatch, which skip the diff.
          # NOTE: the first run after the profile change pays a one-time cold
          # build of the deps under the new profile per cache key; subsequent
          # runs reuse it. Counts are sized to ~13 mutants/shard. The library
          # shards above need no split: no per-mutant DuckDB relink.

          # src/capture/schedule.rs — 41 mutants. Schedule parsing + the
          # hand-rolled UTC clock: `utc_now`'s date arithmetic was extracted into
          # the pure `civil_from_unix_secs`, cross-checked against an independent
          # inverse oracle for every calendar day across two centuries (every
          # month length, every leap day, the 2100 century rule) plus a proptest
          # round-trip, so its arithmetic mutants die; the parse helpers and
          # `resolve_location` have per-branch/boundary tests. 0 missed.
          #
          # Three shards, not eight. cargo-mutants partitions a shard set into
          # CONTIGUOUS blocks of `ceil(total / n)`, so the tail shard is empty
          # whenever `(n - 1) * ceil(total / n) >= total`. At 41 mutants over 8
          # shards that is 6·7 = 42 >= 41: shard 7/8 got zero mutants on every
          # single run, which the (correct) no-vacuous-pass gate below failed —
          # red on `main` from the v0.14.0 merge onward. Measured 8-shard split:
          # 6 6 6 6 6 6 5 0. At n=3 it is 14 14 13, and the row matches the
          # ~13-mutants/shard sizing this matrix documents rather than paying
          # eight cold DuckDB+ONNX builds to test 41 mutants.
          - { label: "src/capture/schedule.rs [1/3]", slug: src-capture-schedule.rs-1, shard: "0/3", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/schedule.rs [2/3]", slug: src-capture-schedule.rs-2, shard: "1/3", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/schedule.rs [3/3]", slug: src-capture-schedule.rs-3, shard: "2/3", file: "src/capture/schedule.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }

          # src/daemon/*.rs — 100 mutants across the orchestrator tree (split from
          # a single src/daemon.rs into {mod,config,disposition,webhook,
          # processor}.rs; the glob mutates every moved function — test_support.rs
          # is cfg(test) and generates none). 0 missed is held by:
          #   * config.rs      — per-config builders + resolve_f32_with_default /
          #     resolve_required_paths / species_thresholds_log_count, each with a
          #     unit test pinning every field/branch.
          #   * disposition.rs — decide_disposition, the confidence-%/latency
          #     arithmetic, and the boolean notification gates (passes_filter /
          #     should_dispatch_notification), all pure and unit-tested.
          #   * webhook.rs     — build_webhook_spec (unit-tested decision matrix);
          #     dispatch_webhook returns Result<u16, WebhookError> so its
          #     body-replacement mutant is unviable by return type.
          #   * processor.rs   — event_processor, covered by in-process
          #     integration tests (in-memory AppState + tempdir) for the
          #     accept / quarantine / drop / alert-rule paths.
          #   * mod.rs         — start_detection_daemon, covered by the in-process
          #     test against the tiny V2.4 ONNX model.
          - { label: "src/daemon/*.rs [1/5]", slug: src-daemon-1, shard: "0/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/daemon/*.rs [2/5]", slug: src-daemon-2, shard: "1/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/daemon/*.rs [3/5]", slug: src-daemon-3, shard: "2/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/daemon/*.rs [4/5]", slug: src-daemon-4, shard: "3/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/daemon/*.rs [5/5]", slug: src-daemon-5, shard: "4/5", file: "src/daemon/*.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }

          # src/capture/supervisor.rs — 50 mutants. The field-survival core: a
          # dead arecord/ffmpeg subprocess is restarted with capped exponential
          # backoff, the recording schedule pauses/resumes capture, and the
          # birdnet_audio_source_up gauge is driven from real process health.
          # Every restart/backoff/schedule decision lives in `reconcile` + the
          # pure helpers (`backoff_delay`, `should_warn_down`,
          # `source_gauge_label`) behind the `Source` trait, so a fake source
          # drives each branch — death -> backoff -> recovery, the schedule gate,
          # the backoff-window boundary — without a real capture tool. 0 missed.
          - { label: "src/capture/supervisor.rs [1/3]", slug: src-capture-supervisor.rs-1, shard: "0/3", file: "src/capture/supervisor.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/supervisor.rs [2/3]", slug: src-capture-supervisor.rs-2, shard: "1/3", file: "src/capture/supervisor.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
          - { label: "src/capture/supervisor.rs [3/3]", slug: src-capture-supervisor.rs-3, shard: "2/3", file: "src/capture/supervisor.rs", package: birdnet-behavior, timeout_minutes: 120, max_missed: 0 }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the PR jobs can compute the merge-base diff that
          # scopes mutation to changed lines (`--in-diff` below). The repo is
          # a few MB; a full clone is cheaper than a flaky shallow merge-base.
          fetch-depth: 0

      - name: Compute PR diff (incremental mutation scope)
        # On pull requests, mutate ONLY the lines this PR touches: a one-line
        # change in a 107-mutant file should test ~1 mutant, not 107. The
        # weekly cron, pushes to main, and manual dispatch skip this step and
        # run every shard's full mutant set, so whole-file coverage stays
        # enforced on a cadence while PR feedback stays fast.
        if: github.event_name == 'pull_request'
        run: |
          git diff "origin/${{ github.base_ref }}"...HEAD > pr.diff
          echo "diff spans $(grep -c '^+++' pr.diff) file(s)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Free disk space for the cache restore
        # The cached `target/` (a debug build whose test binaries each
        # statically link the bundled DuckDB) restores to ~15 GB. On a runner
        # with only ~14 GB free that overran the disk mid-extraction
        # (`tar: Wrote only N of M bytes` = ENOSPC), failing the job before
        # cargo-mutants ever ran. Drop the large preinstalled SDKs we never use
        # in a Rust job so the restore — and the per-mutant rebuilds on top of
        # it — have ample headroom.
        run: |
          echo "Disk before:"; df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "Disk after:"; df -h /

      - name: Cache the mutants build tree
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Cache ONLY the `mutants` profile tree — the sole build dir this
          # job populates since the profile/scoping overhaul. The previous
          # `target/` cache carried the legacy dev-profile artifacts (full
          # debug info + every DuckDB-linking integration-test executable
          # the old per-mutant loop built) and had grown past what a runner
          # can even EXTRACT: the restore step itself died on
          # ENOSPC before mutation testing ran. The `-v2-` key generation
          # orphans those oversized caches (GitHub evicts them); the first
          # run per shard pays a one-time cold dependency build, after which
          # the no-debuginfo cache stays a fraction of the old size.
          #
          # Two things with different sharing rules used to live in one entry,
          # and pooling them was actively harmful. The registry is identical
          # for every row and worth sharing. `target/mutants/` is not: it holds
          # compiled artifacts for one package, and the last restore-key was
          # the bare `<os>-mutants-v2-`, so a row with no cache of its own —
          # any row that has just been renamed or re-sharded — restored some
          # other row's build tree. When that row builds the binary crate it is
          # a DuckDB- and ONNX-linked tree a `birdnet-core` job cannot use, so
          # cargo invalidated it and rebuilt from scratch, having first paid to
          # download and extract it. Measured cost of that: eight rows at
          # 45 minutes each, against 7-10 minutes once each had its own entry.
          #
          # So the build tree is keyed strictly per row now and never falls
          # back to another one's. A renamed row starts genuinely cold, which
          # is the honest price of renaming it and is cheaper than starting
          # wrong.
          #
          # The second restore-key is the *old* combined key, still scoped to
          # this row's label. Without it, changing the key prefix would throw
          # away every warm cache in the repository at once and make the first
          # run after this commit as slow as the incident it fixes — for no
          # reason, since an archive saved under `-v2-<this label>-` holds this
          # row's own tree. It is safe precisely because the label is in it;
          # the registry entry below deliberately has no such fallback, because
          # its key carries no label and `actions/cache` restores an archive's
          # full contents, so falling back there would drag some other row's
          # tree in and reintroduce the bug.
          path: |
            target/mutants/
          key: ${{ runner.os }}-mutants-tree-v1-${{ matrix.label }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-tree-v1-${{ matrix.label }}-
            ${{ runner.os }}-mutants-v2-${{ matrix.label }}-

      - name: Cache the Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Shared across every row on purpose: the dependency downloads are
          # identical whatever file a row mutates, and pooling them is what
          # stops 26 rows each fetching the same crates from scratch. This is
          # the half of the old combined entry that was worth sharing.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-mutants-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-mutants-registry-v1-

      - name: Install cargo-mutants
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-mutants

      - name: Install ffmpeg
        # The extractor.rs tests for the format-conversion / freq-shift
        # branches skip themselves when neither ffmpeg nor sox is on
        # PATH. We need the tests to actually run during mutation testing
        # (so the surviving-mutant count for those branches stays at 0),
        # so install ffmpeg unconditionally.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run mutation testing on ${{ matrix.file }}
        # `--file` restricts mutation to one source file at a time so each
        # matrix job's report stays focused. Test timeout, the debug-info-less
        # `mutants` build profile, and the unit-test-only scoping all live in
        # .cargo/mutants.toml so local `cargo mutants` runs share them.
        #
        # cargo-mutants exits 2 when any mutant survives — we don't want
        # that to fail the step, because the per-file threshold check
        # below is the gate that decides pass/fail. A build failure
        # (exit 4 from cargo-mutants) still propagates, so we only
        # swallow the specific "some mutants survived" exit code.
        #
        # `--package` defaults to `birdnet-core`; per-row matrix entries
        # can override via `matrix.package` for files in other workspace
        # crates or the binary itself.
        run: |
          set +e
          # Large files are split across jobs via the matrix `shard` field
          # ("k/n", k zero-based); cargo-mutants slices the mutant list
          # deterministically (with --no-shuffle below) so the shards partition
          # it with no overlap or gaps. Unsharded rows leave `shard` empty and
          # run the file's whole mutant set in one job.
          shard_args=()
          if [ -n "${{ matrix.shard }}" ]; then
            shard_args=(--shard "${{ matrix.shard }}")
          fi
          # PRs additionally scope to the merge-base diff (see the step
          # above): each shard then tests only its slice of the mutants on
          # CHANGED lines. Build profile (`mutants`, no debug info) and the
          # unit-test-only scoping live in .cargo/mutants.toml so local runs
          # get identical economics.
          diff_args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_args=(--in-diff pr.diff)
          fi
          # Unit-test-only target selection, per package kind: the root
          # binary package has no lib target (`--lib` hard-errors there),
          # and `--bins` on a lib-only crate would select nothing. See
          # .cargo/mutants.toml for why integration tests are excluded
          # from the mutant loop.
          pkg="${{ matrix.package || 'birdnet-core' }}"
          if [ "$pkg" = "birdnet-behavior" ]; then
            test_target=(--bins)
          else
            test_target=(--lib)
          fi
          cargo mutants \
            --workspace \
            --package "$pkg" \
            --file "${{ matrix.file }}" \
            --in-place \
            --no-shuffle \
            "${shard_args[@]}" \
            "${diff_args[@]}" \
            --json \
            -- "${test_target[@]}"
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "::error::cargo-mutants exited with status $status (not the survived-mutants exit code 2)"
            exit "$status"
          fi
          exit 0

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-report-${{ matrix.slug }}
          path: mutants.out
          retention-days: 14

      - name: Summarise mutants
        if: always()
        id: summary
        run: |
          if [ ! -f mutants.out/outcomes.json ]; then
            echo "summary=No outcomes.json produced." >> "$GITHUB_OUTPUT"
            # `total` must still be emitted, and as a number: the gate below
            # distinguishes "ran and found nothing to mutate" from "did not
            # run", and it cannot do that if this path leaves every output
            # unset.
            echo "total=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mutants=$(jq '[.outcomes[] | select((.scenario | type) == "object")] | length' mutants.out/outcomes.json)
          caught=$(jq '[.outcomes[] | select(.summary == "CaughtMutant")] | length' mutants.out/outcomes.json)
          missed=$(jq '[.outcomes[] | select(.summary == "MissedMutant")] | length' mutants.out/outcomes.json)
          unviable=$(jq '[.outcomes[] | select(.summary == "Unviable")] | length' mutants.out/outcomes.json)
          timeout=$(jq '[.outcomes[] | select(.summary == "Timeout")] | length' mutants.out/outcomes.json)
          echo "total=$mutants" >> "$GITHUB_OUTPUT"
          echo "caught=$caught" >> "$GITHUB_OUTPUT"
          echo "missed=$missed" >> "$GITHUB_OUTPUT"
          echo "unviable=$unviable" >> "$GITHUB_OUTPUT"
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"
          jq -r '[.outcomes[] | select(.summary == "MissedMutant") | "\(.scenario.Mutant.file):\(.scenario.Mutant.span.start.line)  \(.scenario.Mutant.name)"] | join("\n")' \
            mutants.out/outcomes.json > missed.txt
          {
            echo 'missed_table<<MUT_EOF'
            head -50 missed.txt
            echo 'MUT_EOF'
          } >> "$GITHUB_OUTPUT"
          # Per-job line in the Actions run summary, so sharded files (which do
          # not post a PR comment) still surface their counts in the UI.
          shard="${{ matrix.shard }}"
          {
            printf '### 🧬 `%s`%s\n\n' "${{ matrix.file }}" "${shard:+ (shard $shard)}"
            printf '| total | caught | missed | unviable | timeout |\n'
            printf '| --- | --- | --- | --- | --- |\n'
            printf '| %s | %s | %s | %s | %s |\n' "$mutants" "$caught" "$missed" "$unviable" "$timeout"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment summary on PR
        # Only unsharded rows comment: a sharded file would otherwise post one
        # comment per shard (e.g. 5 for src/daemon/*.rs), burying the PR. Each
        # shard's counts still land in the job's Step Summary (above) and its
        # artifact, and its pass/fail shows as its own check.
        if: github.event_name == 'pull_request' && always() && ! matrix.shard
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: mutants-${{ matrix.slug }}
          message: |
            ### 🧬 Mutation testing on `${{ matrix.file }}`

            | Outcome | Count |
            | --- | --- |
            | Total mutants | ${{ steps.summary.outputs.total }} |
            | Caught (tests failed → good) | ${{ steps.summary.outputs.caught }} |
            | **Missed (tests passed → tighten an assertion)** | **${{ steps.summary.outputs.missed }}** |
            | Unviable (would not compile) | ${{ steps.summary.outputs.unviable }} |
            | Timeout | ${{ steps.summary.outputs.timeout }} |

            Threshold for this file: **`missed > ${{ matrix.max_missed }}` fails the gate**.

            <details>
            <summary>Missed mutants (top 50)</summary>

            ```
            ${{ steps.summary.outputs.missed_table }}
            ```
            </details>

            Full report: see the `mutants-report-${{ matrix.slug }}` artifact on this run.

      - name: Fail if too many mutants survived
        # Per-file threshold from the matrix above.
        run: |
          missed="${{ steps.summary.outputs.missed }}"
          total="${{ steps.summary.outputs.total }}"
          limit="${{ matrix.max_missed }}"

          # A job that mutated nothing proved nothing, and must not read as a
          # pass. This used to `exit 0` on an empty count, which is how the
          # `detections.rs` row survived two months of pointing at a path that
          # had been split into a directory: no source matched, no mutants were
          # generated, the count came back empty, and the gate went green.
          #
          # On pull requests an empty or zero count is legitimate — `--in-diff`
          # scopes each shard to the lines the PR touched, so a shard whose file
          # the PR never touched correctly has nothing to do. Everywhere else
          # (push, weekly cron, manual dispatch) the full mutant set runs, so
          # zero means the matrix row tested nothing.
          #
          # "Tested nothing" is not the same as "points at nothing", and the
          # difference only shows up on sharded rows. cargo-mutants splits a
          # shard set into contiguous `ceil(total / n)` blocks, so a tail shard
          # of a real, well-matched file is legitimately empty whenever
          # `(n - 1) * ceil(total / n) >= total` — which is what took `main`
          # red from the v0.14.0 merge on (schedule.rs: 41 mutants, 8 shards,
          # shard 7/8 empty every run). So ask the question the gate actually
          # cares about: does the FILE still generate mutants? `--list` answers
          # in ~0.2 s and builds nothing. An unmatched path still fails, which
          # is the property this gate exists to hold — it is how the
          # `detections.rs` row was caught after two months of pointing at a
          # path that had been split into a directory.
          #
          # `matrix.package` is optional and defaults to birdnet-core (see the
          # run step above). Passing it through bare would send `--package ""`
          # for every row that omits it, which enumerates 0 mutants no matter
          # what the file holds — the check would then always claim the path
          # matched no source, and could never recognise a legitimately empty
          # shard. Same default, same expression, in both places.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if [ -z "$missed" ] || [ -z "$total" ] || [ "$total" -eq 0 ]; then
              file_mutants=$(cargo mutants --list \
                --package "${{ matrix.package || 'birdnet-core' }}" \
                --file "${{ matrix.file }}" \
                --no-shuffle 2>/dev/null | wc -l)
              if [ "$file_mutants" -eq 0 ]; then
                echo "::error::no mutants were generated for ${{ matrix.file }} — this gate tested nothing. The path almost certainly no longer matches any source (a file renamed or split into a directory). Fix the matrix row rather than ignoring this."
                exit 1
              fi
              if [ -z "${{ matrix.shard }}" ]; then
                echo "::error::${{ matrix.file }} generates $file_mutants mutants but this unsharded row tested none of them — the run did not do what it claims. Investigate before ignoring this."
                exit 1
              fi
              echo "::notice::shard ${{ matrix.shard }} of ${{ matrix.file }} is empty: the file generates $file_mutants mutants and cargo-mutants' contiguous split left this tail shard with none. Nothing to check here; resize the shard count for this row if it stays empty."
              exit 0
            fi
          elif [ -z "$missed" ]; then
            echo "::notice::no mutants on the changed lines for ${{ matrix.file }}; nothing to check on this PR"
            exit 0
          fi

          if [ "$missed" -gt "$limit" ]; then
            echo "::error::$missed mutants survived in ${{ matrix.file }} (limit $limit); tighten the assertions"
            exit 1
          fi
