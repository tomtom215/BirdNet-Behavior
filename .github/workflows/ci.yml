name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    # `claude/**` also gates the AI-assisted working/integration branches, so a
    # slice runs the full gate (fmt, clippy, tests, MSRV, aarch64 cross-check)
    # at PR time before it is squash-merged toward `main` — previously only PRs
    # whose base was `main`/`master` ran CI, leaving the integration branch
    # un-gated. Costs nothing for ordinary contributors (no such branches);
    # `concurrency.cancel-in-progress` keeps superseded runs from piling up.
    branches: ["master", "main", "claude/**"]

# Least-privilege token: every job in this workflow only reads the checkout.
# Matches the explicit permissions blocks in the other workflows.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a fast follow-up push does not
# wait behind (or race) the previous one. Matches coverage.yml / supply-chain.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # ── fmt ────────────────────────────────────────────────────────────────────
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check --all

  # ── clippy ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy (pedantic + nursery)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install native build dependencies
        # cmake + a host C++ compiler build the bundled libduckdb that the
        # `analytics` feature statically links. ubuntu-24.04 ships them, but
        # install explicitly so the all-features lint can't silently depend on
        # the runner image's default package set.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-clippy
      - name: Clippy — default features (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy — all features incl. analytics (deny warnings)
        # The `analytics` feature gates the entire DuckDB query-builder surface
        # (birdnet-behavioral / birdnet-timeseries). Without --all-features that
        # code is never linted; lint both cfg branches so an analytics-only
        # type/signature error can't slip through (as it did before v0.5.0).
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── test ───────────────────────────────────────────────────────────────────
  test:
    name: Tests (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Free up runner disk space
        # The all-features step compiles the workspace a 4th time (bundled
        # DuckDB + analytics) atop the earlier lib/bins, integration-test, and
        # doctest target/ artifacts, overrunning the stock runner's ~14 GB
        # ("No space left on device"). Reclaim ~25-30 GB of unused SDKs.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-test
      - name: Run unit tests (lib + bins)
        run: cargo test --workspace --lib --bins
      - name: Run integration tests (incl. real-binary boot smoke test)
        # The tests/ suite links libonnxruntime and, via boot_smoke.rs, spawns
        # the compiled binary in --web-only mode and curls GET / — exercising
        # the real startup path (clap, config load, migrations, axum::serve)
        # that the in-process router tests never touch.
        run: cargo test --workspace --tests
      - name: Run doc tests
        run: cargo test --workspace --doc
      - name: Embed the behavioral extension (offline-load coverage)
        # Fetch the community-built `behavioral` extension and point build.rs at
        # it (the same mechanism release.yml uses to embed it in the shipped
        # binary). With it embedded, the `--all-features` build below carries the
        # extension bytes, so `embedded_extension_loads_when_bundled` runs its
        # real assertion — proving `LOAD behavioral` works with NO network —
        # instead of skipping. Best-effort: if the CDN is unreachable the test
        # skips exactly as before, so this never adds flakiness.
        shell: bash
        run: |
          set -eu
          url="http://community-extensions.duckdb.org/v1.5.5/linux_amd64/behavioral.duckdb_extension.gz"
          tmp="$RUNNER_TEMP/behavioral.duckdb_extension"
          if curl -fsSL --retry 3 --retry-delay 2 --max-time 120 -o "${tmp}.gz" "$url"; then
            gunzip -f "${tmp}.gz"
            echo "BIRDNET_BUNDLED_EXTENSION_FILE=$tmp" >> "$GITHUB_ENV"
            echo "embedded behavioral extension — offline-load test will assert"
          else
            echo "::warning::could not fetch the behavioral extension; offline-load test will skip"
          fi
      - name: Run full suite with analytics (DuckDB behavioral extension)
        # Compiles AND runs the analytics code + tests that the default feature
        # set never builds. This is the gate that would have caught the v0.5.0
        # bugs (a FunnelParams field that didn't exist, query builders written
        # against wrong DuckDB signatures). The network-gated live tests skip
        # gracefully when the community extension is unavailable; with the
        # extension embedded above, the offline-load test asserts instead.
        run: cargo test --workspace --all-features
      - name: Prove the behavioral extension loads offline (embedded)
        # Surface the offline-load result explicitly in the log. When the embed
        # step above succeeded this asserts the extension loads from the embedded
        # bytes with no network (the air-gapped guarantee); otherwise it prints a
        # skip line. Already built by the step above, so this is near-instant.
        run: cargo test -p birdnet-behavioral --features analytics embedded_extension_loads_when_bundled -- --nocapture

  # ── doc ────────────────────────────────────────────────────────────────────
  # ── inference ──────────────────────────────────────────────────────────────
  inference:
    name: Inference against the real model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-inference
      # The model is ~541 MB and immutable for a given release tag, so key the
      # cache on its checksum: it is fetched once and reused by every later run.
      - name: Cache the BirdNET model
        id: model-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/birdnet-model
          key: birdnet-model-2a0f9efba1a98e3193ad3dfcb8323116a7de88e39545f3619a7ea46e3bb7d743
      - name: Fetch the BirdNET model and labels
        # Best-effort, matching the behavioural-extension step in the test job:
        # a CDN outage warns instead of failing the build. When the fetch *does*
        # succeed the tests below assert for real — which is the whole point.
        shell: bash
        run: |
          set -eu
          dir="$RUNNER_TEMP/birdnet-model"
          model="$dir/model.onnx"
          labels="$dir/labels.csv"
          sha="2a0f9efba1a98e3193ad3dfcb8323116a7de88e39545f3619a7ea46e3bb7d743"
          mkdir -p "$dir"
          tag="models-v3.0-preview3"
          gh="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          zen="https://zenodo.org/api/records/18247420/files"
          mfile="BirdNET%2B_V3.0-preview3_Global_11K_FP32.onnx"
          lfile="BirdNET%2B_V3.0-preview3_Global_11K_Labels.csv"

          if [ ! -f "$model" ]; then
            curl -fsSL --retry 3 --retry-delay 5 --max-time 900 -o "$model" "$gh/$mfile" \
              || curl -fsSL --retry 3 --retry-delay 5 --max-time 900 -o "$model" "$zen/$mfile/content" \
              || { echo "::warning::could not fetch the model; inference tests will skip"; exit 0; }
          fi
          if [ ! -f "$labels" ]; then
            curl -fsSL --retry 3 --retry-delay 5 --max-time 300 -o "$labels" "$gh/$lfile" \
              || curl -fsSL --retry 3 --retry-delay 5 --max-time 300 -o "$labels" "$zen/$lfile/content" \
              || { echo "::warning::could not fetch the labels; inference tests will skip"; exit 0; }
          fi

          # A truncated or substituted model must never be allowed to "pass" by
          # silently skipping — a wrong checksum is a hard failure.
          echo "$sha  $model" | sha256sum -c -
          echo "BIRDNET_TEST_MODEL=$model"  >> "$GITHUB_ENV"
          echo "BIRDNET_TEST_LABELS=$labels" >> "$GITHUB_ENV"
      - name: Run the end-to-end inference tests
        # These are the only tests that exercise the scientific core —
        # decode → resample → chunk → ONNX inference → confidence mapping —
        # against the real 11 K-species model. Without them the suite can be
        # entirely green while the pipeline returns the wrong species or a
        # silently squashed confidence, which is exactly how the
        # sigmoid-on-probabilities bug (0.92 reported as 0.72) reached a
        # release. They pin a confidence floor on a known Eurasian Magpie
        # recording, so a regression in any stage fails the build.
        run: cargo test --test inference_e2e --test pipeline_e2e -- --nocapture

  doc:
    name: Rustdoc (no broken links)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-doc
      - name: Build docs (deny broken intra-doc links, all features)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items --all-features

  # ── build-check ────────────────────────────────────────────────────────────
  build:
    name: Build (debug, all features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-build
      - name: Build workspace (debug)
        run: cargo build --workspace
      - name: Check generated CLI help is current
        # Regenerates docs/book/_generated/cli-help.txt from the binary's
        # --help and fails if it differs from what's committed, so the docs
        # can't drift from the actual flags/env vars/defaults.
        run: |
          ./scripts/gen-cli-help.sh
          if ! git diff --exit-code docs/book/_generated/cli-help.txt; then
            echo "::error file=docs/book/_generated/cli-help.txt::Stale CLI help — run scripts/gen-cli-help.sh and commit."
            exit 1
          fi
      - name: Build with analytics feature
        run: cargo build --workspace --all-features

  # ── msrv ───────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.95
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++
      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-msrv
      - name: Check MSRV build (all features incl. bundled DuckDB)
        # --all-features proves the DuckDB / duckdb-rs tree also builds on the
        # declared MSRV, not just the default feature set.
        run: cargo check --workspace --all-features

  # ── aarch64 cross-check (Raspberry Pi) ───────────────────────────────────────
  cross-aarch64:
    name: Cross-check (aarch64 / Raspberry Pi)
    runs-on: ubuntu-24.04
    # Catch Pi-breaking changes (target-specific cfg, libduckdb cross-compile,
    # pointer-width assumptions) at PR time instead of only at release tagging,
    # which is the sole place aarch64 was built before. `check` keeps it cheap
    # while still compiling the bundled C/C++ (libduckdb) for the target.
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust toolchain (stable + aarch64 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install native + aarch64 cross build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: ci-cross-aarch64
      - name: Check aarch64 build (all features)
        run: cargo check --workspace --all-features --target aarch64-unknown-linux-gnu
