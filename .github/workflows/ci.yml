name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # ── fmt ────────────────────────────────────────────────────────────────────
  fmt:
    name: Format (rustfmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check --all

  # ── clippy ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy (pedantic + nursery)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - name: Run Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── test ───────────────────────────────────────────────────────────────────
  test:
    name: Tests (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - name: Run unit tests (lib + bins)
        run: cargo test --workspace --lib --bins
      - name: Run integration tests (incl. real-binary boot smoke test)
        # The tests/ suite links libonnxruntime and, via boot_smoke.rs, spawns
        # the compiled binary in --web-only mode and curls GET / — exercising
        # the real startup path (clap, config load, migrations, axum::serve)
        # that the in-process router tests never touch.
        run: cargo test --workspace --tests
      - name: Run doc tests
        run: cargo test --workspace --doc

  # ── doc ────────────────────────────────────────────────────────────────────
  doc:
    name: Rustdoc (no broken links)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-doc-
      - name: Build docs (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items

  # ── build-check ────────────────────────────────────────────────────────────
  build:
    name: Build (debug, all features)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-build-
      - name: Build workspace (debug)
        run: cargo build --workspace
      - name: Check generated CLI help is current
        # Regenerates docs/book/_generated/cli-help.txt from the binary's
        # --help and fails if it differs from what's committed, so the docs
        # can't drift from the actual flags/env vars/defaults.
        run: |
          ./scripts/gen-cli-help.sh
          if ! git diff --exit-code docs/book/_generated/cli-help.txt; then
            echo "::error file=docs/book/_generated/cli-help.txt::Stale CLI help — run scripts/gen-cli-help.sh and commit."
            exit 1
          fi
      - name: Build with analytics feature
        run: cargo build --workspace --features birdnet-web/analytics

  # ── msrv ───────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.95
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-
      - name: Check MSRV build
        run: cargo check --workspace
