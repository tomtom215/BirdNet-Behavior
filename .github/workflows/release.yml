# Release pipeline for BirdNet-Behavior.
#
# Triggered by pushing a semver tag, e.g.:
#   git tag -a v0.2.0 -m "Release v0.2.0"
#   git push origin v0.2.0
#
# Or rehearsed without a tag via the "Run workflow" button (workflow_dispatch):
# every job up to and including `package` runs exactly as on a real release
# (build, SBOM, SLSA attestation), but `github-release` is skipped so nothing
# is published. See RELEASING.md → "Rehearsing a release (dry run)".
#
# The release binaries are built with `--features analytics`, so a single
# binary per target ships the DuckDB behavioral-analytics code statically
# linked in; install.sh enables it by default via `--analytics-db`.
#
# See RELEASING.md for the full release runbook.
#
# Job dependency graph:
#
#   validate ──► ci ──► build (matrix) ──► package ──► github-release
#                                                       (tag push only)
#
# Companion workflow: .github/workflows/docker.yml publishes multi-arch
# container images to GHCR in parallel on the same tag push.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"         # stable      (v1.2.3)
      - "v[0-9]+.[0-9]+.[0-9]+-*"       # pre-release (v1.2.3-rc.1)
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, e.g. 0.2.0 (defaults to Cargo.toml). Dry run only — never publishes a Release."
        required: false
        type: string

# Prevent concurrent releases for the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimal default — individual jobs escalate only what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# ── Job 1: Validate tag, workspace version, and changelog ────────────────────
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Extract version metadata
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            # Dry run: take the version from the input, or fall back to the
            # workspace version so the rehearsal exercises the real number.
            VERSION="${INPUT_VERSION#v}"
            if [[ -z "$VERSION" ]]; then
              VERSION=$(
                awk '/^\[workspace\.package\]/{flag=1; next}
                     /^\[/{flag=0}
                     flag && /^version = /{gsub(/[" ]/, "", $3); print $3; exit}' \
                  Cargo.toml
              )
            fi
            TAG="v${VERSION}"
            MODE="dry-run (workflow_dispatch — github-release is skipped)"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            MODE="release (tag push)"
          fi

          echo "::group::Release metadata"
          printf 'Mode:        %s\n' "$MODE"
          printf 'Tag:         %s\n' "$TAG"
          printf 'Version:     %s\n' "$VERSION"

          # Validate semver (X.Y.Z with optional pre-release and build metadata).
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?(\+[A-Za-z0-9.]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            echo "::error::Version '$VERSION' (tag '$TAG') is not a valid semantic version."
            echo "Expected: vX.Y.Z  or  vX.Y.Z-pre.1"
            exit 1
          fi

          if [[ "$VERSION" =~ - ]]; then
            IS_PRE=true
          else
            IS_PRE=false
          fi

          printf 'Pre-release: %s\n' "$IS_PRE"
          echo "::endgroup::"

          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Verify workspace version matches tag
        shell: bash
        run: |
          TAG_VER="${{ steps.meta.outputs.version }}"
          CARGO_VER=$(
            awk '/^\[workspace\.package\]/{flag=1; next}
                 /^\[/{flag=0}
                 flag && /^version = /{gsub(/[" ]/, "", $3); print $3; exit}' \
              Cargo.toml
          )

          echo "::group::Version consistency"
          printf 'Cargo.toml workspace.package.version: %s\n' "$CARGO_VER"
          printf 'Tag version:                           %s\n' "$TAG_VER"
          echo "::endgroup::"

          if [[ "$CARGO_VER" != "$TAG_VER" ]]; then
            echo "::error file=Cargo.toml::workspace.package.version ($CARGO_VER) does not match tag ($TAG_VER)"
            echo "Bump workspace.package.version in Cargo.toml before tagging."
            exit 1
          fi
          echo "::notice::Workspace version matches tag: $TAG_VER"

      - name: Verify CITATION.cff matches tag
        # CITATION.cff is what GitHub's "Cite this repository" widget and Zenodo
        # hand to anyone citing this software, so a stale version misattributes
        # published work. It has its own comment telling maintainers to bump it
        # in lock-step — and it was missed at BOTH 0.9.0 and 0.10.0, sitting at
        # 0.8.0, because `validate` checked only Cargo.toml and CHANGELOG.md.
        # An instruction in a comment is not a gate; this is.
        shell: bash
        run: |
          set -euo pipefail
          TAG_VER="${{ steps.meta.outputs.version }}"
          CFF_VER=$(awk '/^version:[[:space:]]/{gsub(/^version:[[:space:]]*|["\r]/, ""); print; exit}' CITATION.cff)

          echo "::group::Citation metadata"
          printf 'CITATION.cff version: %s\n' "$CFF_VER"
          printf 'Tag version:          %s\n' "$TAG_VER"
          echo "::endgroup::"

          if [[ "$CFF_VER" != "$TAG_VER" ]]; then
            echo "::error file=CITATION.cff::CITATION.cff version ($CFF_VER) does not match tag ($TAG_VER). Bump 'version' and 'date-released' before tagging."
            exit 1
          fi
          echo "::notice::CITATION.cff matches tag: $TAG_VER"

      - name: Verify openapi.json matches tag
        # The embedded OpenAPI spec is served at /api/v2/openapi.json and is
        # what any client generator, `redocly` build and the published API
        # reference read. RELEASING.md has told maintainers to bump it since
        # `ba84180`, and the 0.11.0 notes list it alongside Cargo.toml,
        # CHANGELOG and CITATION.cff as the four that must agree — but only
        # three were ever enforced, leaving this one carried by an instruction
        # in a runbook. That is precisely how CITATION.cff went stale through
        # two releases before it was gated. Same lesson, same fix.
        shell: bash
        run: |
          set -euo pipefail
          TAG_VER="${{ steps.meta.outputs.version }}"
          SPEC=crates/birdnet-web/openapi.json
          API_VER=$(jq -r '.info.version' "$SPEC")

          echo "::group::OpenAPI spec version"
          printf 'openapi.json info.version: %s\n' "$API_VER"
          printf 'Tag version:               %s\n' "$TAG_VER"
          echo "::endgroup::"

          if [[ "$API_VER" != "$TAG_VER" ]]; then
            echo "::error file=${SPEC}::openapi.json info.version ($API_VER) does not match tag ($TAG_VER). Bump it before tagging."
            exit 1
          fi
          echo "::notice::openapi.json matches tag: $TAG_VER"

      - name: Verify CHANGELOG.md entry exists
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi

          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$VERSION]' entry in CHANGELOG.md"
            echo "Add release notes under a '## [$VERSION]' heading before tagging."
            exit 1
          fi
          echo "::notice::CHANGELOG.md entry found for v$VERSION"

# ── Job 2: Full quality gate before building release artifacts ───────────────
  ci:
    name: CI gate — ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: fmt
            toolchain: stable
            components: rustfmt
            command: cargo fmt --check --all
          - name: clippy
            toolchain: stable
            components: clippy
            command: cargo clippy --workspace --all-targets --all-features -- -D warnings
          - name: test
            toolchain: stable
            # Run the full test suite (including integration tests under
            # tests/*.rs) with the analytics feature so a regression in the
            # DuckDB behavioral path — which release binaries ship — blocks
            # the release. (Release binaries are built --features analytics.)
            command: cargo test --workspace --all-features
          - name: doc
            toolchain: stable
            command: cargo doc --workspace --no-deps --document-private-items --all-features
          - name: msrv
            toolchain: "1.95"
            command: cargo check --workspace --all-features
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Free up runner disk space
        # The `test` entry runs `cargo test --workspace --all-features`, whose
        # debug link of the bundled DuckDB + Arrow + ONNX Runtime closure (with
        # full debuginfo, across every bin/test/example target) overruns the
        # stock runner's ~14 GB root volume. rust-lld then dies with SIGBUS
        # ("ld terminated with signal 7") writing its mmap'd output. ci.yml's
        # test job already reclaims this space; the release gate must match it
        # or green CI still ships a release that fails to link. Reclaim ~25-30
        # GB of unused SDKs. Harmless no-op for the fmt/doc/msrv entries.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-08
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.components || '' }}

      - name: Install native build dependencies
        # cmake + a host C++ compiler build the bundled libduckdb that the
        # --all-features gate now compiles (analytics). Harmless for the
        # fmt/doc matrix entries.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-ci-${{ matrix.name }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

# ── Job 3: Cross-compile release binaries for every supported target ─────────
  #
  # Toolchain note: we build with Ubuntu 24.04's native GCC 13 cross toolchain
  # (aarch64) / native compiler (x86_64) rather than cargo-zigbuild.  Zig's
  # `-lstdc++` does not provide the full GNU libstdc++ cxx11-ABI symbol set
  # that the pyke.io prebuilt ONNX Runtime archives reference (std::__cxx11::
  # basic_istringstream, std::__cxx11::basic_ofstream, std::codecvt_utf8, etc.),
  # and the pyke binaries also require glibc >= 2.38 for `__isoc23_strtol`.
  # Ubuntu 24.04 ships glibc 2.39 + GCC 13, which is exactly what pyke builds
  # against, so the symbols resolve cleanly.  See commit 1b80c41 for the same
  # diagnosis in the Docker pipeline.
  #
  # Consequence: release binaries require glibc >= 2.39 at runtime.  Raspberry
  # Pi OS Bookworm (glibc 2.36) is not supported; users must run Pi OS Trixie.
  build:
    name: Build ${{ matrix.target }}
    needs: [validate, ci]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi 4 / 5 (64-bit Raspberry Pi OS Trixie)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            cross: true
          # Standard 64-bit Linux (x86_64)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            cross: false
          # macOS on Apple Silicon (M-series). The macos-14 runner is arm64, so
          # ort-sys downloads the aarch64-apple-darwin ONNX Runtime prebuilt and
          # audio capture works through ffmpeg's avfoundation input. This target
          # must be verified on a real macos-14 run before it is relied upon.
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
          # Note: armv7-unknown-linux-gnueabihf is intentionally omitted.
          # `ort-sys` does not ship prebuilt ONNX Runtime binaries for armv7
          # (see `docker.yml` header comment), and building ORT from source
          # would add ~30 min of CI time per release.  Pi 3 / Pi Zero 2W
          # users should build from source or run the 64-bit Pi OS.
    env:
      # Use the GNU cross toolchain from apt for aarch64 rather than Rust's
      # default `cc` fallback.  These env vars are only consumed by the
      # aarch64 build; on the x86_64 job they are harmless no-ops.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-08
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        # cmake + a host C++ compiler are required to compile the bundled
        # libduckdb (the `analytics` feature) from source. GitHub's ubuntu-24.04
        # image ships build-essential, but install cmake explicitly so the build
        # doesn't silently depend on the runner image's default package set.
        # imagemagick + pngquant downscale the operator-manual screenshots staged
        # into the tarball (best-effort; the source/Pages copy stays full-res).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ imagemagick pngquant

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        # macos-14 ships clang (via Xcode) and usually cmake, but install cmake
        # explicitly so the bundled libduckdb build doesn't depend on the runner
        # image's default package set.
        run: brew install cmake || brew upgrade cmake || true

      - name: Install aarch64 cross toolchain
        if: matrix.cross
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-build-${{ matrix.target }}

      - name: Fetch behavioral DuckDB extension (matching bundled DuckDB version)
        # Embeds the community-built `behavioral` extension into the release
        # binary via build.rs, so installs work fully offline at first run.
        # If the download fails — restricted runner or registry hiccup — we
        # fall through silently: the runtime loader still tries the cache and
        # the community registry before giving up. The bundled DuckDB version
        # here must match the duckdb-rs pin in Cargo.toml.
        id: bundled_ext
        shell: bash
        run: |
          set -eu
          ddb_ver="v1.5.5"
          case "${{ matrix.target }}" in
            x86_64-*linux*)  plat="linux_amd64" ;;
            aarch64-*linux*) plat="linux_arm64" ;;
            *) plat="" ;;
          esac
          if [ -n "$plat" ]; then
            url="https://community-extensions.duckdb.org/${ddb_ver}/${plat}/behavioral.duckdb_extension.gz"
            tmp="$RUNNER_TEMP/behavioral.duckdb_extension"
            if curl -fsSL --max-time 60 -o "${tmp}.gz" "$url"; then
              gunzip -f "${tmp}.gz"
              echo "BIRDNET_BUNDLED_EXTENSION_FILE=$tmp" >> "$GITHUB_ENV"
              echo "embedded behavioral extension from $url"
            else
              echo "could not fetch $url — release falls back to runtime INSTALL FROM community"
            fi
          else
            echo "no community extension for target ${{ matrix.target }} — runtime INSTALL fallback"
          fi

      - name: Fetch the ICU DuckDB extension (matching bundled DuckDB version)
        # ICU is NOT statically linked into the libduckdb duckdb-rs bundles —
        # measured with autoload/autoinstall off and no cache, where
        # `duckdb_extensions()` reports it NOT_INSTALLED (`core_functions`, by
        # contrast, reports STATICALLY_LINKED). Everything that names the
        # current *local* date lives in it: CURRENT_DATE, today(), the TimeZone
        # setting, even CAST(now() AS DATE). There is no ICU-free spelling.
        #
        # Left to itself DuckDB autoinstalls it into $HOME/.duckdb on first use.
        # The shipped unit sets ProtectHome=read-only, so on v0.13.1 that failed
        # with `Failed to create directory "/home/pi/.duckdb": Read-only file
        # system` and every dashboard stayed empty for days with a green health
        # endpoint. Embedding it removes the network and the writable $HOME from
        # the path. This is a hard requirement for a working release, not a
        # nice-to-have — but the download stays best-effort so a registry
        # hiccup degrades to the old behaviour instead of failing the release.
        id: bundled_icu
        shell: bash
        run: |
          set -eu
          ddb_ver="v1.5.5"
          case "${{ matrix.target }}" in
            x86_64-*linux*)   plat="linux_amd64" ;;
            aarch64-*linux*)  plat="linux_arm64" ;;
            aarch64-apple-*)  plat="osx_arm64" ;;
            x86_64-apple-*)   plat="osx_amd64" ;;
            *) plat="" ;;
          esac
          if [ -n "$plat" ]; then
            url="https://extensions.duckdb.org/${ddb_ver}/${plat}/icu.duckdb_extension.gz"
            tmp="$RUNNER_TEMP/icu.duckdb_extension"
            if curl -fsSL --retry 3 --retry-delay 2 --max-time 180 -o "${tmp}.gz" "$url"; then
              gunzip -f "${tmp}.gz"
              echo "BIRDNET_BUNDLED_ICU_FILE=$tmp" >> "$GITHUB_ENV"
              echo "embedded ICU from $url"
            else
              echo "::warning::could not fetch $url — this build has no embedded ICU; \
          stations without a writable \$HOME will have no date-ranged analytics"
            fi
          else
            echo "::warning::no ICU build for target ${{ matrix.target }}"
          fi

      - name: Build release binary
        # `--features analytics` statically links the bundled DuckDB analytics
        # engine into the binary, so one binary per target ships everything;
        # analytics stays dormant until `--analytics-db` is passed at runtime.
        # The aarch64 cross build runs on the 16 GB x86_64 runner, which has
        # more linker headroom than the 8 GB arm runner the Docker pipeline
        # builds natively on for the same DuckDB-link reason.
        # When the previous step set BIRDNET_BUNDLED_EXTENSION_FILE, build.rs
        # embeds the behavioral extension into the binary too.
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }} \
            --features analytics \
            --bin birdnet-behavior

      - name: Strip debug symbols
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/birdnet-behavior"
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            aarch64-linux-gnu-strip "$BIN"
          else
            strip "$BIN"
          fi

      - name: Stage archive contents
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          NAME="birdnet-behavior-${VERSION}-${{ matrix.target }}"
          STAGE="staging/${NAME}"

          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/birdnet-behavior" "$STAGE/"
          cp README.md LICENSE LICENSE-UPSTREAM CHANGELOG.md install.sh uninstall.sh "$STAGE/"

          # Bundle the rendered operator manual so install.sh can serve it at
          # /help/* fully offline (build.rs rendered it into
          # docs/book/_generated/html during the cargo build above). Downscale
          # the screenshots best-effort to keep the tarball lean — the committed
          # source, and therefore the GitHub Pages site, stays full-res.
          if [ -d docs/book/_generated/html ]; then
            cp -a docs/book/_generated/html "$STAGE/help"
            if command -v mogrify >/dev/null 2>&1 && command -v pngquant >/dev/null 2>&1; then
              find "$STAGE/help/images" -type f -name '*.png' -print0 \
                | xargs -0 -r mogrify -resize '1000x>' -strip || true
              find "$STAGE/help/images" -type f -name '*.png' -print0 \
                | xargs -0 -r pngquant --force --skip-if-larger --quality=65-90 --ext .png || true
            fi
            echo "::group::Staged operator manual"
            du -sh "$STAGE/help" || true
            echo "::endgroup::"
          else
            echo "::warning::docs/book/_generated/html not found — tarball ships without /help docs"
          fi

          echo "NAME=${NAME}" >> "$GITHUB_ENV"
          echo "STAGE=${STAGE}" >> "$GITHUB_ENV"

      - name: Create tar.gz archive
        shell: bash
        run: |
          mkdir -p dist
          tar -C staging -czf "dist/${NAME}.tar.gz" "${NAME}"

          echo "::group::Archive contents"
          tar -tzf "dist/${NAME}.tar.gz"
          echo "::endgroup::"

          echo "::group::Archive size"
          ls -lh "dist/${NAME}.tar.gz"
          echo "::endgroup::"

      - name: Generate SHA-256 checksum
        shell: bash
        working-directory: dist
        run: |
          # macOS runners ship `shasum`, not GNU coreutils' `sha256sum`. Both
          # emit the same "<hash>  <file>" format, so the sidecar is identical
          # regardless of which produced it and `sha256sum -c` verifies either.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${NAME}.tar.gz" | tee "${NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${NAME}.tar.gz" | tee "${NAME}.tar.gz.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

# ── Job 4: Aggregate artifacts, checksum, SBOM, and SLSA attestation ─────────
  package:
    name: Package and attest
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write      # OIDC token for SLSA attestation
      attestations: write  # attach attestation to the repository
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-08
        with:
          toolchain: stable

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: raw/
          merge-multiple: false

      - name: Flatten artifacts into a single directory
        shell: bash
        run: |
          mkdir -p release
          find raw -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) \
            -exec cp -v {} release/ \;
          cp install.sh uninstall.sh release/

          echo "::group::Release artifacts"
          ls -lh release/
          echo "::endgroup::"

      # CycloneDX SBOM — one machine-readable bill of materials for the
      # full workspace, attached to the GitHub release. Consumers can
      # use this to audit transitive dependencies, surface CVEs against
      # specific package versions, or feed it into Dependency-Track /
      # GitHub Dependency Graph. We pin cargo-cyclonedx to a known-good
      # version so a transitive bug in the generator can't silently
      # poison the release artifact set.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-cyclonedx@0.5.7

      - name: Generate SBOM (CycloneDX 1.5 JSON)
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # cargo-cyclonedx 0.5.7 writes one SBOM per workspace package
          # next to its Cargo.toml, named `<package>.cdx.{json,xml}` by
          # default — the `.cdx` infix is the default naming, there is no
          # `--output-cdx` flag. spec-version defaults to 1.3, so request
          # 1.5 explicitly to match the asset name. Note 0.5.7 still emits
          # the legacy `metadata.tools` array even at 1.5, so the summary
          # jq below tolerates both that and the 1.5 object shape.
          # --all-features mirrors the release binaries (built with
          # `--features analytics`) so the statically-linked DuckDB tree
          # lands in the BOM; it's the safe workspace-wide form since only
          # some member crates define the `analytics` feature.
          cargo cyclonedx --all-features --format json --spec-version 1.5
          cargo cyclonedx --all-features --format xml  --spec-version 1.5

          # The root `birdnet-behavior` package's SBOM is the canonical
          # one for release consumers — it captures the binary's full
          # transitive dependency tree. Per-crate SBOMs live alongside
          # their respective Cargo.toml and help anyone vendoring a
          # single crate.
          NAME="birdnet-behavior-${VERSION}-sbom"
          cp birdnet-behavior.cdx.json "release/${NAME}.cdx.json"
          cp birdnet-behavior.cdx.xml  "release/${NAME}.cdx.xml"

          echo "::group::SBOM summary"
          # `metadata.tools` has two shapes across CycloneDX versions: the
          # legacy array (`[{name,version}]`, still emitted by
          # cargo-cyclonedx 0.5.7 even at spec-version 1.5) and the newer
          # 1.5 object (`{components:[{name,version}]}`). Try the object
          # path first, fall back to the array path; the trailing `?` on
          # each suppresses the "cannot index array with string" error so
          # `//` can fall through instead of aborting the run.
          jq '{
            spec: .specVersion,
            components: (.components | length),
            tool: ((.metadata.tools.components[0].name)? // (.metadata.tools[0].name)? // "unknown")
          }' "release/${NAME}.cdx.json"
          echo "::endgroup::"

      - name: Generate combined SHA256SUMS
        shell: bash
        working-directory: release
        run: |
          # Combine per-archive checksums into a single SHA256SUMS file in
          # the standard sha256sum -c format. SBOM files are included so
          # downstream consumers can verify the BOM hasn't been tampered
          # with between download and ingestion.
          : > SHA256SUMS
          for f in *.tar.gz; do
            sha256sum "$f" >> SHA256SUMS
          done
          for f in *.cdx.json *.cdx.xml; do
            [[ -e "$f" ]] && sha256sum "$f" >> SHA256SUMS
          done
          sha256sum install.sh >> SHA256SUMS
          sha256sum uninstall.sh >> SHA256SUMS

          echo "::group::SHA256SUMS"
          cat SHA256SUMS
          echo "::endgroup::"

          # Remove the per-archive .sha256 sidecars now that SHA256SUMS is
          # the canonical checksum file.
          rm -f ./*.tar.gz.sha256

      # SLSA Level 2 build provenance — signs every release archive with a
      # workflow-scoped OIDC token. End users verify with:
      #   gh attestation verify --repo tomtom215/BirdNet-Behavior <archive>
      # The SBOM is also attested so consumers know the BOM came from the
      # same workflow run as the binaries.
      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/*.tar.gz
            release/*.cdx.json
            release/*.cdx.xml

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release/
          retention-days: 90
          if-no-files-found: error

# ── Job 5: Create or update the GitHub Release ───────────────────────────────
  github-release:
    name: Publish GitHub Release
    needs: [validate, package]
    # Tag pushes publish; workflow_dispatch runs are dry runs that stop after
    # `package` (build + SBOM + SLSA attestation all still run and are verified).
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write    # create release, upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release/

      - name: Extract CHANGELOG section for this version
        id: notes
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          echo "::group::Extracting release notes for v$VERSION"

          # Pull everything between ## [VERSION] and the next section. Stop at
          # the next "## [" heading OR the trailing link-reference block
          # ("[x]: http…"), so the notes never absorb the comparison links at
          # the foot of the file (which happens for the last section in the
          # file, where there is no following "## [" to stop at).
          awk "
            /^## \[$VERSION\]/      { found=1; next }
            found && /^## \[/       { exit }
            found && /^\[[^]]+\]: / { exit }
            found                   { print }
          " CHANGELOG.md > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "::error::Empty release notes for $VERSION"
            echo "Ensure CHANGELOG.md has a non-empty ## [$VERSION] section."
            exit 1
          fi

          cat release_notes.md
          echo "::endgroup::"

      - name: Assemble final release notes
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          {
            cat release_notes.md
            echo ""
            echo "---"
            echo ""
            echo "## Installation"
            echo ""
            echo '### One-line installer (Raspberry Pi / bare-metal Linux)'
            echo ""
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash -s -- --version ${VERSION}"
            echo '```'
            echo ""
            echo '> Run it as root via the pipe above. Do not use `sudo bash <(curl ...)` — sudo'
            echo '> closes the process-substitution file descriptor, so the script never loads.'
            echo ""
            echo '### Download a binary directly'
            echo ""
            echo '| Target                              | Platform                              |'
            echo '|-------------------------------------|---------------------------------------|'
            echo "| \`aarch64-unknown-linux-gnu\`       | Raspberry Pi 4 / 5, ARM64 Linux       |"
            echo "| \`x86_64-unknown-linux-gnu\`        | Standard 64-bit Linux                 |"
            echo ""
            echo "Archives are gzipped tarballs containing the stripped binary,"
            echo '`README.md`, `CHANGELOG.md`, `LICENSE`, `LICENSE-UPSTREAM`,'
            echo '`install.sh`, and a `help/` directory with the rendered operator'
            echo 'manual (served offline at `/help`). Each binary ships the DuckDB'
            echo 'behavioral-analytics engine built in; `install.sh` enables it by'
            echo 'default (for a manual run, pass `--analytics-db`).'
            echo ""
            echo '> **Runtime requirement: glibc 2.39 or newer** — Raspberry Pi OS'
            echo '> **Trixie**, Debian 13, or Ubuntu 24.04. Pi OS **Bookworm**'
            echo '> (glibc 2.36) is **not** supported by the native binary: run the'
            echo '> Docker image instead (it bundles its own runtime) or upgrade to'
            echo '> Trixie. There is no 32-bit (armv7) binary — use the 64-bit Pi OS.'
            echo ""
            echo "### Model"
            echo ""
            echo 'The BirdNET+ V3.0 model (~541 MB) is not bundled in the archive.'
            echo 'On first run, `install.sh` and the Docker image fetch it'
            echo '(sha256-verified) from the shared, arch-independent model release'
            echo "<https://github.com/${{ github.repository }}/releases/tag/models-v3.0-preview3>"
            echo '— the same GitHub origin as the binary — falling back to Zenodo'
            echo '(the upstream source) if that asset is unavailable. The install is'
            echo 'offline-capable after that one fetch.'
            echo ""
            echo "### Docker"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/birdnet-behavior:${VERSION}"
            echo '```'
            echo ""
            echo "The image includes DuckDB analytics (no separate \`-analytics\` tag)."
            echo "Multi-arch manifests cover \`linux/amd64\` and \`linux/arm64\`."
            echo ""
            echo "## Verification"
            echo ""
            echo '### Checksums'
            echo ""
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo '```'
            echo ""
            echo '### SLSA build provenance'
            echo ""
            echo "Every release archive carries a signed [SLSA build provenance](https://slsa.dev/spec/v1.0/provenance)"
            echo "attestation produced by this workflow run. Verify it with the GitHub CLI:"
            echo ""
            echo '```bash'
            echo "gh attestation verify \\"
            echo "  --repo ${{ github.repository }} \\"
            echo "  birdnet-behavior-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            echo '```'
            echo ""
            echo '### Software Bill of Materials (CycloneDX)'
            echo ""
            echo "A CycloneDX 1.5 SBOM for the full workspace is attached as a"
            echo "release asset in both JSON and XML formats:"
            echo ""
            echo "- \`birdnet-behavior-${VERSION}-sbom.cdx.json\`"
            echo "- \`birdnet-behavior-${VERSION}-sbom.cdx.xml\`"
            echo ""
            echo "Consumers can ingest these into Dependency-Track, GitHub"
            echo "Dependency Graph, or any CycloneDX-aware vulnerability"
            echo "scanner. Both files are signed by the same SLSA build"
            echo "provenance attestation as the binaries."
          } > final_notes.md

          echo "::group::Final release notes"
          cat final_notes.md
          echo "::endgroup::"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IS_PRE="${{ needs.validate.outputs.is_prerelease }}"
          TAG="v${VERSION}"
          TITLE="BirdNet-Behavior ${TAG}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          PRE_FLAG=()
          if [[ "$IS_PRE" == "true" ]]; then
            PRE_FLAG=(--prerelease)
          fi

          # Idempotent: if a release already exists for this tag (created by
          # an earlier workflow run or by a human via the web UI), update it
          # in place rather than failing.
          # Glob SBOM uploads through `compgen` so the workflow keeps
          # working when the SBOM step hasn't produced anything (e.g.
          # during a manual rerun with only the github-release job
          # re-run). The two CycloneDX flavours (JSON + XML) are both
          # uploaded so consumers can pick whichever their tooling
          # natively understands.
          SBOM_ASSETS=()
          for f in release/*.cdx.json release/*.cdx.xml; do
            [[ -e "$f" ]] && SBOM_ASSETS+=("$f")
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release ${TAG} already exists — updating in place."
            gh release edit "$TAG" \
              "${PRE_FLAG[@]}" \
              --title "$TITLE" \
              --notes-file final_notes.md

            gh release upload "$TAG" \
              --clobber \
              release/*.tar.gz \
              release/SHA256SUMS \
              release/install.sh \
              release/uninstall.sh \
              "${SBOM_ASSETS[@]}"
            echo "::notice::Updated $RELEASE_URL"
          else
            gh release create "$TAG" \
              "${PRE_FLAG[@]}" \
              --title "$TITLE" \
              --notes-file final_notes.md \
              release/*.tar.gz \
              release/SHA256SUMS \
              release/install.sh \
              release/uninstall.sh \
              "${SBOM_ASSETS[@]}"
            echo "::notice::Published $RELEASE_URL"
          fi

          {
            echo "## Release v${VERSION}"
            echo ""
            echo "| Field       | Value |"
            echo "|-------------|-------|"
            echo "| Version     | \`${VERSION}\` |"
            echo "| Pre-release | \`${IS_PRE}\` |"
            echo "| Release     | [v${VERSION}](${RELEASE_URL}) |"
            echo ""
            echo "### Artifacts"
            echo ""
            echo '```'
            ls -lh release/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
