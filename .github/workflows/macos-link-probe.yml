name: macOS link probe (throwaway)

# Not for merge. Checks that build.rs's link_clang_runtime() alone (no RUSTFLAGS) lets the
# aarch64-apple-darwin binary link, and that the result starts. Run 40257984945 showed the same
# job without that function failing with "Undefined symbols ... ___isPlatformVersionAtLeast".
# Builds without `--features analytics`: the failing reference is in ort-sys, not in DuckDB.

on:
  push:
    branches: [claude/amazing-babbage-nxiuuc]
    paths: [.github/workflows/macos-link-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    name: build.rs supplies the Clang runtime
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build
        run: |
          rustc --version
          cargo build --release --locked --target aarch64-apple-darwin --bin birdnet-behavior 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: What build.rs chose
        if: always()
        run: |
          grep -h -E 'libclang_rt|found no Clang runtime' build.log || echo "no build.rs message in the log (quiet on success is normal)"
          echo "undefined-symbol lines: $(grep -c 'Undefined symbols' build.log || true)"
          ls -l target/aarch64-apple-darwin/release/birdnet-behavior

      - name: The binary starts
        run: |
          bin=target/aarch64-apple-darwin/release/birdnet-behavior
          "$bin" --version
          "$bin" --help | head -5
