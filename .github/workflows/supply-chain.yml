# Supply-chain and source hygiene checks.
#
# Runs on every PR and on a weekly cadence so that new advisories against
# pinned dependencies surface quickly even when no code changes are landing.
# Lives in a separate workflow file from CI to keep concerns isolated and to
# let teams toggle the schedule independently of code-quality gates.

name: Supply chain

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Mondays at 08:00 UTC — picks up the prior week of new RustSec advisories.
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same branch so a fast follow-up commit does
# not have to wait behind the previous one.
# A scheduled or manually dispatched run has its own group. The weekly advisory
# scan runs on the default branch's ref, the same group as every push to `main`,
# and `cancel-in-progress` cancelled it whenever anything was merged while it ran.
concurrency:
  group: "${{ github.workflow }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.event_name }}"
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── cargo-deny ───────────────────────────────────────────────────────────
  # Enforces deny.toml: license allow-list, advisory database, banned crates,
  # and source restriction. Fails the build on any violation.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # observed 59s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-04
        with:
          toolchain: stable
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # ── cargo-audit ──────────────────────────────────────────────────────────
  # Independent advisory scan against the RustSec database. Redundant with
  # cargo-deny's `advisories` table on purpose: if cargo-deny is silently
  # misconfigured the audit job is still authoritative.
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # observed 3m05s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-04
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit
      - name: Run cargo-audit
        run: cargo audit --deny warnings

  # ── cargo-machete ────────────────────────────────────────────────────────
  # Finds Cargo.toml entries that are no longer used anywhere in the
  # workspace. Unused dependencies bloat the build, the dependency graph,
  # and the supply-chain surface — they should be removed.
  cargo-machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # observed 15s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-machete
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

  # ── third-party notices ──────────────────────────────────────────────────
  # The binary links several hundred packages, DuckDB and ONNX Runtime and
  # serves fonts and htmx from memory. Their licences require the notice to
  # travel with the binary, and release archives and the image carry
  # THIRD_PARTY_LICENSES.txt for that. This fails when the committed file no
  # longer matches Cargo.lock (a package added, removed, or its licence text
  # changed), when a package's licence text cannot be found, or when a vendored
  # text in third_party/ is for a different ONNX Runtime, DuckDB or htmx than the
  # build links. Fix: python3 scripts/gen-third-party-licenses.py, commit.
  third-party-notices:
    name: third-party licence notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-04
        with:
          toolchain: stable
      - name: Unpack the locked crates
        run: cargo fetch --locked
      - name: THIRD_PARTY_LICENSES.txt is current and covers every package
        run: python3 scripts/gen-third-party-licenses.py --check

  # ── typo scan ────────────────────────────────────────────────────────────
  # Catches misspelled identifiers, log messages, and documentation without
  # blocking on a heavyweight grammar checker. Configured to be conservative
  # (no auto-fix in CI; report only).
  typos:
    name: Spelling (typos)
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # observed 8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run typos
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: ./.typos.toml

  # ── shellcheck ───────────────────────────────────────────────────────────
  # The bootstrap surface is shell — quickstart.sh, install.sh, the docker
  # entrypoint. These run unsupervised on operator machines so they get
  # the strictest static check we have.
  #
  # installer/lib/*.sh are concatenation fragments, not standalone scripts
  # (they share a namespace and have no shebang), so they are linted as the
  # assembled install.sh rather than individually — see the build-sync gate.
  shellcheck:
    name: shellcheck (bootstrap scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # observed 12s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install.sh is generated from installer/lib (no drift)
        run: bash installer/build.sh --check
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: "."
          check_together: "no"
          ignore_paths: installer/lib
        env:
          SHELLCHECK_OPTS: "-x"

  # ── installer unit tests ─────────────────────────────────────────────────
  # installer/test/ held five test scripts and nothing ran any of them — no
  # workflow, no script, no Makefile. Four still passed when run by hand, so
  # nothing had rotted, but a test nobody runs stops being true silently and
  # nothing announces it. This job runs them.
  #
  # run-ci.sh also fails when a file in installer/test/ is neither in its
  # run-list nor in its excluded-list-with-a-reason, so adding a sixth test and
  # forgetting to wire it up is a red build rather than a repeat of the same
  # omission one level up.
  #
  # Hermetic: bash + coreutils, no network, no docker, no root. (The
  # docker-based pkg-manager matrix is excluded by name and by reason — it
  # pulls four distro images from four mirror networks.)
  installer-tests:
    name: installer unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # observed 8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the installer test suite
        run: bash installer/test/run-ci.sh
