# Coverage-guided fuzzing (libFuzzer via cargo-fuzz) of the two parsers that read
# fully untrusted input: the audio decoder that opens every file dropped into the
# watch directory, and the label-file parser. See fuzz/README.md.
#
# Until this workflow existed the two targets had never been run by anything but
# hand, and the first 60-second local run (with cargo-fuzz's defaults) crashed
# `decode_audio` on a crafted WAV: an arithmetic overflow in symphonia-format-riff
# 0.6.1 (`num_channels * (bits_per_sample / 8)` on u16, computed only to log a
# block-align mismatch).
#
# # What it fuzzes, and why `-O`
#
# The shipped binary is a release build with `panic = "abort"` and no overflow
# checks, so what matters is whether an input can abort the daemon *as built*.
# cargo-fuzz defaults to debug assertions, which turn every wrapping overflow
# into a panic and found the symphonia one above, which wraps harmlessly in a
# release build. `-O` fuzzes the arithmetic that ships; anything it finds is a
# real abort, an out-of-bounds access, an out-of-memory or a hang.
#
# The harness crate is not a workspace member and has no committed lockfile.
# Each run copies the root Cargo.lock in and lets cargo prune and extend it, so
# the fuzzed dependencies are exactly the versions the release ships (the only
# additions are the fuzz-only `libfuzzer-sys` and the harness itself).
#
# A weekly run is the soak; a pull request that touches a fuzzed surface runs a
# short pass. Neither is a required check (a path-filtered workflow cannot be).

name: Fuzz

on:
  pull_request:
    branches: ["main", "master"]
    paths:
      - "crates/birdnet-core/src/audio/**"
      - "crates/birdnet-core/src/inference/labels.rs"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Wednesdays, off the hour.
    - cron: "17 3 * * 3"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target (default 600)"
        required: false
        default: "600"
        type: string

# A scheduled or dispatched run has its own group and is not cancelled.
concurrency:
  group: "${{ github.workflow }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.event_name }}"
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A dated nightly: libFuzzer instrumentation needs nightly, and "today's
  # nightly" would make the same commit fuzz differently from one run to the next.
  RUSTUP_TOOLCHAIN: nightly-2026-10-13

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [decode_audio, parse_labels]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-04
        with:
          toolchain: nightly-2026-10-13

      - name: Cache the fuzz build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          shared-key: fuzz

      - name: Install cargo-fuzz
        run: cargo install --locked --version 0.13.2 cargo-fuzz

      - name: Fuzz the dependency versions that ship
        run: |
          cp Cargo.lock fuzz/Cargo.lock
          cargo metadata --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null

      - name: Seed the audio corpus from the committed recording
        if: matrix.target == 'decode_audio'
        # The first byte selects the container parser (0 = wav); see
        # fuzz/fuzz_targets/decode_audio.rs.
        run: |
          mkdir -p fuzz/corpus/decode_audio
          printf '\x00' | cat - tests/testdata/Pica_pica_30s.wav > fuzz/corpus/decode_audio/seed-pica-wav

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          REQUESTED: ${{ inputs.seconds }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule)          seconds=600 ;;
            workflow_dispatch) seconds="${REQUESTED:-600}" ;;
            *)                 seconds=60 ;;
          esac
          if ! [[ "$seconds" =~ ^[0-9]+$ ]] || [ "$seconds" -lt 10 ] || [ "$seconds" -gt 2400 ]; then
            echo "::error::seconds must be a whole number between 10 and 2400, got '${seconds}'"
            exit 1
          fi
          # -timeout turns a hang into a finding (libFuzzer's default is 20
          # minutes per input); -rss_limit_mb does the same for memory, at a
          # fraction of the runner's 16 GB.
          cargo fuzz run -O "$TARGET" -- \
            -max_total_time="$seconds" -timeout=30 -rss_limit_mb=2048

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
