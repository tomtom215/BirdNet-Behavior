# Upgrade test.
#
# Installs each of the most recent published releases with its own install.sh,
# lets it record detections, upgrades it in place with this tree's install.sh
# and binary while the service runs, then runs the rollback the update printed
# — all under real systemd. See installer/test/upgrade-e2e.sh for what each
# step asserts and why.
#
# 0.17.0 shipped two defects only this path shows, both invisible to every
# other gate: the installer enabled the geomodel, whose ONNX session the unit's
# syscall filter kills the service for (SIGSYS, in a restart loop), and the
# rollback it printed left a unit the previous binary cannot pass. The install
# smoke test runs in a container with no systemd, so it reached neither.
#
# release.yml runs the same script against the exact tarball it is about to
# publish, and the release does not publish unless it passes.

name: Upgrade test

on:
  push:
    branches: ["main", "master"]
    paths:
      - "install.sh"
      - "installer/lib/**"
      - "installer/test/upgrade-e2e.sh"
      - "scripts/upgrade-sources.sh"
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/upgrade.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "install.sh"
      - "installer/lib/**"
      - "installer/test/upgrade-e2e.sh"
      - "scripts/upgrade-sources.sh"
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/upgrade.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  candidate:
    name: Build the candidate tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      prev: ${{ steps.sources.outputs.prev }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: upgrade-candidate

      - name: Verify install.sh is in sync with installer/lib
        run: bash installer/build.sh --check

      - name: Fetch the DuckDB extensions the release embeds
        # The same two downloads release.yml makes, so the candidate is built
        # the way the shipped binary is. Best-effort there, best-effort here.
        shell: bash
        run: |
          set -eu
          for ext in "community-extensions.duckdb.org/v1.5.5/linux_amd64/behavioral BIRDNET_BUNDLED_EXTENSION_FILE" \
                     "extensions.duckdb.org/v1.5.5/linux_amd64/icu BIRDNET_BUNDLED_ICU_FILE"; do
            set -- $ext
            tmp="$RUNNER_TEMP/$(basename "$1").duckdb_extension"
            if curl -fsSL --retry 3 --max-time 180 -o "${tmp}.gz" "https://$1.duckdb_extension.gz"; then
              gunzip -f "${tmp}.gz"
              echo "$2=$tmp" >> "$GITHUB_ENV"
            else
              echo "::warning::could not fetch https://$1.duckdb_extension.gz"
            fi
          done

      - name: Build the release binary
        run: cargo build --release --features analytics --bin birdnet-behavior

      - name: Package the tarball
        id: pkg
        shell: bash
        run: |
          set -eu
          VER="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f&&/^version = /{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          NAME="birdnet-behavior-${VER}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${NAME}"
          strip -o "dist/${NAME}/birdnet-behavior" target/release/birdnet-behavior
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Choose the releases to upgrade from
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "prev=$(bash scripts/upgrade-sources.sh "${{ steps.pkg.outputs.version }}" 3)" >> "$GITHUB_OUTPUT"

      - name: Upload the candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-candidate
          path: dist/*.tar.gz
          retention-days: 3
          if-no-files-found: error

  upgrade:
    name: Upgrade from v${{ matrix.prev }}
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        prev: ${{ fromJSON(needs.candidate.outputs.prev) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download the candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upgrade-candidate
          path: dist/

      - name: Cache the models
        # ~560 MB that every install would otherwise download. The script
        # stages them before installing and fills the cache when it is empty.
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/upgrade-models
          key: upgrade-models-v3.0-preview3-geo-3.0.2

      - name: Upgrade v${{ matrix.prev }} → v${{ needs.candidate.outputs.version }} and roll back
        run: |
          sudo env PATH="$PATH" \
            PREV_VERSION="${{ matrix.prev }}" \
            CANDIDATE_TARBALL="$PWD/dist/birdnet-behavior-${{ needs.candidate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz" \
            MODEL_CACHE="$HOME/upgrade-models" \
            bash installer/test/upgrade-e2e.sh
          sudo chmod -R a+rX "$HOME/upgrade-models"
