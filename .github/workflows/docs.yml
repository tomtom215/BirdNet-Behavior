name: Docs

# Build the mdBook documentation and publish it to GitHub Pages.
# Requires Pages to be enabled once in repo Settings → Pages → Source: GitHub Actions.
#
# The build job also runs on pull requests, deliberately: a link break could not
# otherwise be caught until it was already on `main`, and that happened.
# Only `deploy` is restricted to `main` pushes.
#
# ## One renderer, one config
#
# This used to install mdBook 0.4.52 with the `mdbook-linkcheck` backend, while
# `build.rs` rendered the *same Markdown* with `mdbook-driver` 0.5 for the
# in-app `/help/*` tree, from a second `book.toml` with a different theme. Same
# pages, two different-looking sites, and only the published one link-checked.
#
# There is now one `book.toml` (repo root) and one mdBook version, pinned to
# match the `mdbook-driver` in `Cargo.lock`. `mdbook-linkcheck` could not come
# along — it is a 0.4-era plugin, last released in 2022 — so internal links are
# checked by `scripts/check-book-links.py` against the rendered HTML instead,
# which is renderer-agnostic and therefore covers both trees.

on:
  push:
    branches: [main]
    paths:
      - "docs/book/**"
      - "docs/book-theme/**"
      - "book.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - "docs/book-theme/**"
      - "book.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege at the workflow level: only `deploy` needs to write Pages.
permissions:
  contents: read

# Supersede an in-flight run for the same PR; never cancel a Pages deployment
# (the deploy job carries its own `pages` group for that).
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # observed 8s
    env:
      # Pinned to the `mdbook-driver` version in Cargo.lock, so the published site
      # and the in-app `/help/*` tree are byte-for-byte the same render.
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install mdBook
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
      - name: Build the book
        # One backend, so mdBook writes straight into `build-dir`
        # (`docs/.book-build`) rather than a `html/` subdirectory of it.
        run: mdbook build
      - name: Check every internal link resolves
        # Against the rendered HTML, not as an mdBook backend — see the header.
        # This found five broken anchors in shipped documentation the first time
        # it ran, which the 0.4 backend had been passing.
        run: ./scripts/check-book-links.py docs/.book-build
      # Pages packaging is deploy-only: a pull request has no Pages token and
      # nothing to publish, so these steps would fail or waste a run.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/.book-build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # observed 26s
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow one concurrent deployment; don't cancel an in-progress one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
