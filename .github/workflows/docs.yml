name: Docs

# Build the mdBook documentation and publish it to GitHub Pages.
# Requires Pages to be enabled once in repo Settings → Pages → Source: GitHub Actions.
#
# The build job also runs on pull requests, deliberately: a link break could not
# otherwise be caught until it was already on `main`, and that happened.
# Only `deploy` is restricted to `main` pushes.
#
# ## One renderer, one config
#
# This used to install mdBook 0.4.52 with the `mdbook-linkcheck` backend, while
# `build.rs` rendered the *same Markdown* with `mdbook-driver` 0.5 for the
# in-app `/help/*` tree, from a second `book.toml` with a different theme. Same
# pages, two different-looking sites, and only the published one link-checked.
#
# There is now one `book.toml` (repo root) and one mdBook version, pinned to
# match the `mdbook-driver` in `Cargo.lock`. `mdbook-linkcheck` could not come
# along — it is a 0.4-era plugin, last released in 2022 — so internal links are
# checked by `scripts/check-book-links.py` against the rendered HTML instead,
# which is renderer-agnostic and therefore covers both trees.
#
# ## Versioned
#
# `scripts/build-versioned-docs.sh` builds the whole site every time: the
# site root is the latest release's manual (so existing links keep working
# and mean "the release you can install"), every release from v0.17.1 on is
# kept at `/vX.Y.Z/` from its own tag, and `/dev/` is `main`. Pages replaces
# the site wholesale on each deploy, so rebuilding every version from its tag
# is what keeps old versions published — and keeps them reproducible. A
# release tag push triggers a deploy, so the root moves to a release the
# moment it is tagged.
#
# `/dev/` is built from `origin/main`, not from the checkout: on a tag push the
# checkout *is* the tag, and building `/dev/` from it published the release's
# own manual as "dev" until the next push to `main`. A pull request is the one
# run that must build its own tree (it deploys nothing, and exists to grade the
# change), so it sets `DOCS_DEV_REF=HEAD`. `scripts/check-ci-config.py` reads
# that setting; `scripts/test-build-versioned-docs.sh` runs the build script
# against synthetic tags before the real build does.

on:
  push:
    branches: [main]
    # A release tag moves the site root to that release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "docs/book/**"
      - "docs/book-theme/**"
      - "book.toml"
      - "scripts/build-versioned-docs.sh"
      - "scripts/test-build-versioned-docs.sh"
      - "scripts/check-book-links.py"
      - "scripts/check-docs-site.mjs"
      - "scripts/check-release-tag.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/book/**"
      - "docs/book-theme/**"
      - "book.toml"
      - "scripts/build-versioned-docs.sh"
      - "scripts/test-build-versioned-docs.sh"
      - "scripts/check-book-links.py"
      - "scripts/check-docs-site.mjs"
      - "scripts/check-release-tag.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least privilege at the workflow level: only `deploy` needs to write Pages.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # Every non-PR build shares one group, whatever its ref: each builds the
    # *whole* site, so a `main` push that started before a release tag was
    # pushed must not deploy after the tag's run and move the root back to the
    # previous release. A newer build cancels an older one; this is on the job,
    # not the workflow, so a run already deploying is never cancelled (the
    # deploy job's `pages` group queues the next one behind it).
    concurrency:
      group: docs-build-${{ github.event_name == 'pull_request' && github.ref || 'site' }}
      cancel-in-progress: true
    timeout-minutes: 20  # observed 18s for one version; re-measure as versions accrue
    env:
      # Pinned to the `mdbook-driver` version in Cargo.lock, so the published site
      # and the in-app `/help/*` tree are byte-for-byte the same render.
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every release tag is rebuilt from its own sources.
          fetch-depth: 0
          fetch-tags: true
      - name: The tag is one that may publish
        # `release.yml` runs beside this workflow, not before it, so a tag it
        # will reject (`validate`) still moved the site root here: a tag on a
        # commit that is not on `main`, or one whose Cargo.toml names another
        # version, published its manual as "latest". The same gate the image
        # workflow applies (docker.yml) refuses both before anything is built.
        # It cannot know that a later `release.yml` job will fail; RELEASING.md
        # says so and says how to take such a tag back.
        if: github.ref_type == 'tag'
        run: bash scripts/check-release-tag.sh "$GITHUB_REF_NAME" origin/main
      - name: Self-test the versioned-docs script
        # Synthetic tags and a stub mdbook: seconds, no network. It is what
        # shows `/dev/` coming from `main` on a tag run, and a pull request's
        # build still grading the pull request.
        run: bash scripts/test-build-versioned-docs.sh
      - name: Install mdBook
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }}
      - name: Build every version, link-checking each
        # Each tree is checked against the rendered HTML, not as an mdBook
        # backend — see the header. That check found five broken anchors in
        # shipped documentation the first time it ran, which the 0.4 backend
        # had been passing, and later a "Suggest an edit" link on every page
        # that pointed at a path doubled by mdBook 0.5's `{path}`.
        env:
          # `/dev/` is main's manual on every run that publishes. A pull
          # request deploys nothing and builds its own tree instead, or this
          # job would stop grading the change it runs for.
          DOCS_DEV_REF: ${{ github.event_name == 'pull_request' && 'HEAD' || 'origin/main' }}
        run: ./scripts/build-versioned-docs.sh docs/.book-build
      - name: Install the browser the site check drives
        working-directory: tools/visual-qa
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the built site in a browser
        # What the two steps above cannot see, because neither loads a page:
        # the version switcher is there and lists every version, each banner
        # names the right release, the 404 page a bad version address lands on
        # lets the reader leave it, search results open, and a phone's menu bar
        # does not clip the book title. Served the way Pages serves it.
        run: node scripts/check-docs-site.mjs docs/.book-build
      # Pages packaging is deploy-only: a pull request has no Pages token and
      # nothing to publish, so these steps would fail or waste a run.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: docs/.book-build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15  # observed 11s
    permissions:
      contents: read
      pages: write
      id-token: write
    # Allow one concurrent deployment; don't cancel an in-progress one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
