[book]
title = "BirdNet-Behavior"
authors = ["tomtom215"]
description = "Real-time acoustic bird classification with behavioral analytics — written in Rust, runs on a Raspberry Pi."
src = "docs/book"
language = "en"

[build]
build-dir = "docs/.book-build"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/tomtom215/BirdNet-Behavior"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/tomtom215/BirdNet-Behavior/edit/main/docs/book/{path}"
additional-css = ["docs/book-theme/custom.css"]
smart-punctuation = true

[output.html.search]
enable = true
limit-results = 25
use-boolean-and = true

[output.html.fold]
enable = true
level = 1

# Fail the build on broken *internal* links (cross-references between book
# pages and to in-repo files). External web links are intentionally NOT
# followed in CI: they rot and rate-limit, which would make the docs build
# flaky and block releases. To audit external links on demand, run locally
# with `follow-web-links = true`.
[output.linkcheck]
follow-web-links = false
warning-policy = "error"
