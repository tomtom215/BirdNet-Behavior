[workspace]
members = [
    "crates/birdnet-core",
    "crates/birdnet-db",
    "crates/birdnet-web",
    "crates/birdnet-integrations",
    "crates/birdnet-behavioral",
    "crates/birdnet-timeseries",
    "crates/birdnet-migrate",
    "crates/birdnet-scheduler",
]
resolver = "2"

[workspace.package]
version = "0.5.3"
edition = "2024"
rust-version = "1.95"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/tomtom215/BirdNet-Behavior"
authors = ["tomtom215"]
readme = "README.md"
keywords = ["birdnet", "bird-classification", "acoustic-monitoring", "duckdb", "raspberry-pi"]
categories = ["science", "multimedia::audio"]

[workspace.dependencies]
# Internal crates
birdnet-core = { path = "crates/birdnet-core" }
birdnet-db = { path = "crates/birdnet-db" }
birdnet-web = { path = "crates/birdnet-web" }
birdnet-integrations = { path = "crates/birdnet-integrations" }
birdnet-behavioral = { path = "crates/birdnet-behavioral" }
birdnet-timeseries = { path = "crates/birdnet-timeseries" }
birdnet-migrate = { path = "crates/birdnet-migrate" }
birdnet-scheduler = { path = "crates/birdnet-scheduler" }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Async
tokio = { version = "1.52", features = ["full"] }

# Database
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
# `~` pins the bundled DuckDB version: the `10503` component is DuckDB 1.5.3
# itself (the trailing `.x` is only duckdb-rs's binding revision). It MUST match
# the DuckDB version the published `behavioral` community extension targets —
# DuckDB refuses to LOAD an extension built for any other version (verified:
# even `allow_extensions_metadata_mismatch` does not bypass the LOAD-time check).
# The community CDN serves `behavioral` v0.6.0 built for DuckDB 1.5.3, so the
# bundled engine matches and `LOAD behavioral` succeeds.
#
# When bumping, confirm the new build actually LOADs — an HTTP 200 on the
# version path is not sufficient, because a freshly published artifact can lag
# and still embed the previous DuckDB version in its footer until the
# community-extensions rebuild propagates.
duckdb = { version = "~1.10503", features = ["bundled"] }

# Web
axum = { version = "0.8.9", features = ["ws", "form"] }
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "trace", "fs"] }

# HTTP client
reqwest = { version = "0.13.4", features = ["blocking", "json"] }

# Email (SMTP) — pure Rust TLS via rustls, no OpenSSL
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# System monitoring — CPU, memory, temperature.
#
# sysinfo 0.39.x requires Rust 1.95, which is what sets the workspace MSRV
# floor (see `rust-version` above). The API we use — `RefreshKind::nothing()`,
# `Components::refresh(bool)`, `Component::temperature() -> Option<f32>` — is
# stable across the 0.38/0.39 boundary, so only the version bump is needed.
sysinfo = { version = "0.39", default-features = false, features = ["system", "component"] }

# Async IO utilities (file streaming for recording serving)
tokio-util = { version = "0.7", features = ["io"] }

# Tokio stream utilities (SSE log streaming)
tokio-stream = { version = "0.1", features = ["sync"] }

# Audio
symphonia = { version = "0.6.0", features = ["wav", "flac", "mp3"] }
rubato = "3.0.0"
hound = "3.5"

# ML Inference (ONNX Runtime via ort — supports all ONNX opsets)
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls", "copy-dylibs"] }
# Pulled in transitively through ort's `ndarray` feature; tracked here so the
# declared version matches what the lockfile resolves.
ndarray = "0.17"

# Cryptography — HMAC-SHA256 signing for public share-link tokens (O-07)
hmac = "0.13"
sha2 = "0.11"
base64 = "0.22"

# Password hashing — argon2id for the O-14 / O-15 cookie auth wire flip.
# The basic-auth path stays compatible (it reads CADDY_PWD in plaintext)
# until the wire flips; the seed admin row's hash is rotated by a one-shot
# bootstrap on first start.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }

# File watching
notify = "8"

# Config
configparser = "3.1"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }

# Testing
proptest = "1.11"
tempfile = "3"

# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Pragmatic allowances
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
# Nursery lint that, under the 1.95 toolchain, flags `Duration::from_secs(300)`
# in favour of `from_mins(5)` etc. across ~20 pre-existing call sites. The
# explicit-seconds form is intentional here, so we opt out of the suggestion.
duration_suboptimal_units = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

# Binary crate
[package]
name = "birdnet-behavior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "BirdNet-Behavior: Real-time acoustic bird classification with DuckDB behavioral analytics"

[features]
## On by default — every install gets the full behavioural-analytics experience
## (activity sessions, retention, funnel, co-occurrence, next-species). Toggle
## off with `--no-default-features` for slim dev builds; release binaries ship
## with analytics compiled in regardless (see .github/workflows/release.yml).
default = ["analytics"]
## Enable DuckDB-powered behavioral analytics (sessionize, retention, funnel, etc.).
## Requires ~7 min C++ compilation on first build due to bundled libduckdb.
analytics = ["birdnet-behavioral/analytics", "birdnet-timeseries/analytics", "birdnet-web/analytics"]

[build-dependencies]
# Build-time dependency: renders `docs/book/**` into
# `docs/book/_generated/html/` so the runtime `ServeDir` mounted at
# `/help/*` by `birdnet-web::routes::pages::help::router` has content.
# Hard-required per the maintainer's locked-in RFC answer for O-20
# follow-up — the alternative (silent fallback to a missing PATH) was
# rejected because docs-vs-code drift is the worse failure mode.
#
# Default features keep us off webp / curl-based image downloads (mdbook
# does not need any of that for a static-HTML build of a docs-only book).
mdbook = { version = "0.4", default-features = false }

[dependencies]
birdnet-core.workspace = true
birdnet-db.workspace = true
birdnet-web.workspace = true
birdnet-integrations.workspace = true
# Listed here so the `analytics` feature can refer to them via
# `birdnet-behavioral/analytics` / `birdnet-timeseries/analytics`. The
# binary doesn't reference them directly — birdnet-web does — but Cargo
# requires the dep to appear in this manifest for the feature passthrough
# to resolve. See `[package.metadata.cargo-machete]` below.
birdnet-behavioral.workspace = true
birdnet-timeseries.workspace = true
birdnet-scheduler.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde_json.workspace = true
reqwest.workspace = true
# Used by the `seed-demo-data` [[bin]] for direct SQL against the
# demo-tagged `settings` row + assertions in the bin's tests. Already
# a transitive dep via birdnet-db, so this is a visibility declaration
# rather than a new dependency.
rusqlite.workspace = true

[dev-dependencies]
hound.workspace = true
tempfile.workspace = true
rusqlite.workspace = true
tower.workspace = true
birdnet-web.workspace = true
birdnet-db.workspace = true
serde_json.workspace = true
proptest.workspace = true

[package.metadata.cargo-machete]
# Feature-passthrough deps that machete can't see are used through
# `feature = ["crate/feature"]` chains in [features] above.
ignored = ["birdnet-behavioral", "birdnet-timeseries"]

# Demo-data seeder — a one-shot tool that populates a fresh `birds.db`
# with a deterministic 1 500-row dataset over the trailing 30 days.
# Used by the screenshot pipeline; an operator could also invoke it to
# try the dashboards before their station has captured real detections.
# Built only when explicitly requested via `cargo run --bin seed-demo-data`.
[[bin]]
name = "seed-demo-data"
path = "tools/seed-demo-data.rs"

[lints]
workspace = true
