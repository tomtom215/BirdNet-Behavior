# cargo-audit configuration.
#
# Kept in sync with the `[advisories]` table in `deny.toml`. cargo-deny and
# cargo-audit are intentionally run as redundant gates against the same
# RustSec database (so a silent misconfiguration of one is caught by the
# other), and both need to know which transitive advisories we've already
# triaged.
#
# Revisit every dependency-bump pass: when the upstream patch lands and the
# resolver picks it up, the corresponding entry should be removed from
# BOTH this file and deny.toml.
#
# Current state: one ignore. RUSTSEC-2026-0543 ("chrono is unmaintained",
# informational, no patched version) reaches the lockfile only through
# duckdb -> arrow 60 (arrow-arith, arrow-array, arrow-cast), which require
# chrono non-optionally in their newest release (60.2.0, read 2026-11-22);
# no workspace crate depends on it. This file takes no expiry, so the same
# waiver in osv-scanner.toml carries one (2027-03-01) and that job goes red
# on the day. deny.toml carries it too (CI's cargo-deny reports it).
# Lift it from all three files when an arrow release DuckDB accepts drops chrono.
#
# The previous ignore (RUSTSEC-2026-0097 against rand 0.8.5) was dropped after
# `cargo update --precise rand@0.8.6` landed in the lockfile.

[advisories]
ignore = ["RUSTSEC-2026-0543"]
