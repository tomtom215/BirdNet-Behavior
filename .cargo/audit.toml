# cargo-audit configuration.
#
# Kept in sync with the `[advisories]` table in `deny.toml`. cargo-deny and
# cargo-audit are intentionally run as redundant gates against the same
# RustSec database (so a silent misconfiguration of one is caught by the
# other), and both need to know which transitive advisories we've already
# triaged.
#
# Revisit every dependency-bump pass: when the upstream patch lands and the
# resolver picks it up, the corresponding entry should be removed from
# BOTH this file and deny.toml.
#
# Current state: **no advisory ignores**. The last remaining ignore
# (RUSTSEC-2026-0097 against rand 0.8.5) was dropped after `cargo update
# --precise rand@0.8.6` landed in the lockfile; 0.8.6 carries the
# unsoundness fix.

[advisories]
ignore = []
