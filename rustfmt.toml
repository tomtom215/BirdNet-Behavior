# rustfmt configuration for BirdNet-Behavior.
#
# Only stable formatter options are enabled here so that `cargo fmt --check`
# produces identical output on every developer machine and CI runner without
# requiring a nightly toolchain. Unstable knobs are intentionally omitted.
edition = "2024"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
use_field_init_shorthand = true
use_try_shorthand = true
