[package]
name = "birdnet-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/birdnet-web"
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Web server: REST API, WebSocket, and HTMX pages via axum"

[package.metadata.docs.rs]
# docs.rs builds offline: leave out the bundled DuckDB engine (a C++ build of
# several minutes) that the default `analytics` feature compiles.
no-default-features = true

[features]
## On by default: analytics ships enabled so the behavioural-analytics screens
## work out of the box — embedded and invisible to the user, matching the
## `birdnet-behavior` binary (which also defaults it on). The binary depends on
## this crate with `default-features = false` and re-enables analytics through
## its own `analytics` feature, so a slim `--no-default-features` build stays
## free of the bundled-libduckdb dependency.
default = ["analytics"]
## Enable DuckDB-powered behavioral analytics endpoints.
analytics = ["birdnet-behavioral/analytics", "birdnet-timeseries/analytics"]
## Serve CPU profiles at /admin/debug/pprof/profile (G-24).
profiling = ["dep:pprof"]

[dependencies]
birdnet-behavioral.workspace = true
birdnet-timeseries.workspace = true
birdnet-core.workspace = true
birdnet-db.workspace = true
birdnet-scheduler.workspace = true
birdnet-integrations.workspace = true
birdnet-migrate.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
axum = { workspace = true, features = ["form", "multipart"] }
tempfile.workspace = true
# tower-http brings in the bits of tower we actually use (TraceLayer,
# CorsLayer); a direct tower dep would be redundant.
tower-http.workspace = true
rusqlite.workspace = true
sysinfo.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
reqwest.workspace = true
# Real DEFLATE for the spectrogram PNG writer (it wrote store-only zlib
# blocks) and for the HTTP compression layer.
flate2.workspace = true
pprof = { workspace = true, optional = true }

# HTTPS for the dashboard's own listener. `axum::serve` takes a plain
# `TcpListener` and has no seam for a TLS acceptor, so `tls.rs` runs the accept
# loop itself over hyper-util's auto builder.
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# The manual accept loop calls `Service::call` on the router directly, which
# needs the trait in scope; tower-http does not re-export it.
tower.workspace = true

form_urlencoded.workspace = true

# Share-link token signing (O-07 — public rare-bird permalinks).
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
# OS randomness for the session-id CSPRNG, CSP nonces, share keys and HLS
# tokens (`random::fill`).
getrandom.workspace = true

# `O_NONBLOCK` for opening the owner's dashboard picture (`routes::dashboard_image`):
# a path swapped for a FIFO between the size check and the open must not park a
# blocking-pool thread forever. Constants only; the crate has no `unsafe`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `tower::ServiceExt::oneshot` drives the admin router in the nav route-parity
# test (admin_router_serves_every_nav_destination). Also a normal dependency
# now — `tls.rs`'s accept loop calls `Service::call` on the router directly —
# but kept declared here too so the dev-only `ServiceExt` usage is explicit.
tower.workspace = true
# Captures the request span in `a_share_link_never_reaches_the_request_log`.
tracing-subscriber.workspace = true
# A real HTTP/2 client for `the_csrf_guard_holds_over_http2`: hyper's own
# client would add nothing the test needs, and `h2` lets it send a request
# with `:authority` and no `Host` header, as a browser does. Already in the
# lockfile (hyper's server needs it).
h2 = "0.4"

[lints]
workspace = true
