<!--
  Mobile bottom tab bar · drop-in for layout.html.
  Inline this block immediately before </body>.

  Visible only on `(max-width: 720px) and (pointer: coarse)`. Desktop users
  with a narrow window keep the topnav.

  The v3 spine's six homes all fit the bar, so there is no "More" overflow
  slot or bottom sheet — the long tail (Review, Kiosk, Changelog, Help) is
  reachable through contextual links and the command palette instead. The
  slots are generated from the single nav manifest (routes::pages::nav), so
  this surface can never drift from the desktop top-nav.
-->
<nav class="bnb-tabbar" role="navigation" aria-label="Primary (mobile)">
  <!-- Bottom-bar tabs are generated from the nav manifest (routes::pages::nav). -->
  {{tabbar_slots}}
</nav>
