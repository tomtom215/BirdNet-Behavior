<!--
  Mobile bottom tab bar · drop-in for layout.html.
  Inline this block immediately before </body>.

  Visible only on `(max-width: 720px) and (pointer: coarse)`. Desktop users
  with a narrow window keep the topnav. The "More" slot opens a <dialog>-
  as-bottom-sheet listing the secondary destinations from the topnav.

  Server fills:
    {{nav_dashboard}} / {{nav_today}} / … — same nav-active substitutions
                                            as layout.html. Reuse them.
-->
<nav class="bnb-tabbar" role="navigation" aria-label="Primary (mobile)">
  <a href="/"          class="bnb-tabbar__slot {{nav_dashboard}}" aria-label="Dashboard">
    <span class="glyph" aria-hidden="true">⌂</span><span class="label">Now</span>
  </a>
  <a href="/today"     class="bnb-tabbar__slot {{nav_today}}" aria-label="Today">
    <span class="glyph" aria-hidden="true">⊙</span><span class="label">Today</span>
  </a>
  <a href="/species"   class="bnb-tabbar__slot {{nav_species}}" aria-label="Species">
    <span class="glyph" aria-hidden="true">⌬</span><span class="label">Species</span>
  </a>
  <a href="/heatmap"   class="bnb-tabbar__slot {{nav_heatmap}}" aria-label="Heatmap">
    <span class="glyph" aria-hidden="true">▦</span><span class="label">When</span>
  </a>
  <a href="/migration" class="bnb-tabbar__slot {{nav_migration}}" aria-label="Migration">
    <span class="glyph" aria-hidden="true">∿</span><span class="label">Migration</span>
  </a>
  <button type="button" class="bnb-tabbar__slot" aria-haspopup="dialog" aria-controls="bnb-more-sheet" data-open-more>
    <span class="glyph" aria-hidden="true">⌗</span><span class="label">More</span>
  </button>
</nav>

<dialog id="bnb-more-sheet" class="bnb-sheet" aria-labelledby="bnb-more-title">
  <form method="dialog" class="bnb-sheet__form">
    <header class="bnb-sheet__head">
      <h2 id="bnb-more-title" class="display tb-h2">More</h2>
      <button type="submit" class="bnb-btn ghost" aria-label="Close">×</button>
    </header>
    <ul class="bnb-sheet__list">
      <li><a href="/life-list"      class="bnb-sheet__row"><span class="glyph">✦</span> Life list</a></li>
      <li><a href="/quarantine"     class="bnb-sheet__row"><span class="glyph">⚠</span> Quarantine</a></li>
      <li><a href="/analytics/dawn-chorus" class="bnb-sheet__row"><span class="glyph">◐</span> Dawn chorus</a></li>
      <li><a href="/correlation"    class="bnb-sheet__row"><span class="glyph">☰</span> Co-occurrence</a></li>
      <li><a href="/timeseries"     class="bnb-sheet__row"><span class="glyph">∷</span> Trends</a></li>
      <li><a href="/listen"         class="bnb-sheet__row"><span class="glyph">♪</span> Live audio</a></li>
      <li><a href="/recordings"     class="bnb-sheet__row"><span class="glyph">▶</span> Recordings</a></li>
      <li><a href="/gallery"        class="bnb-sheet__row"><span class="glyph">◫</span> Gallery</a></li>
      <li><a href="/history"        class="bnb-sheet__row"><span class="glyph">◷</span> History</a></li>
      <li><a href="/weekly"         class="bnb-sheet__row"><span class="glyph">¶</span> Weekly</a></li>
      <li><a href="/year-in-review" class="bnb-sheet__row"><span class="glyph">⊞</span> Year in review</a></li>
      <li><a href="/system"         class="bnb-sheet__row"><span class="glyph">⚙</span> System</a></li>
      <li><a href="/notifications"  class="bnb-sheet__row"><span class="glyph">≡</span> Notifications</a></li>
      <li><a href="/admin"          class="bnb-sheet__row"><span class="glyph">⌗</span> Admin</a></li>
    </ul>
  </form>
</dialog>

<script>
(function () {
  "use strict";
  // Scope to THIS opener (the tabbar one) by its aria-controls — the topnav
  // ships another [data-open-more] button earlier in the DOM, so a bare
  // querySelector would grab that one instead and this sheet would never open.
  var btn = document.querySelector('[data-open-more][aria-controls="bnb-more-sheet"]');
  var sheet = document.getElementById('bnb-more-sheet');
  if (!btn || !sheet || typeof sheet.showModal !== 'function') return;
  btn.addEventListener('click', function () { sheet.showModal(); });
})();
</script>
