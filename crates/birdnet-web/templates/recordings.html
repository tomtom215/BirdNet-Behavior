<div class="page-head rt-head"><div><div class="bnb-eyebrow rt-eyebrow"><span>Browse</span>{{help_link}}</div><h1 class="display rt-h1">Recordings</h1></div></div>

<div class="card rt-card-mb">
    <div class="rt-tabs">
        <button class="tab-btn rt-tab active" id="tab-by-species">
            By Species
        </button>
        <button class="tab-btn rt-tab" id="tab-by-date">
            By Date
        </button>
    </div>

    <div id="view-species"
         hx-get="/pages/recordings-species-list"
         hx-trigger="load"
         hx-swap="innerHTML">
        <p class="rt-loading">Loading species...</p>
    </div>

    <div id="view-date" class="rt-hidden"
         hx-get="/pages/recordings-date-list"
         hx-trigger="revealed"
         hx-swap="innerHTML">
        <p class="rt-loading">Loading dates...</p>
    </div>
</div>

<div id="recordings-detail" class="card rt-hidden">
    <div id="recordings-detail-content">
    </div>
</div>

<script>
function switchTab(tab) {
    var speciesView = document.getElementById('view-species');
    var dateView = document.getElementById('view-date');
    var btnSpecies = document.getElementById('tab-by-species');
    var btnDate = document.getElementById('tab-by-date');
    if (tab === 'species') {
        speciesView.classList.remove('rt-hidden');
        dateView.classList.add('rt-hidden');
        btnSpecies.classList.add('active');
        btnDate.classList.remove('active');
    } else {
        speciesView.classList.add('rt-hidden');
        dateView.classList.remove('rt-hidden');
        btnDate.classList.add('active');
        btnSpecies.classList.remove('active');
        htmx.trigger(dateView, 'revealed');
    }
}

// CSP-safe wiring (no inline on* handlers): tab buttons + delegated row clicks.
document.getElementById('tab-by-species').addEventListener('click', function () { switchTab('species'); });
document.getElementById('tab-by-date').addEventListener('click', function () { switchTab('date'); });
document.addEventListener('click', function (e) {
    if (e.target.closest('.rec-item')) {
        document.getElementById('recordings-detail').classList.remove('rt-hidden');
    }
});
</script>
