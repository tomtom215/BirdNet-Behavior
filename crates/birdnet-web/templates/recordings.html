<script>
// Clips view behaviours: the shared clip player + a now-playing dock that
// rides the page-head and floats up on scroll, plus Select-mode bulk actions
// over the existing per-item endpoints. CSP-safe: no inline handlers, computed
// widths set straight on `element.style` (which CSP does not police), markup
// built with classes only.
(function () {
  "use strict";
  var clips = document.getElementById('rc-clips');
  if (!clips) return;

  var head   = document.getElementById('rc-headplayer');
  var floatd = null;
  var player = null;       // the single shared HTMLAudioElement
  var playBtn = null;      // the row ▶ button currently playing

  function fmtTime(s) {
    if (!isFinite(s)) return '0:00';
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  // Build a now-playing panel (head card or float dock) from a row's button.
  function fill(container, btn, floating) {
    container.innerHTML =
      '<div class="rc-hp' + (floating ? ' floating' : '') + '">' +
        '<div class="rc-hp-row">' +
          '<button type="button" class="rc-hp-toggle" aria-label="Pause">⏸</button>' +
          '<span class="rc-hp-av"></span>' +
          '<span class="rc-hp-text"><span class="rc-hp-name"></span>' +
          '<span class="bnb-meta mono rc-hp-meta"></span></span>' +
          '<a class="rc-iact rc-hp-dl" title="Download clip" aria-label="Download clip">↓</a>' +
        '</div>' +
        '<div class="rc-hp-scrub"><i></i></div>' +
        '<div class="bnb-meta mono rc-hp-time">0:00</div>' +
      '</div>';
    container.querySelector('.rc-hp-name').textContent = btn.getAttribute('data-clip-name') || 'Clip';
    container.querySelector('.rc-hp-meta').textContent = btn.getAttribute('data-clip-meta') || '';
    var src = btn.getAttribute('data-play-src');
    var dl = container.querySelector('.rc-hp-dl');
    if (dl && src) { dl.setAttribute('href', src); dl.setAttribute('download', ''); }
    var row = btn.closest('.rc-row');
    var av = row && row.querySelector('.bnb-avatar');
    if (av) container.querySelector('.rc-hp-av').appendChild(av.cloneNode(true));
    container.querySelector('.rc-hp-toggle').addEventListener('click', toggle);
  }

  function refreshDocks(btn) {
    if (head) { head.hidden = false; fill(head, btn, false); }
    if (!floatd) {
      floatd = document.createElement('div');
      floatd.id = 'rc-floatdock';
      floatd.className = 'rc-floatdock';
      document.body.appendChild(floatd);
    }
    fill(floatd, btn, true);
    // Float the dock once the head card scrolls out of view.
    if (window.__rcObs) window.__rcObs.disconnect();
    if (head && 'IntersectionObserver' in window) {
      window.__rcObs = new IntersectionObserver(function (es) {
        floatd.classList.toggle('show', !es[0].isIntersecting);
      }, { threshold: 0 });
      window.__rcObs.observe(head);
    }
  }

  function setGlyphs(symbol) {
    // The accessible name has to move with the glyph. `aria-label="Pause"` was
    // written into the markup once, at creation, and never updated — and
    // aria-label wins over text content — so a *paused* clip's button
    // announced itself as "Pause", i.e. the opposite of what pressing it does.
    var label = symbol === '⏸' ? 'Pause' : 'Play';
    document.querySelectorAll('.rc-hp-toggle').forEach(function (b) {
      b.textContent = symbol;
      b.setAttribute('aria-label', label);
    });
    if (playBtn) {
      playBtn.textContent = symbol === '⏸' ? '⏸' : '▶';
      playBtn.setAttribute('aria-label', label + ' this clip');
    }
  }

  function stop() {
    if (player) player.pause();
    if (playBtn) playBtn.classList.remove('playing');
  }
  // True between calling play() and playback actually beginning. `paused` goes
  // false the instant play() is called, so without this a second click on a
  // clip that is still loading pauses the clip the operator is waiting for —
  // the same trap that made Listen -> Live look broken in 0.13.0. Short for a
  // local clip, but not zero, and a cold cache or a busy Pi widens it.
  var starting = false;
  function beginPlayback(onPlaying) {
    starting = true;
    player.play().then(function () {
      starting = false;
      onPlaying();
    }).catch(function () {
      starting = false;
      onEnded();
    });
  }
  function toggle() {
    if (!player || starting) return;
    if (player.paused) { beginPlayback(function () { setGlyphs('⏸'); if (playBtn) playBtn.classList.add('playing'); }); }
    else { player.pause(); setGlyphs('▶'); if (playBtn) playBtn.classList.remove('playing'); }
  }

  function onProgress() {
    if (!player || !player.duration) return;
    var pct = (player.currentTime / player.duration) * 100;
    document.querySelectorAll('.rc-hp-scrub i').forEach(function (i) { i.style.width = pct + '%'; });
    document.querySelectorAll('.rc-hp-time').forEach(function (t) {
      t.textContent = fmtTime(player.currentTime) + ' / ' + fmtTime(player.duration);
    });
  }
  function onEnded() {
    setGlyphs('▶');
    if (playBtn) { playBtn.classList.remove('playing'); }
    if (floatd) floatd.classList.remove('show');
  }

  // ── Shared player: a row ▶ starts / docks a clip ──────────────────────────
  clips.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-play-src]');
    if (!btn) return;
    e.preventDefault();
    if (starting) return;   // still loading: ignore rather than cancel it
    if (btn === playBtn && player && !player.paused) { player.pause(); setGlyphs('▶'); btn.classList.remove('playing'); return; }
    stop();
    if (!player) {
      player = new Audio();
      player.preload = 'none';
      player.addEventListener('timeupdate', onProgress);
      player.addEventListener('ended', onEnded);
      player.addEventListener('error', onEnded);
    }
    playBtn = btn;
    player.src = btn.getAttribute('data-play-src');
    beginPlayback(function () {
      btn.classList.add('playing');
      refreshDocks(btn);
      setGlyphs('⏸');
    });
  });

  // ── Select mode + bulk bar ────────────────────────────────────────────────
  var selBtn = document.getElementById('rc-selmode');
  var selbar = document.getElementById('rc-selbar');
  var selecting = false;
  function selectedRows() { return Array.prototype.slice.call(clips.querySelectorAll('.rc-row.sel')); }
  function updateBar() {
    var n = selectedRows().length;
    var c = document.getElementById('rc-selcount'); if (c) c.textContent = n;
    if (selbar) selbar.classList.toggle('show', selecting && n > 0);
  }
  function setSelecting(on) {
    selecting = on;
    clips.classList.toggle('rc-selecting', on);
    if (selBtn) { selBtn.textContent = on ? 'Done' : 'Select'; selBtn.setAttribute('aria-pressed', on ? 'true' : 'false'); }
    if (!on) {
      clips.querySelectorAll('.rc-row.sel').forEach(function (r) {
        r.classList.remove('sel');
        var ch = r.querySelector('.rc-check'); if (ch) ch.setAttribute('aria-checked', 'false');
      });
    }
    updateBar();
  }
  if (selBtn) selBtn.addEventListener('click', function () { setSelecting(!selecting); });

  function toggleRow(row) {
    var on = !row.classList.contains('sel');
    row.classList.toggle('sel', on);
    var ch = row.querySelector('.rc-check'); if (ch) ch.setAttribute('aria-checked', on ? 'true' : 'false');
    updateBar();
  }
  clips.addEventListener('click', function (e) {
    if (!selecting) return;
    if (e.target.closest('[data-play-src], a, button:not(.rc-check)')) return;
    var row = e.target.closest('.rc-row');
    if (row) { e.preventDefault(); toggleRow(row); }
  });
  clips.addEventListener('keydown', function (e) {
    if (!selecting || (e.key !== ' ' && e.key !== 'Enter')) return;
    var ch = e.target.closest('.rc-check'); if (!ch) return;
    e.preventDefault(); toggleRow(ch.closest('.rc-row'));
  });

  function keyOf(row) { return (row.getAttribute('data-key') || '').split('|'); }
  function post(url, parts) {
    var body = 'date=' + encodeURIComponent(parts[0]) + '&time=' + encodeURIComponent(parts[1]) +
               '&sci_name=' + encodeURIComponent(parts[2]);
    return fetch(window.bnbUrl(url), { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body });
  }
  // Guards the same trap the live-audio button had: a bulk action over many
  // clips takes long enough on a Pi that the page looks inert, and a second
  // click used to fire the whole batch again. `fetch` also resolves for 4xx/5xx
  // — without checking `ok`, a batch that failed outright still reloaded the
  // page and presented as success.
  var bulkBusy = false;
  function bulk(url) {
    if (bulkBusy) return;
    var rows = selectedRows(); if (!rows.length) return;
    bulkBusy = true;
    Promise.all(rows.map(function (r) { return post(url, keyOf(r)); }))
      .then(function (responses) {
        // A write the station refused answers 200 with `HX-Reswap: none`
        // (htmx drops the body of an error status), so `ok` alone is not
        // enough. And the others in the batch *were* changed: this used to say
        // "Nothing else was changed", which was never true.
        var failed = responses.filter(function (r) {
          return !r.ok || r.headers.get('HX-Reswap') === 'none';
        }).length;
        if (failed) {
          window.alert(failed + ' of ' + responses.length + ' clips could not be updated; ' +
            (responses.length - failed) + ' were. The page will now show where each one stands.');
        }
        window.location.reload();
      })
      .catch(function () {
        bulkBusy = false;
        window.alert('That action could not be completed — check the station is still reachable.');
      });
  }
  var bl = document.getElementById('rc-bulk-lock');
  if (bl) bl.addEventListener('click', function () { bulk('/pages/recordings-lock'); });
  var bd = document.getElementById('rc-bulk-del');
  if (bd) bd.addEventListener('click', function () {
    var n = selectedRows().length; if (!n) return;
    if (window.confirm('Delete ' + n + ' selected clip' + (n === 1 ? '' : 's') + '?')) bulk('/pages/recordings-delete');
  });
  var bdl = document.getElementById('rc-bulk-dl');
  if (bdl) bdl.addEventListener('click', function () {
    selectedRows().forEach(function (r) {
      var p = r.querySelector('[data-play-src]'); if (!p) return;
      var a = document.createElement('a');
      a.href = p.getAttribute('data-play-src'); a.setAttribute('download', '');
      document.body.appendChild(a); a.click(); a.remove();
    });
  });
})();
</script>

<script>
// Live view: the honest scrolling sonogram (real spectrogram WebSocket frames,
// a flat idle baseline otherwise — never a fake waveform), the per-source audio
// player, and a source picker. Ported from the dashboard / listen producers.
(function () {
  "use strict";
  var cnv = document.getElementById('rc-spectrogram');
  if (!cnv || !cnv.getContext) return;
  var ctx = cnv.getContext('2d');
  var framesEl = document.getElementById('rc-frames');
  var pill = document.getElementById('rc-live-status');
  var W = 0, H = 200, lastFrame = 0, IDLE_AFTER_MS = 30000, pillState = '';

  function dark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }
  // Three states, as on the Today card: live, idle (reachable and quiet), and
  // no signal (this browser cannot reach the stream at all). This view had
  // only the first two, so a blocked or dropped socket read as a quiet yard.
  var connected = false;
  function setState(next) {
    if (!pill || pillState === next) return;
    pillState = next;
    pill.classList.toggle('moss', next === 'live');
    pill.classList.toggle('rare', next === 'nosignal');
    pill.innerHTML = next === 'live' ? '<span class="bnb-dot live"></span> live'
      : next === 'nosignal' ? '<span class="bnb-dot"></span> no signal'
      : '<span class="bnb-dot"></span> idle';
    pill.title = next === 'nosignal' ? 'This browser could not reach the live stream' : '';
  }
  function setLive(on) { setState(on ? 'live' : (connected ? 'idle' : 'nosignal')); }
  function cellColor(v) {
    v = Math.max(0, Math.min(1, v));
    return 'oklch(' + (35 + v * 55).toFixed(0) + '% ' + (0.04 + v * 0.16).toFixed(3) + ' ' + (160 - v * 70).toFixed(0) + ')';
  }
  function resize() { W = cnv.width = cnv.clientWidth; cnv.height = H; }
  resize(); window.addEventListener('resize', resize);

  function drawIdle() {
    ctx.clearRect(0, 0, W, H);
    // Pixel-aligned and at a readable opacity, for the same reason as the
    // Today card: a 1px stroke on an integer y straddles two device rows and
    // is drawn at half intensity in each, which on a white card is invisible.
    var y = Math.round(H / 2) + 0.5;
    ctx.strokeStyle = dark() ? 'oklch(68% 0.03 150 / 0.75)' : 'oklch(48% 0.03 150 / 0.60)';
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  // Reduced motion: throttle the live repaint rather than stopping it — the
  // content is the point. Same treatment as the Today hero card.
  var REDUCED_MS = 1500;
  var lastPaint = 0, pending = null, pendingTimer = null;
  function motionReduced() {
    try {
      if (document.documentElement.getAttribute('data-motion') === 'reduced') return true;
    } catch (e) { /* fall through */ }
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }
  function drawFrame(frame) {
    if (motionReduced()) {
      pending = frame;
      var wait = REDUCED_MS - (Date.now() - lastPaint);
      if (wait > 0) {
        if (!pendingTimer) {
          pendingTimer = setTimeout(function () {
            pendingTimer = null;
            var f = pending; pending = null;
            if (f) paintFrame(f);
          }, wait);
        }
        // The signal is live even while a repaint is being held back; this is
        // the same variable `idleLoop` reads (`lastFrame`, not the Today
        // card's `lastFrameTime` — the two files name it differently).
        lastFrame = Date.now();
        setLive(true);
        return;
      }
      pending = null;
    }
    paintFrame(frame);
  }
  function paintFrame(frame) {
    lastPaint = Date.now();
    var nMels = frame.n_mels, nFrames = frame.n_frames;
    if (!nMels || !nFrames || !frame.data) return;
    ctx.clearRect(0, 0, W, H);
    var colW = W / nFrames, rowH = H / nMels;
    for (var f = 0; f < nFrames; f++) {
      for (var m = 0; m < nMels; m++) {
        var v = frame.data[m * nFrames + f] || 0;
        if (v < 0.05) continue;
        ctx.fillStyle = cellColor(v);
        ctx.fillRect((f * colW) | 0, (H - (m + 1) * rowH) | 0, Math.ceil(colW), Math.ceil(rowH));
      }
    }
    lastFrame = Date.now();
    setLive(true);
    if (framesEl) framesEl.textContent = nFrames + ' frames';
  }
  function idleLoop() {
    if (Date.now() - lastFrame > IDLE_AFTER_MS) { setLive(false); drawIdle(); }
    setTimeout(idleLoop, 1000);
  }
  setLive(false); drawIdle(); setTimeout(idleLoop, 1000);

  // ── Per-source audio playback ─────────────────────────────────────────────
  var sel = document.getElementById('rc-source');

  // The broadcast carries every source's frames to every client, so the picker
  // only means something if the client drops the ones it did not ask for.
  // Until frames carried a `source` this was impossible: choosing a microphone
  // changed nothing, and a two-source station interleaved both inputs into one
  // spectrogram that looked like a single noisy feed.
  //
  // An empty selection is the "— default audio source —" row, which is not a
  // filter — it draws whatever arrives, matching the audio side, where an empty
  // value streams /stream with no source_id.
  function frameIsSelected(m) {
    var want = sel ? sel.value : '';
    return !want || m.source === want;
  }

  // Reconnecting, as on the Today card: it used to connect once and stay
  // dead after a Wi-Fi blip or a station restart until the page was reloaded.
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var base = (document.body && document.body.dataset.basePath) || '';
  var backoff = 1000, retry = null;
  function scheduleReconnect() {
    if (retry) return;
    if (document.hidden) {
      document.addEventListener('visibilitychange', function once() {
        if (document.hidden) return;
        document.removeEventListener('visibilitychange', once);
        scheduleReconnect();
      });
      return;
    }
    var wait = backoff + Math.floor(Math.random() * 500);
    backoff = Math.min(backoff * 2, 30000);
    retry = setTimeout(function () { retry = null; connect(); }, wait);
  }
  function lost() { connected = false; setLive(false); drawIdle(); scheduleReconnect(); }
  function connect() {
    var ws;
    try { ws = new WebSocket(proto + '//' + location.host + base + '/api/v2/ws/spectrogram'); }
    catch (_) { lost(); return; }
    ws.onopen = function () { connected = true; backoff = 1000; if (Date.now() - lastFrame > IDLE_AFTER_MS) setLive(false); };
    ws.onmessage = function (ev) {
      try {
        var m = JSON.parse(ev.data);
        if (m.event === 'spectrogram' && frameIsSelected(m)) drawFrame(m);
      } catch (_) {}
    };
    ws.onerror = function () { try { ws.close(); } catch (_) {} };
    ws.onclose = lost;
  }
  connect();

  // Switching source mid-stream: clear immediately rather than leaving the
  // previous source's trace on screen until the next frame arrives (up to a
  // full segment away), which read as the picker having done nothing.
  if (sel) sel.addEventListener('change', function () { setLive(false); drawIdle(); });

  var audio = document.getElementById('rc-audio');
  var btn = document.getElementById('rc-listen-btn');
  var glyph = document.getElementById('rc-listen-glyph');
  var label = document.getElementById('rc-listen-label');
  var shiftSel = document.getElementById('rc-freq-shift');

  // The pitch shift belongs to the listener, not to the station: hearing loss
  // is a property of a person, and this station serves one stream per
  // connection rather than one broadcast for everyone (which is why upstream's
  // equivalent had to be a station-wide setting). So the choice is remembered
  // per browser, and two people listening to the same station at the same time
  // can each have their own.
  var SHIFT_KEY = 'bnb.liveFreqShiftHz';
  function loadShift() {
    if (!shiftSel) return;
    var first = shiftSel.options.length ? shiftSel.options[0].value : '0';
    try {
      var v = window.localStorage.getItem(SHIFT_KEY);
      if (v === null) return;
      shiftSel.value = v;
      // Assigning a value that is not one of the options leaves `.value` as
      // the empty string. That would show a blank control and stick, because
      // the empty string is then what gets stored back — so fall back to the
      // first option and rewrite the stored value.
      if (shiftSel.value === '' || shiftSel.selectedIndex < 0) {
        shiftSel.value = first;
        saveShift();
      }
    } catch (_) { /* private mode, or site data blocked */ }
  }
  function saveShift() {
    try {
      if (shiftSel) window.localStorage.setItem(SHIFT_KEY, shiftSel.value);
    } catch (_) {}
  }
  function shiftHz() {
    var n = shiftSel ? parseInt(shiftSel.value, 10) : 0;
    return Number.isFinite(n) ? n : 0;
  }
  loadShift();

  function srcFor(v) {
    var q = [];
    if (v) q.push('source_id=' + encodeURIComponent(v));
    var hz = shiftHz();
    if (hz !== 0) q.push('freq_shift_hz=' + encodeURIComponent(String(hz)));
    return window.bnbUrl(q.length ? '/stream?' + q.join('&') : '/stream');
  }

  // `play()` sets `audio.paused` to false synchronously, but its promise only
  // resolves once the browser has buffered enough to start — around a second on
  // a Pi, since ffmpeg has to fill a frame before the first MP3 bytes leave the
  // station. Without a guard the button still reads "Listen (audio)" for that
  // whole window, and the natural response to apparent silence — clicking again
  // — lands in the stop branch and kills the stream that was about to start.
  // Clicking through that cycle is indistinguishable from live audio being
  // broken, which is exactly how it was reported.
  var connecting = false;
  var connectTimer = null;
  function clearConnectTimer() {
    if (connectTimer) { clearTimeout(connectTimer); connectTimer = null; }
  }
  function showIdle() {
    connecting = false; clearConnectTimer();
    if (glyph) glyph.textContent = '▶';
    if (label) label.textContent = 'Listen (audio)';
  }
  function showPlaying() {
    connecting = false; clearConnectTimer();
    if (glyph) glyph.textContent = '■';
    if (label) label.textContent = 'Stop';
  }
  function showFailed(text) {
    connecting = false; clearConnectTimer();
    audio.pause();
    audio.removeAttribute('src');
    if (glyph) glyph.textContent = '▶';
    if (label) label.textContent = text;
  }
  function start() {
    connecting = true;
    if (label) label.textContent = 'Connecting…';
    audio.src = srcFor(sel ? sel.value : '');
    // A stream that connects but never buffers enough to start fires `stalled`,
    // not `error`, so play() can stay pending indefinitely. Ignoring clicks
    // while that is true would leave the button permanently dead; give up and
    // hand control back instead.
    clearConnectTimer();
    connectTimer = setTimeout(function () {
      if (connecting) showFailed('Stream did not start — retry');
    }, 20000);
    audio.play().then(showPlaying).catch(function () { showFailed('Audio blocked — retry'); });
  }
  function stop() { audio.pause(); audio.removeAttribute('src'); showIdle(); }

  if (sel && audio) sel.addEventListener('change', function () {
    if (!audio.paused) start();
  });
  // Changing the pitch mid-listen reconnects, because the shift is applied by
  // the encoder on the station and cannot be changed on a stream already open.
  // Restarting is a second of silence; the alternative is a control that
  // appears to do nothing until you stop and start again yourself.
  if (shiftSel && audio) shiftSel.addEventListener('change', function () {
    saveShift();
    if (!audio.paused || connecting) start();
  });
  if (btn && audio) btn.addEventListener('click', function () {
    if (connecting) return;   // mid-connect: ignore the click rather than cancel
    if (audio.paused) start(); else stop();
  });
  if (audio) audio.addEventListener('ended', showIdle);
  // A stream that dies — ffmpeg gone, source stopped mid-listen — must not
  // strand the button on "Connecting…" with no way back to a usable state.
  if (audio) audio.addEventListener('error', function () {
    if (audio.paused && !connecting) return;
    showFailed('Stream unavailable — retry');
  });
})();
</script>
