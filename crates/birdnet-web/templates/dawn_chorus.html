<!--
  Dawn chorus · NEW page at /analytics/dawn-chorus
  Stacked polar ribbons of per-species 24-hour activity, layered around a
  day/night wedge with sunrise/sunset markers. Right rail lists each species
  as a linear hour-strip + tiny circadian ring.

  Drop-in: register at /analytics/dawn-chorus (see DIFF.md).
-->
{{page_head}}

<!-- Polar plot — the one picture this tab leads with -->
<div class="bnb-card pad dc-polar-card">
  <div id="dawn-polar"
       hx-get="/pages/dawn-polar"
       hx-trigger="load"
       hx-swap="innerHTML"
       class="dc-polar-wrap">
    {{skel_polar}}
  </div>
</div>

<!-- Each bird's day, flat: the same numbers as the rings, one row per species -->
<div class="bnb-card pad fig dc-list-card">
  <div class="section-header">
    <div>
      <div class="bnb-eyebrow"><span class="fig-no" aria-hidden="true"></span>Hour by hour</div>
      <h2 class="sh-h">Each bird's day</h2>
    </div>
    <a class="action" href="/species">All species →</a>
  </div>
  <p class="bnb-meta dc-strip-note">
    The same species, laid flat: the day runs left to right and a taller column is an
    hour that bird is heard more. The shaded band is the dawn window, 05:00 to 08:59.
  </p>
  <div id="dawn-list"
       hx-get="/pages/dawn-list"
       hx-trigger="load"
       hx-swap="innerHTML"
       class="dc-list-slot">
    {{skel_ribbons}}
  </div>
</div>

<script>
(function () {
  // Tiny enhancement: the polar SVG includes sunrise/sunset hours as
  // data-attributes; copy them into the hero subtitle so the times stay in
  // sync with whatever the server computed.
  function syncSunTimes() {
    var svg = document.querySelector('#dawn-polar svg[data-sunrise]');
    if (!svg) return;
    var r = svg.getAttribute('data-sunrise');
    var s = svg.getAttribute('data-sunset');
    var er = document.getElementById('sun-rise');
    var es = document.getElementById('sun-set');
    if (er && r) er.textContent = r;
    if (es && s) es.textContent = s;
    // The sentence is shown only once it has times to say: a station with no
    // coordinates used to read "Sunrise —, sunset —." in the middle of the lede.
    var line = document.getElementById('sun-line');
    if (line && r && s) line.hidden = false;
  }
  // Run after htmx swaps the partial in.
  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.target && e.target.id === 'dawn-polar') syncSunTimes();
  });
})();
</script>
