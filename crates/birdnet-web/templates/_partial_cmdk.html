<!--
  Command palette overlay · drop-in for layout.html.
  Inline this block immediately before </body>.

  Reads no template variables. The script handles ⌘K / Ctrl-K / "/" to open,
  Esc to close, arrow keys to navigate, Enter to follow. All results come
  from /pages/cmdk?q=… via htmx — the server owns ranking and filtering.
-->
<dialog id="bnb-cmdk" class="bnb-cmdk" aria-labelledby="bnb-cmdk-label">
  <form method="dialog" class="bnb-cmdk__shell" autocomplete="off">
    <h2 id="bnb-cmdk-label" class="bnb-cmdk__sr ck-sr">
      Quick navigator
    </h2>
    <div class="bnb-cmdk__inputwrap">
      <span class="bnb-cmdk__icon" aria-hidden="true">⌕</span>
      <input
        id="bnb-cmdk-input"
        type="search"
        name="q"
        placeholder="Search species, dates, settings…"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        hx-get="/pages/cmdk"
        hx-trigger="keyup changed delay:120ms, load"
        hx-target="#bnb-cmdk-results"
        hx-swap="innerHTML"
        hx-include="this">
      <span class="bnb-cmdk__chip mono" aria-hidden="true">⌘K</span>
      <span class="htmx-indicator bnb-cmdk__loading" aria-hidden="true">…</span>
    </div>

    <ul id="bnb-cmdk-results" class="bnb-cmdk__results" role="listbox" aria-label="Results">
      <!-- Filled by /pages/cmdk on load -->
    </ul>

    <footer class="bnb-cmdk__foot mono">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </footer>
  </form>
</dialog>

<script>
(function () {
  "use strict";
  var dlg = document.getElementById('bnb-cmdk');
  if (!dlg || typeof dlg.showModal !== 'function') return;

  var input   = document.getElementById('bnb-cmdk-input');
  var results = document.getElementById('bnb-cmdk-results');
  var active  = -1;

  function isTypingTarget(t) {
    if (!t) return false;
    var tag = (t.tagName || '').toLowerCase();
    return tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable;
  }

  function rows() {
    return Array.prototype.slice.call(results.querySelectorAll('li[data-href]'));
  }
  function setActive(i) {
    var rs = rows();
    if (!rs.length) { active = -1; return; }
    if (i < 0) i = rs.length - 1;
    if (i >= rs.length) i = 0;
    rs.forEach(function (r, idx) {
      var on = idx === i;
      r.setAttribute('aria-selected', on ? 'true' : 'false');
      r.classList.toggle('is-active', on);
      if (on) r.scrollIntoView({ block: 'nearest' });
    });
    active = i;
  }

  function open() {
    dlg.showModal();
    input.value = '';
    input.focus();
    // Kick a default load so results aren't empty.
    if (window.htmx) window.htmx.trigger(input, 'load');
  }
  function close() { dlg.close(); }

  function followActive() {
    var r = rows()[active];
    if (!r) return;
    var href = r.getAttribute('data-href');
    if (href) window.location.href = href;
  }

  // ⌘K / Ctrl-K (and "/" when nothing focused) → open
  document.addEventListener('keydown', function (e) {
    var meta = e.metaKey || e.ctrlKey;
    if (meta && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      dlg.open ? close() : open();
      return;
    }
    if (!dlg.open && e.key === '/' && !isTypingTarget(e.target)) {
      e.preventDefault();
      open();
    }
  });

  // Inside the dialog: navigate / activate.
  dlg.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Enter') {
      if (active >= 0) { e.preventDefault(); followActive(); }
    }
  });

  // Click on a row → follow.
  results.addEventListener('click', function (e) {
    var li = e.target.closest('li[data-href]');
    if (!li) return;
    e.preventDefault();
    window.location.href = li.getAttribute('data-href');
  });

  // Reset active row whenever results swap.
  document.body.addEventListener('htmx:afterSwap', function (e) {
    if (e.target && e.target.id === 'bnb-cmdk-results') {
      setActive(0);
    }
  });
})();
</script>
