<!--
  Single audio-source row · used in initial page render AND as the response
  body when POST /admin/audio/sources or PATCH /admin/audio/sources/{id}
  completes successfully.

  Server fills:
    {{id}}            — "src_usb_1"
    {{kind_class}}    — "usb" | "pipe" | "rtsp" (drives badge tint)
    {{kind_label}}    — "USB · ALSA" | "PipeWire" | "RTSP"
    {{label}}         — friendly label (may be empty)
    {{label_class}}   — "" or "untitled" (when {{label}} is empty)
    {{label_text}}    — {{label}} or "— no friendly label —"
    {{device_id}}     — "plughw:1,0" / "rtsp://…"
    {{detail_line}}   — "48 kHz · mono · 24-bit · gain +12 dB"
    {{status_class}}  — "live" | "starting" | "paused" | "down"
    {{status_label}}  — "Capturing" | "Starting…" | "Paused (schedule)" | "Down"
    {{meta_line}}     — "up 6d 04h" | "EHOSTUNREACH · retry in 38s" | …
    listen_default    — (written without braces here on purpose: this comment
                        goes through the same substitution the markup does, so
                        naming the placeholder would render a second copy of
                        the control inside this comment) — either a "Listen
                        default" pill, when this source is the station's
                        default for /stream, or the button that makes it one.

  Each row polls /admin/audio/sources/{id}/probe every 8s for live status.
-->
<li class="audio-source"
    role="listitem"
    data-source-id="{{id}}"
    hx-target="this"
    hx-swap="outerHTML">

  <div class="audio-source__kind">
    <span class="audio-kind-badge {{kind_class}}">
      <span class="audio-kind-glyph" aria-hidden="true"></span>
      {{kind_label}}
    </span>
  </div>

  <div class="audio-source__id">
    <div class="audio-source__label {{label_class}}">{{label_text}}</div>
    <div class="audio-source__device mono">{{device_id}}</div>
    <div class="audio-source__detail mono">{{detail_line}}</div>
  </div>

  <div class="audio-source__right">
    <!--
      hx-target="this" is load-bearing, not redundant.

      The <li> above declares hx-target="this", and hx-target is INHERITED. When
      an inherited value is "this", htmx resolves it to the element that
      *declares* the attribute, not to the element making the request — see
      htmx's own resolution: `Ee()` looks the value up with the inherited
      getter, then for "this" calls `Se(el, "hx-target")`, which walks up to the
      nearest node that actually carries hx-target. That is the <li>.

      So without an hx-target of its own, this pill's 8-second poll swapped the
      probe response — a bare status <span> — over the WHOLE row via
      outerHTML. The microphone vanished from the admin page about eight seconds
      after every load, leaving a lone "Down" pill and a header still claiming
      "1 mic"; a refresh brought it back because the row is re-rendered
      server-side. Reported from a real station, whose mic was down at the time
      — which is precisely when an operator is on this page.

      The Edit and Remove buttons below both state hx-target="closest li"
      explicitly for the same reason. The pill was the one that did not.
    -->
    <span class="bnb-pill {{status_class}}"
          hx-get="/admin/audio/sources/{{id}}/probe"
          hx-trigger="every 8s"
          hx-target="this"
          hx-swap="outerHTML"
          aria-live="polite">
      <span class="bnb-dot {{status_class}}" aria-hidden="true"></span>
      {{status_label}}
    </span>
    <div class="audio-source__actions">
      <button class="bnb-btn ghost"
              hx-get="/admin/audio/sources/{{id}}/edit"
              hx-target="closest li"
              hx-swap="outerHTML">Edit</button>
      <span class="audio-source__sep" aria-hidden="true"></span>
      <!--
        Restart cycles THIS source only. The station-wide restart on
        /admin/system takes every other microphone down with it and loses the
        audio in flight, which is the wrong remedy for one wedged camera.
        Explicit hx-target for the same reason the Edit and Remove buttons
        carry one: the inherited "this" would resolve to the <li>, and the
        response here is a whole row, so it must.
      -->
      <button class="bnb-btn ghost"
              hx-post="/admin/audio/sources/{{id}}/restart"
              hx-target="closest li"
              hx-swap="outerHTML">Restart</button>
      <span class="audio-source__sep" aria-hidden="true"></span>
      <!--
        Which source the Listen button plays when the listener has not picked
        one. Server-rendered as either a pill (this is the default) or a button
        (make it the default); the POST answers with both source lists as
        out-of-band swaps, so the row that *was* the default loses its pill in
        the same exchange.
      -->
      {{listen_default}}
      <span class="audio-source__sep" aria-hidden="true"></span>
      <!--
        Remove goes through the O-17 confirmation modal — note the dual
        attributes: hx-delete + data-confirm-* keys. Native confirm is the
        fallback when the modal is unavailable.
      -->
      <button class="bnb-btn ghost asr-remove"
              hx-delete="/admin/audio/sources/{{id}}"
              hx-target="closest li"
              hx-swap="outerHTML swap:200ms"
              hx-confirm="Remove this source?"
              data-confirm-action="hx-delete"
              data-confirm-url="/admin/audio/sources/{{id}}"
              data-confirm-title="Remove source"
              data-confirm-body="Removes this source from the station. Existing detections from this source are preserved; no audio files are deleted."
              data-confirm-confirm-label="Remove source"
              data-confirm-style="danger">Remove</button>
    </div>
  </div>
</li>
