<!--
  Toast live region · drop-in for layout.html.
  Inline this block immediately before </body>. The region stays empty until
  a server response delivers an OOB swap targeting #bnb-toasts (see
  pages/toast.rs).

  Reads no template variables. Multiple toasts stack newest-at-the-bottom.
-->
<div id="bnb-toasts" aria-live="polite" aria-atomic="false" role="region" aria-label="Notifications"></div>

<script>
(function () {
  "use strict";
  var region = document.getElementById('bnb-toasts');
  if (!region) return;

  var DEFAULT_TIMEOUT = { success: 4000, warn: 6000, error: 0 /* sticky */, info: 4000 };
  var MAX_TOASTS = 5;

  function scheduleDismiss(toast) {
    if (toast.dataset.sticky === '1') return;
    var kind = toast.dataset.kind || 'info';
    var ms = parseInt(toast.dataset.timeoutMs, 10);
    if (!Number.isFinite(ms) || ms < 0) ms = DEFAULT_TIMEOUT[kind] || 4000;
    if (ms === 0) return;

    var t = null;
    function start() { t = window.setTimeout(dismiss, ms); }
    function stop()  { if (t) { window.clearTimeout(t); t = null; } }
    function dismiss() {
      toast.setAttribute('data-leaving', '1');
      window.setTimeout(function () { toast.remove(); }, 200);
    }

    toast.addEventListener('mouseenter', stop);
    toast.addEventListener('mouseleave', start);
    toast.addEventListener('focusin', stop);
    toast.addEventListener('focusout', start);

    // Pause when the tab is hidden so a toast doesn't time out while the user
    // is away.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stop(); else start();
    });

    start();
  }

  function attach(toast) {
    // Manual-close button.
    var closeBtn = toast.querySelector('[data-toast-close]');
    if (closeBtn) {
      closeBtn.addEventListener('click', function () {
        toast.setAttribute('data-leaving', '1');
        window.setTimeout(function () { toast.remove(); }, 200);
      });
    }
    scheduleDismiss(toast);

    // Cap the stack.
    while (region.children.length > MAX_TOASTS) {
      region.firstElementChild.remove();
    }
  }

  // Initial-page toasts (rare — usually server-attached on the next response).
  region.querySelectorAll('.bnb-toast').forEach(attach);

  // Any subsequent OOB swap into #bnb-toasts.
  document.body.addEventListener('htmx:oobAfterSwap', function (e) {
    if (e.target && e.target.id === 'bnb-toasts') {
      // The OOB swap target is the region itself; new toasts are its tail children.
      region.querySelectorAll('.bnb-toast:not([data-bound="1"])').forEach(function (t) {
        t.dataset.bound = '1';
        attach(t);
      });
    }
  });

  // Allow any inline script to fire a toast without going through the server:
  //   document.dispatchEvent(new CustomEvent('birdnet:toast',
  //     { detail: { kind: 'success', message: 'Copied.' } }));
  document.addEventListener('birdnet:toast', function (e) {
    var d = e.detail || {};
    var kind = d.kind || 'info';
    var t = document.createElement('div');
    t.className = 'bnb-toast bnb-rise';
    t.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    t.dataset.kind = kind;
    if (d.sticky) t.dataset.sticky = '1';
    if (typeof d.timeoutMs === 'number') t.dataset.timeoutMs = String(d.timeoutMs);
    t.innerHTML =
      '<span class="bnb-toast__dot"></span>' +
      '<div class="bnb-toast__body"></div>' +
      '<button type="button" class="bnb-toast__close" data-toast-close aria-label="Dismiss">&times;</button>';
    t.querySelector('.bnb-toast__body').textContent = d.message || '';
    region.appendChild(t);
    t.dataset.bound = '1';
    attach(t);
  });
})();
</script>
