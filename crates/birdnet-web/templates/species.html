<div class="page-head">
    <div>
        <div class="bnb-eyebrow">Browse</div>
        <h1 class="display sp-h1">Every voice</h1>
        {{help_link}}
        <p class="bnb-meta sp-lede">All species detected at this station. Search across common and scientific names.</p>
    </div>
    <input type="search" name="q" placeholder="Search species…"
           hx-get="/pages/species-list" hx-trigger="input changed delay:300ms, search"
           hx-target="#species-list" hx-swap="innerHTML"
           class="sp-search" aria-label="Search species">
</div>

<div class="bnb-card pad">
    <div id="species-list" hx-get="/pages/species-list" hx-trigger="load" hx-swap="innerHTML">
        <p class="bnb-meta">Loading species list…</p>
    </div>
</div>
