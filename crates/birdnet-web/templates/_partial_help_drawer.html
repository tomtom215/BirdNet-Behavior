<!--
  Help drawer · drop-in for layout.html.
  Inline this block immediately before </body>.

  Triggered by any element with [data-help-drawer="<url>"]. The drawer is a
  right-side <dialog>; the docs page is fetched via fetch() and inserted as
  innerHTML. We use fetch (not htmx) because the docs are static-served
  HTML files from /help/, not htmx partials, and we want to strip the mdBook
  chrome (its own nav / search box) before display.
-->
<dialog id="bnb-help-drawer" class="bnb-help-drawer" aria-labelledby="bnb-help-drawer-title">
  <header class="bnb-help-drawer__head">
    <div class="bnb-eyebrow">Help</div>
    <h2 id="bnb-help-drawer-title" class="display hd-h2">
      Loading…
    </h2>
    <a class="bnb-help-link" id="bnb-help-drawer-openfull" href="#" target="_blank" rel="noopener">
      Open full page
      <span aria-hidden="true">↗</span>
    </a>
    <form method="dialog" class="hd-form">
      <button type="submit" class="bnb-btn ghost" aria-label="Close">×</button>
    </form>
  </header>
  <div id="bnb-help-drawer-body" class="bnb-help-drawer__body" tabindex="-1">
    <p class="bnb-meta">Fetching docs…</p>
  </div>
</dialog>

<script>
(function () {
  "use strict";
  var dlg = document.getElementById('bnb-help-drawer');
  if (!dlg || typeof dlg.showModal !== 'function') return;
  var body  = document.getElementById('bnb-help-drawer-body');
  var title = document.getElementById('bnb-help-drawer-title');
  var openFull = document.getElementById('bnb-help-drawer-openfull');

  function stripChrome(html, pageUrl) {
    // mdBook output wraps content in <main>…</main>; pull only that out so the
    // drawer doesn't import the docs site's own nav, theme picker, or search.
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var main = doc.querySelector('main, #content, .page') || doc.body;
    // The docs' links and images are relative to the docs page. Inside this
    // page they would resolve against it (`/admin/...`) and lead nowhere, so
    // they are made absolute against the page they came from. A bare
    // `#fragment` stays as it is: it names a heading in the drawer.
    main.querySelectorAll('[href], [src]').forEach(function (el) {
      ['href', 'src'].forEach(function (attr) {
        var v = el.getAttribute(attr);
        if (!v || v.charAt(0) === '#') return;
        try { el.setAttribute(attr, new URL(v, pageUrl).href); } catch (e) { /* leave it */ }
      });
    });
    // First <h1> becomes the drawer title.
    var h1 = main.querySelector('h1');
    if (h1) {
      title.textContent = h1.textContent.trim();
      h1.remove();
    } else {
      title.textContent = 'Help';
    }
    return main.innerHTML;
  }

  // The docs unavailable: say so, and offer the page itself. Built with the
  // DOM API: `url` is read back from a `data-help-drawer` attribute, and a
  // quote in it must not be able to write markup into the drawer.
  function unavailable(href) {
    title.textContent = 'Couldn\u2019t load help';
    var note = document.createElement('p');
    note.className = 'bnb-meta';
    if (href) {
      note.append('The docs are unavailable on this device. ');
      var again = document.createElement('a');
      again.setAttribute('href', href);
      again.setAttribute('target', '_blank');
      again.setAttribute('rel', 'noopener');
      again.textContent = 'Open in a new tab';
      note.append(again, ' instead.');
    } else {
      note.append('That is not one of this station’s help pages, so it was not opened.');
    }
    body.replaceChildren(note);
  }

  async function load(raw) {
    title.textContent = 'Loading…';
    body.innerHTML = '<p class="bnb-meta">Fetching docs…</p>';
    // Only a page of this station is fetched or linked to; anything else is
    // treated as docs that cannot be loaded, without a request.
    var url = window.bnbSameOrigin(raw);
    // A value that is not one of this station's pages leaves the link on the
    // manual's front page rather than on '#', which goes nowhere.
    openFull.setAttribute('href', url || window.bnbUrl('/help/index.html'));
    if (!url) { unavailable(null); return; }
    try {
      var res = await fetch(url, { credentials: 'same-origin' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var html = await res.text();
      body.innerHTML = stripChrome(html, res.url || new URL(url, window.location.href).href);
      body.focus();
      // Honour deep-link fragment if any. By id, not `querySelector('#…')`:
      // mdBook ids can start with a digit (`3-sensitivity`), which is not a
      // valid selector, and the throw landed in the catch below and replaced
      // the page that had just loaded with "Couldn't load help".
      var hash = (new URL(url, window.location.origin)).hash;
      if (hash) {
        var id = decodeURIComponent(hash.slice(1));
        var t = Array.prototype.find.call(body.querySelectorAll('[id]'), function (el) {
          return el.id === id;
        });
        if (t) t.scrollIntoView({ block: 'start' });
      }
    } catch (e) {
      unavailable(url);
    }
  }

  document.addEventListener('click', function (e) {
    var trigger = e.target.closest('[data-help-drawer]');
    if (!trigger) return;
    e.preventDefault();
    var url = trigger.getAttribute('data-help-drawer');
    dlg.showModal();
    load(url);
  });
})();
</script>
