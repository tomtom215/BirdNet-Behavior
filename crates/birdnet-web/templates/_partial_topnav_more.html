<!--
  Topnav overflow ("More") menu · drop-in for layout.html, inside `.topnav-right`.

  The grouped rows are generated from the single nav manifest
  (routes::pages::nav) and inlined into the server-filled slot below, with
  active-state derived from each page's active key. The desktop dropdown, the
  mobile bottom sheet, the top-nav, and the breadcrumb all render from that same
  manifest, so the surfaces cannot drift apart.
-->
<div class="bnb-more">
  <button type="button"
          class="bnb-more__btn"
          aria-haspopup="dialog"
          aria-controls="bnb-more-menu"
          data-open-more
          title="More sections">
    <span class="bnb-more__glyph" aria-hidden="true">⌗</span>
    <span class="bnb-more__label">More</span>
    <span class="bnb-more__arrow" aria-hidden="true">▾</span>
  </button>
</div>

<dialog id="bnb-more-menu" class="bnb-more-menu" aria-labelledby="bnb-more-title">
  <form method="dialog" class="bnb-more-menu__form">
    <header class="bnb-more-menu__head">
      <h2 id="bnb-more-title" class="display tm-h2">
        Sections
      </h2>
      <button type="submit" class="bnb-btn ghost" aria-label="Close">×</button>
    </header>

    <div class="bnb-more-menu__body" role="navigation" aria-label="Secondary sections">

      <!-- Groups + rows are generated from the single nav manifest
           (routes::pages::nav) so this dropdown, the mobile sheet, the top-nav,
           and the command palette can never drift apart. -->
      {{more_groups}}

      <section class="bnb-more-group">
        <h3 class="bnb-eyebrow">Find</h3>
        <ul>
          <li><button type="button"
                      class="bnb-more-row"
                      data-trigger-cmdk
                      aria-label="Open the command palette">
            <span class="glyph">⌘</span>
            <span class="label">Quick navigator</span>
            <span class="sub mono">⌘K · / · search anything</span>
          </button></li>
        </ul>
      </section>

    </div>
  </form>
</dialog>

<script>
(function () {
  "use strict";
  // Scope to THIS opener (the topnav one) by its aria-controls. The mobile
  // tabbar ships a second [data-open-more] button; a bare
  // querySelector('[data-open-more]') would match whichever comes first in the
  // DOM, cross-wiring the two openers so one button opened both dialogs (they
  // rendered stacked/overlapping) while the other opened none.
  var btn = document.querySelector('[data-open-more][aria-controls="bnb-more-menu"]');
  var dlg = document.getElementById('bnb-more-menu');
  if (!btn || !dlg) return;

  // Position the menu under the trigger on desktop. On narrow viewports
  // CSS turns it into a bottom sheet and ignores these inline styles.
  function position() {
    var r = btn.getBoundingClientRect();
    dlg.style.setProperty('--bnb-more-x', (r.right) + 'px');
    dlg.style.setProperty('--bnb-more-y', (r.bottom + 6) + 'px');
  }

  if (typeof dlg.showModal === 'function') {
    btn.addEventListener('click', function () {
      position();
      dlg.showModal();
    });
    // Outside click → close.
    dlg.addEventListener('click', function (e) {
      // Native <dialog> reports clicks on the backdrop as clicks on the
      // dialog element itself (e.target === dlg). Anywhere inside the form
      // is treated as inside.
      if (e.target === dlg) dlg.close();
    });
    window.addEventListener('resize', function () { if (dlg.open) position(); });
  } else {
    // Fallback: focus the first item; navigates with keyboard via tab order.
    btn.addEventListener('click', function () {
      dlg.setAttribute('open', '');
      position();
    });
  }

  // ⌘K relay for the "Quick navigator" row.
  var cmdkTrigger = dlg.querySelector('[data-trigger-cmdk]');
  if (cmdkTrigger) cmdkTrigger.addEventListener('click', function () {
    dlg.close();
    // Cmd-K is wired by the O-19 partial; defer so the dialog finishes closing.
    window.setTimeout(function () {
      var ev = new KeyboardEvent('keydown', { key: 'k', metaKey: true });
      document.dispatchEvent(ev);
    }, 0);
  });
})();
</script>
