<!DOCTYPE html>
<html lang="en">
<head>
    <!-- FOUC guard: resolve theme before first paint. -->
    <script>(function(){var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);var d=localStorage.getItem('bnb-density');if(d==='compact'||d==='comfy'||d==='regular')document.documentElement.style.setProperty('--density',d==='compact'?'0.78':d==='comfy'?'1.15':'1');var m=localStorage.getItem('bnb-motion');if(m==='reduced')document.documentElement.setAttribute('data-motion','reduced');var c=localStorage.getItem('bnb-contrast');if(c==='high')document.documentElement.setAttribute('data-contrast','high');})();</script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} · BirdNet-Behavior</title>
    <meta name="color-scheme" content="light dark">
    <!-- `?v={{version}}` is load-bearing. Both stylesheets are served with
         `Cache-Control: public, max-age=31536000, immutable`, and `immutable`
         tells the browser not to revalidate even on an explicit reload. At a
         bare URL that meant an updated station kept serving new HTML against
         last year's stylesheet in every browser that had visited before, for up
         to a year, with no way for the operator to clear it. The version query
         makes each release a different URL, which is what `immutable` assumes.
         Keep this in step with the identical query on the service-worker
         registration and on sw.js's PRECACHE list. -->
    <link rel="stylesheet" href="/static/css/app.css?v={{version}}">
    <link rel="stylesheet" href="/static/css/print.css?v={{version}}" media="print">
    <link rel="alternate" type="application/rss+xml" title="BirdNet · rare detections" href="/feeds/rare.rss">
    <!-- PWA (O-24): manifest, theme-color, apple-touch-icon. -->
    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#FCFAF6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1F1A14" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BirdNet">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <!-- The browser-tab icon. The PWA block above covers the iOS home screen
         (apple-touch-icon) and the installed-app icon (manifest), but neither
         is used for the tab: without an explicit rel="icon" the browser falls
         back to requesting /favicon.ico, which this server does not route, so
         every tab rendered blank. Reuses the existing PNGs rather than adding
         an .ico — every browser this dashboard supports accepts PNG here. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
    <meta name="bnb-build" content="{{version}}">
    <!--
      All webfonts are self-hosted and embedded in the binary (see app.css
      @font-face) — no CDN dependency, so the dashboard renders fully offline on
      a Pi without leaking requests to a third party. Latin UI text uses
      Inter Tight; the Latin-script BirdNET label packs fall back to the
      self-hosted Noto Sans; non-Latin species names (CJK, Devanagari, …) use
      the client's installed system fonts named in the --font-ui stack.
    -->
    <script src="/static/htmx.min.js?v={{version}}"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <!-- No `role="navigation"` here. A <header> that is a direct child of
         <body> is already the page's `banner` landmark; re-roling it as
         navigation removed the banner entirely AND announced the search form,
         live pill, health badge, help and theme buttons as if they were part of
         the site navigation. The inner <nav class="topnav-links"> below is the
         real navigation landmark. (templates/login.html already did this
         correctly with role="banner"; the two shells disagreed.) -->
    <header class="topnav">
        <a href="/" class="topnav-brand" aria-label="BirdNet-Behavior home">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="0.8" class="lay-logo"></circle>
                <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" class="lay-logo">
                    <line x1="6" y1="12" x2="6" y2="12"></line>
                    <line x1="9" y1="9.5" x2="9" y2="14.5"></line>
                    <line x1="12" y1="6" x2="12" y2="18"></line>
                    <line x1="15" y1="8" x2="15" y2="16"></line>
                    <line x1="18" y1="10.5" x2="18" y2="13.5"></line>
                </g>
            </svg>
            <span class="name">BirdNet</span><span class="sub">Behavior</span>
        </a>
        <span class="bnb-vrule lay-vrule"></span>
        <nav class="topnav-links" aria-label="Sections">{{topnav_links}}</nav>
        <div class="topnav-right">
            <form action="/species" method="get" class="nav-search" role="search" aria-label="Site-wide species search">
                <input type="search" name="q" placeholder="Search species…" aria-label="Search species">
            </form>
            <span id="live-status" class="bnb-pill lay-iflex-gap" data-state="connecting" hidden
                  title="Live detection stream" aria-live="polite">
                <span class="bnb-dot"></span><span data-live-label>Feed live</span>
            </span>
            <div class="status lay-iflex" hx-get="/pages/health-badge" hx-trigger="load, every 30s" hx-swap="innerHTML">
                <span class="bnb-pill"><span class="bnb-dot"></span> …</span>
            </div>
            {{sign_out_link}}
            <button class="icon-btn" type="button" title="Help &amp; methodology" aria-label="Help" data-help-drawer="/help/index.html">?</button>
            <button class="icon-btn" id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
                <span id="theme-icon" aria-hidden="true"></span>
            </button>
        </div>
    </header>
    <main id="main-content" role="main" data-home="{{active_nav}}">
        {{update_banner}}
        {{content}}
    </main>
    {{footer}}
    <script>
    (function() {
        var DARK_ICON = '☽';   // ☽
        var LIGHT_ICON = '☀';  // ☀
        var html = document.documentElement;
        var btn = document.getElementById('theme-toggle');
        var icon = document.getElementById('theme-icon');
        function current() { return html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
        function apply(theme) {
            html.setAttribute('data-theme', theme);
            if (icon) icon.textContent = theme === 'dark' ? LIGHT_ICON : DARK_ICON;
        }
        apply(current());
        if (btn) btn.addEventListener('click', function() {
            var next = current() === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            apply(next);
        });
    })();
    </script>
    <!-- Global delegated UI behaviors (CSP-safe; no inline on* handlers):
         hide opt-in broken images, and copy-to-clipboard buttons. -->
    <script>
    (function () {
        // Hide images that opt in (data-hide-on-error) when they fail to load.
        document.addEventListener('error', function (e) {
            var t = e.target;
            if (t && t.tagName === 'IMG' && t.hasAttribute('data-hide-on-error')) {
                t.style.display = 'none';
            }
        }, true);
        // Copy-to-clipboard: data-copy-url (origin + path) or data-copy-from
        // (#id textContent). Optional data-copied-label for the confirmation.
        document.addEventListener('click', function (e) {
            var b = e.target.closest('[data-copy-url],[data-copy-from]');
            if (!b) return;
            e.preventDefault();
            var txt = b.hasAttribute('data-copy-url')
                ? location.origin + b.getAttribute('data-copy-url')
                : ((document.getElementById(b.getAttribute('data-copy-from')) || {}).textContent || '');
            var label = b.getAttribute('data-copied-label') || 'Copied!';
            var orig = b.textContent;
            var done = function () { b.textContent = label; setTimeout(function () { b.textContent = orig; }, 1500); };
            if (navigator.clipboard) {
                navigator.clipboard.writeText(txt).then(done, function () { window.prompt('Copy this:', txt); });
            } else {
                window.prompt('Copy this:', txt);
            }
        });
    })();
    </script>
    <!-- The data-style CSSOM applier is injected once into every full document
         by the security middleware (security.rs), so it can't be forgotten on a
         new page; it is not threaded through this template. -->
    <!-- Live detection stream: keeps a reconnecting WebSocket to surface a
         live/offline indicator and dispatch birdnet:detection events. -->
    <script src="/static/live-detections.js?v={{version}}" defer></script>
    <script src="/static/clip-player.js?v={{version}}" defer></script>
    <!-- A region that fails to load must say so. htmx leaves the target as it
         was on a 4xx/5xx and on a transport error, so a failed partial — or a
         station that died under an open dashboard — used to leave its
         skeleton or "Loading…" in place indefinitely (UX-4). GET loads only:
         a form that failed to POST keeps itself so the operator can retry.
         Focus: an outerHTML swap of the element that had focus (a "Show more"
         button) dropped keyboard users onto <body> (UX-3); the first
         focusable thing in the new content takes it instead. -->
    <script>
    (function () {
      function isGet(evt) {
        var cfg = evt.detail && evt.detail.requestConfig;
        return !!cfg && cfg.verb === 'get';
      }
      // A slot that cannot legally hold a <div> and an <a>. `#td-total` is a
      // <span> holding a number inside the "Show the full day (34)" button,
      // and this function used to put a <div role="alert"> and a link inside
      // it — a <div> where only phrasing content is allowed, and an anchor
      // nested in a button, which no keyboard or screen-reader user can
      // resolve. Driven to a failure in a browser it rendered as
      // "Show the full day (This section could not load (HTTP 500). Reload
      // the page) — search, filter, lock & delete".
      var PHRASING_ONLY = 'span,p,h1,h2,h3,h4,h5,h6,label,summary,strong,em,small,b,i';
      function textOnly(el) {
        return !!el.closest('a,button') || el.matches(PHRASING_ONLY);
      }
      function failed(evt, why) {
        if (!isGet(evt)) return;
        var target = evt.detail.target || evt.target;
        if (!target || !target.isConnected) return;
        if (textOnly(target)) {
          // No element, no link: the reader still gets the page's own reload,
          // and the sentence around the slot stays a sentence.
          target.textContent = '?';
          target.setAttribute('title', 'This could not load' + why + '.');
          return;
        }
        var note = document.createElement('div');
        note.className = 'bnb-load-error';
        note.setAttribute('role', 'alert');
        note.textContent = 'This section could not load' + why + '. ';
        var a = document.createElement('a');
        a.href = location.href;
        a.textContent = 'Reload the page';
        note.appendChild(a);
        target.replaceChildren(note);
      }
      document.body.addEventListener('htmx:responseError', function (evt) {
        var xhr = evt.detail && evt.detail.xhr;
        failed(evt, xhr && xhr.status ? ' (HTTP ' + xhr.status + ')' : '');
      });
      document.body.addEventListener('htmx:sendError', function (evt) {
        failed(evt, ' — the station did not answer');
      });
      document.body.addEventListener('htmx:timeout', function (evt) {
        failed(evt, ' — the station took too long to answer');
      });

      var FOCUSABLE = 'button, a[href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
      var focused = null, parent = null, className = '';
      document.body.addEventListener('htmx:beforeSwap', function () {
        focused = document.activeElement;
        parent = focused ? focused.parentElement : null;
        className = focused && focused.classList.length ? '.' + focused.classList[focused.classList.length - 1] : '';
      });
      document.body.addEventListener('htmx:afterSettle', function () {
        if (!focused || focused === document.body || focused.isConnected || !parent || !parent.isConnected) return;
        // Prefer the element that took the old one's place (a fresh "Show
        // more" button), else the last focusable thing now in its container.
        var next = className ? parent.querySelector(className + ':is(' + FOCUSABLE + ')') : null;
        if (!next) { var all = parent.querySelectorAll(FOCUSABLE); next = all.length ? all[all.length - 1] : null; }
        if (next) next.focus();
        focused = null; parent = null; className = '';
      });
    })();
    </script>
    <!-- Announce only what changed in a polling feed.
         A feed that re-fetches every 10-15s and swaps its whole innerHTML is a
         mutation in a live region on every tick, so `aria-live` on the
         container made a screen reader read every row out again on a loop,
         whether or not a bird had been heard. The containers are plain now;
         this writes a one-line summary into their status element, and only
         when the newest row's label is different from the last one announced.
         Opt-in by `data-feed-status`, so a feed without one is silent rather
         than accidentally noisy. -->
    <script>
    (function () {
      var PAIRS = [
        ['detections-table', 'td-feed-status'],
        ['rc-trickle-feed', 'rc-feed-status'],
      ];
      var last = {};
      function label(feed) {
        var row = feed.querySelector('.feed-row, .rc-row, [data-species]');
        if (!row) return '';
        var name = row.querySelector('.name a, .name, .nm, .who .name');
        var time = row.querySelector('.ago, .rc-time, time');
        return ((name && name.textContent) || '').trim() +
               (time && time.textContent ? ' at ' + time.textContent.trim() : '');
      }
      function sync() {
        PAIRS.forEach(function (pair) {
          var feed = document.getElementById(pair[0]);
          var out = document.getElementById(pair[1]);
          if (!feed || !out) return;
          var now = label(feed);
          if (!now || now === last[pair[0]]) return;
          // The first sync after load states the newest row without claiming
          // it just arrived; later ones are genuinely new.
          out.textContent = (last[pair[0]] === undefined ? 'Most recent detection: ' : 'New detection: ') + now;
          last[pair[0]] = now;
        });
      }
      document.body.addEventListener('htmx:afterSettle', sync);
      document.addEventListener('DOMContentLoaded', sync);
    })();
    </script>
    <!-- Keyboard access to horizontally scrollable regions.
         `@media (max-width: 980px) { table { display: block; overflow-x: auto } }`
         turns every wide table into a scroll container on a phone, and a
         container that scrolls but cannot be focused is unreachable without a
         mouse (axe `scrollable-region-focusable`, serious). Doing it here
         rather than in markup covers the tables that already exist, the ones
         HTMX swaps in later, and any added afterwards.

         Only regions with **no focusable descendant** get a tab stop: a table
         full of links is already reachable, and adding one there would be an
         extra stop that does nothing. That is the same condition the axe rule
         applies, so the two cannot disagree. -->
    <script>
    (function () {
      var FOCUSABLE = 'a[href], button, input, select, textarea, [tabindex]:not([tabindex="-1"])';
      function mark(root) {
        // Any element in the content area, not a fixed class list: the Year in
        // Review page scrolls a plain `.bnb-card.pad`, which a list of
        // `table, [class*=scroll]` missed. The cheap geometry test runs first
        // so `getComputedStyle` is only paid for the handful that overflow.
        var scope = (root || document).querySelector('main') || (root || document);
        var nodes = scope.querySelectorAll('*');
        Array.prototype.forEach.call(nodes, function (el) {
          if (el.hasAttribute('tabindex')) return;
          if (el.scrollWidth <= el.clientWidth + 1) return;
          var ox = window.getComputedStyle(el).overflowX;
          if (ox !== 'auto' && ox !== 'scroll') return;
          if (el.querySelector(FOCUSABLE)) return;
          el.setAttribute('tabindex', '0');
          if (!el.getAttribute('role')) el.setAttribute('role', 'group');
          if (!el.getAttribute('aria-label') && !el.getAttribute('aria-labelledby')) {
            var cap = el.querySelector('caption');
            el.setAttribute('aria-label', (cap && cap.textContent.trim()) || 'Scrolls sideways');
          }
        });
      }
      function schedule() { window.requestAnimationFrame(function () { mark(document); }); }
      document.addEventListener('DOMContentLoaded', schedule);
      document.body.addEventListener('htmx:afterSettle', schedule);
      window.addEventListener('resize', schedule);
      schedule();
    })();
    </script>
    {{toast_region}}
    {{confirm_modal}}
    {{cmdk_partial}}
    {{help_drawer}}
    {{tabbar}}
    <!-- PWA service worker (O-24). Registration is best-effort; browsers
         without SW support log nothing. The bnb-build meta lets the
         worker invalidate its cache on a new release. -->
    <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var build = document.querySelector('meta[name="bnb-build"]');
      var v = build ? '?v=' + encodeURIComponent(build.content) : '';
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/static/sw.js' + v).catch(function () {});
      });
    })();
    </script>
</body>
</html>
