<!--
  Login page · GET /login (and POST /login → /admin or /login?error=1).
  Stand-alone HTML (no layout.html include — the login page is rendered before
  any authenticated request so the layout's "Sign out" link must not appear).

  Server fills:
    {{title}}        — "Sign in"
    {{station}}      — station handle in the top-right (e.g. "station/01")
    {{error_class}}  — "" or "is-visible"
    {{error_body}}   — "Incorrect username or password." (or rate-limit message)
    {{next_path}}    — query-string-safe `next=` value, or empty
    {{rate_limited}} — "" or " disabled" (applied to the submit button)
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- FOUC theme guard, identical to layout.html. -->
  <script>(function(){var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);var d=localStorage.getItem('bnb-density');if(d==='compact'||d==='comfy'||d==='regular')document.documentElement.style.setProperty('--density',d==='compact'?'0.78':d==='comfy'?'1.15':'1');var m=localStorage.getItem('bnb-motion');if(m==='reduced')document.documentElement.setAttribute('data-motion','reduced');var c=localStorage.getItem('bnb-contrast');if(c==='high')document.documentElement.setAttribute('data-contrast','high');})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · BirdNet-Behavior</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page" data-screen-label="Sign in">
<a href="#main-content" class="skip-link">Skip to content</a>

<!-- The login page borrows the topnav for visual consistency but drops the
     section links — they all live behind /admin which we're trying to enter. -->
<header class="topnav" role="banner">
  <a href="/" class="topnav-brand" aria-label="BirdNet-Behavior home">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="0.8" style="color:var(--fg)"></circle>
      <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" style="color:var(--fg)">
        <line x1="6" y1="12" x2="6" y2="12"/><line x1="9" y1="9.5" x2="9" y2="14.5"/>
        <line x1="12" y1="6" x2="12" y2="18"/><line x1="15" y1="8" x2="15" y2="16"/>
        <line x1="18" y1="10.5" x2="18" y2="13.5"/>
      </g>
    </svg>
    <span class="name">BirdNet</span><span class="sub">Behavior</span>
  </a>
  <span class="bnb-vrule" style="height:16px;align-self:center"></span>
  <span class="bnb-meta mono">{{station}}</span>
</header>

<main id="main-content" role="main" class="bnb-grid" style="display:grid;place-items:center;min-height:calc(100dvh - 56px - 64px);padding:36px 18px;">
  <section class="bnb-card pad login-card" aria-labelledby="signin-heading">

    <!-- Brand row + headline -->
    <div class="login-card__head">
      <div class="login-card__brand">
        <svg class="login-mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="0.8"></circle>
          <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <line x1="6" y1="12" x2="6" y2="12"/><line x1="9" y1="9.5" x2="9" y2="14.5"/>
            <line x1="12" y1="6" x2="12" y2="18"/><line x1="15" y1="8" x2="15" y2="16"/>
            <line x1="18" y1="10.5" x2="18" y2="13.5"/>
          </g>
        </svg>
        <span style="font-size:15px;"><b>BirdNet</b><span style="color:var(--fg-3);"> Behavior</span></span>
      </div>

      <p class="bnb-eyebrow">BirdNet Behavior</p>
      <h1 id="signin-heading" class="display"
          style="font-size:38px;line-height:1.05;letter-spacing:-0.012em;margin:0;">
        Sign in
      </h1>
      <p class="bnb-meta" style="margin-top:6px;">Administer this station.</p>
    </div>

    <!-- Error alert (server toggles is-visible via {{error_class}}) -->
    <div class="login-alert {{error_class}}" role="alert" aria-live="polite">
      <span class="login-alert__dot" aria-hidden="true"></span>
      <div class="login-alert__body">{{error_body}}</div>
    </div>

    <form method="post" action="/login" autocomplete="on" novalidate class="login-form">
      <input type="hidden" name="next" value="{{next_path}}">

      <div class="login-field">
        <label class="bnb-eyebrow" for="username">Username</label>
        <input id="username"
               name="username"
               type="text"
               inputmode="text"
               autocomplete="username"
               autocapitalize="off"
               autocorrect="off"
               spellcheck="false"
               required
               placeholder="admin">
      </div>

      <div class="login-field">
        <label class="bnb-eyebrow" for="password">Password</label>
        <div class="login-field__withtoggle">
          <input id="password"
                 name="password"
                 type="password"
                 autocomplete="current-password"
                 required>
          <button type="button"
                  class="login-toggle"
                  id="toggle-password"
                  aria-controls="password"
                  aria-pressed="false"
                  aria-label="Show password">Show</button>
        </div>
      </div>

      <label class="login-remember" for="remember">
        <input id="remember" name="remember" type="checkbox" value="1">
        <span>Remember me on this device</span>
      </label>

      <button class="bnb-btn moss login-submit"
              type="submit"
              {{rate_limited}}>Sign in</button>
    </form>

    <div class="login-card__foot">
      <a href="/" class="bnb-help-link" aria-label="Back to dashboard">
        <span class="bnb-help-link__arrow" aria-hidden="true">←</span>
        Back to dashboard
      </a>
      <span class="bnb-meta mono">v{{version}}</span>
    </div>
  </section>
</main>

<footer role="contentinfo" style="text-align:center;padding:14px 20px;color:var(--fg-4);font-family:var(--font-mono);font-size:11px;border-top:0.5px solid var(--hairline);">
  self-hosted · <a href="https://github.com/tomtom215/BirdNet-Behavior" style="color:var(--fg-3);">about</a>
</footer>

<script>
(function () {
  "use strict";
  var btn = document.getElementById('toggle-password');
  var input = document.getElementById('password');
  if (!btn || !input) return;
  btn.addEventListener('click', function () {
    var shown = input.type === 'text';
    input.type = shown ? 'password' : 'text';
    btn.textContent = shown ? 'Show' : 'Hide';
    btn.setAttribute('aria-pressed', String(!shown));
    btn.setAttribute('aria-label', shown ? 'Show password' : 'Hide password');
    input.focus({ preventScroll: true });
    var len = input.value.length;
    try { input.setSelectionRange(len, len); } catch (e) {}
  });
})();
</script>
</body>
</html>
