<!--
  Post-upgrade banner mount · drop-in for layout.html.
  Place immediately after `<main id="main-content">`.

  The banner stays hidden until JS confirms the user hasn't seen the current
  version yet. Dismissal records the version into localStorage. Single source
  of truth for the version is the layout's {{version}} substitution, which
  this partial reads via data-current-version.
-->
<div
  id="bnb-update-banner-mount"
  data-current-version="{{version}}"
  aria-live="polite"
  aria-atomic="true"
  style="display:contents;">
</div>

<script>
(function () {
  "use strict";
  var mount = document.getElementById('bnb-update-banner-mount');
  if (!mount) return;

  var current = mount.dataset.currentVersion || '';
  if (!current) return;

  function parseSemver(v) {
    if (!v) return null;
    var m = String(v).match(/^v?(\d+)\.(\d+)\.(\d+)(?:[.-].*)?$/);
    if (!m) return null;
    return [parseInt(m[1], 10), parseInt(m[2], 10), parseInt(m[3], 10)];
  }
  function cmp(a, b) {
    if (!a || !b) return 0;
    for (var i = 0; i < 3; i++) {
      if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
    }
    return 0;
  }

  var seen = null;
  try { seen = localStorage.getItem('bnb-last-seen-version'); } catch (e) {}

  // No stored value means first launch — don't celebrate it as an upgrade.
  if (!seen) {
    try { localStorage.setItem('bnb-last-seen-version', current); } catch (e) {}
    return;
  }

  var cur = parseSemver(current);
  var stored = parseSemver(seen);
  if (!cur || !stored || cmp(stored, cur) >= 0) return;

  // Fetch the latest release block and mount it.
  fetch('/system/changelog/latest', { credentials: 'same-origin' })
    .then(function (res) { return res.ok ? res.text() : ''; })
    .then(function (html) {
      if (!html) return;
      var wrap = document.createElement('div');
      wrap.innerHTML = html.trim();
      var banner = wrap.firstElementChild;
      if (!banner) return;
      mount.parentNode.insertBefore(banner, mount);

      var dismiss = banner.querySelector('[data-banner-dismiss]');
      if (dismiss) dismiss.addEventListener('click', function () {
        try { localStorage.setItem('bnb-last-seen-version', current); } catch (e) {}
        banner.setAttribute('data-leaving', '1');
        window.setTimeout(function () { banner.remove(); }, 200);
      });
    })
    .catch(function () { /* offline / missing endpoint — silently skip */ });
})();
</script>
