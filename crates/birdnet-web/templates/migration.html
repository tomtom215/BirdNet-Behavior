<!--
  Migration (phenology) · NEW page at /migration
  Ridgeline of weekly per-species abundance over the calendar year, species heard
  per week under it, peak diversity, and "still expected" / "missing" cards.

  Drop-in: register at /migration (see DIFF.md). Renames the existing
  /admin/migration → /admin/import to free the URL.
-->
{{page_head}}

<!-- KPI tiles -->
<div class="stat-row"
     hx-get="/pages/migration-stats"
     hx-trigger="load, every 60m"
     hx-swap="innerHTML"
     aria-live="polite"
     aria-label="Migration statistics">
  {{skel_migration_stats}}
</div>

<!-- Ridgeline and the species-per-week lane under it — Rust renders the SVG inline -->
<div class="bnb-card pad fig">
  <div class="section-header">
    <div>
      <div class="bnb-eyebrow"><span class="fig-no" aria-hidden="true"></span>Ridgeline · per-species weekly index</div>
      <h2 class="sh-h">Twelve months of migrants</h2>
    </div>
  </div>

  <div id="migration-ridgeline"
       hx-get="/pages/migration-ridgeline"
       hx-trigger="load"
       hx-swap="innerHTML"
       class="mig-ridge">
    {{skel_ridgeline}}
  </div>
</div>

<!-- Editorial cards: just arrived / currently peaking / missing -->
<div class="grid-2 mig-cards">
  <div class="bnb-card pad"
       hx-get="/pages/migration-card?kind=arrived"
       hx-trigger="load, every 30m"
       hx-swap="innerHTML">
    <div class="bnb-eyebrow mig-card-eb arrived">Just arrived</div>
    <div class="display mig-card-val">Loading…</div>
  </div>
  <div class="bnb-card pad"
       hx-get="/pages/migration-card?kind=peaking"
       hx-trigger="load, every 30m"
       hx-swap="innerHTML">
    <div class="bnb-eyebrow mig-card-eb peaking">Currently peaking</div>
    <div class="display mig-card-val">Loading…</div>
  </div>
  <div class="bnb-card pad"
       hx-get="/pages/migration-card?kind=missing"
       hx-trigger="load, every 30m"
       hx-swap="innerHTML">
    <div class="bnb-eyebrow mig-card-eb missing">Missing</div>
    <div class="display mig-card-val">Loading…</div>
  </div>
</div>
