<!--
  Today · rebuilt with comparative phrasing + section structure.
  Replaces crates/birdnet-web/templates/today.html.

  Existing partials reused unchanged:
    /pages/today-count   /pages/today-daystrip   /pages/today-list

  Optional new partial (graceful fallback if missing):
    /pages/today-phrase  — comparative phrase + percentile vs 30-day baseline
-->
<div class="page-head" style="align-items:flex-start;" data-screen-label="Today" data-om-validate>
  <div>
    <div class="bnb-eyebrow" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span>Detection log · <span id="today-date" class="mono"></span></span>
      {{help_link}}
    </div>

    <!--
      Comparative headline. /pages/today-phrase returns a tiny snippet like:

        <span class="display" style="font-size:48px;line-height:1.05;">
          A <em style="color:var(--moss-ink)">loud</em> morning.
        </span>
        <p class="bnb-meta" style="margin-top:6px;">
          3,142 detections · 41 species · 92nd percentile vs your last 30 days.
        </p>

      Until the partial exists, the static fallback below stays visible.
    -->
    <div id="today-phrase"
         hx-get="/pages/today-phrase"
         hx-trigger="load, every 5m"
         hx-swap="innerHTML"
         style="margin-top:8px;"
         aria-live="polite"
         aria-label="Day summary">
      <h1 class="display" style="font-size:48px;line-height:1.05;letter-spacing:-0.02em;">
        You're listening.
      </h1>
      <p class="bnb-meta" style="margin-top:6px;">Detections roll in below.</p>
    </div>
  </div>

  <div id="today-count" class="bnb-pill moss"
       hx-get="/pages/today-count" hx-trigger="load, every 15s" hx-swap="innerHTML"
       aria-live="polite" aria-label="Recording status">
    …
  </div>
</div>

<!-- Day strip — hour-by-hour activity bars, jumps the list to that hour on click -->
<div class="bnb-card pad">
  <div class="section-header">
    <div>
      <div class="bnb-eyebrow">The day so far</div>
      <h3>When you heard them</h3>
    </div>
    <span class="bnb-meta">Tap an hour to jump the list</span>
  </div>
  <div id="today-daystrip" hx-get="/pages/today-daystrip" hx-trigger="load, every 30s" hx-swap="innerHTML">
    {{skel_daystrip}}
  </div>
</div>

<!-- Section chunker — purely client-side; data partial groups rows by hour-band -->
<div class="bnb-card pad" style="position:sticky;top:54px;z-index:5;">
  <form id="search-form" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
    <input type="search" name="search" id="today-search"
           placeholder="Search species…  (prefix NOT to exclude)"
           style="flex:1;min-width:240px;"
           hx-get="/pages/today-list"
           hx-trigger="input changed delay:300ms, search"
           hx-target="#today-results"
           hx-swap="innerHTML"
           hx-include="[name='search']">

    <div class="seg" role="tablist" aria-label="Filter">
      <button type="button" class="btn active" data-filter="all">All</button>
      <button type="button" class="btn" data-filter="rare">Rare</button>
      <button type="button" class="btn" data-filter="first">First today</button>
      <button type="button" class="btn" data-filter="high">High conf</button>
    </div>

    <span class="htmx-indicator bnb-meta">Searching…</span>
  </form>
</div>

<div id="today-results"
     hx-get="/pages/today-list"
     hx-trigger="load, every 15s"
     hx-swap="innerHTML"
     hx-include="#today-search, .seg .btn.active">
  {{skel_today_results}}
</div>

<script>
(function () {
  // Date stamp.
  var d = new Date();
  var ds = d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
  var el = document.getElementById('today-date');
  if (el) el.textContent = ds;

  // Segmented filter — flips .active and re-triggers the list partial.
  var seg = document.querySelector('#search-form .seg');
  if (seg) {
    seg.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      e.preventDefault();
      seg.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      // Append filter as a hidden input on the form so hx-include picks it up.
      var form = document.getElementById('search-form');
      var hidden = form.querySelector('input[name="filter"]');
      if (!hidden) {
        hidden = document.createElement('input');
        hidden.type = 'hidden'; hidden.name = 'filter';
        form.appendChild(hidden);
      }
      hidden.value = btn.dataset.filter;
      // Kick a new request.
      htmx.trigger(document.getElementById('today-results'), 'load');
    });
  }
})();
</script>
