<div class="page-head">
    <div>
        <div class="bnb-eyebrow">Detection log · <span id="today-date" class="mono"></span></div>
        <h1 class="display" style="font-size:34px;">You're listening</h1>
    </div>
    <div id="today-count" class="bnb-pill moss"
         hx-get="/pages/today-count" hx-trigger="load, every 15s" hx-swap="innerHTML">
        …
    </div>
</div>

<div class="bnb-card pad" style="margin-bottom:var(--pad-3);">
    <div class="section-header"><div><div class="bnb-eyebrow">The day so far</div><h3>When you heard them</h3></div></div>
    <div id="today-daystrip" hx-get="/pages/today-daystrip" hx-trigger="load, every 30s" hx-swap="innerHTML">
        <p class="bnb-meta">Loading timeline…</p>
    </div>
</div>

<div class="bnb-card pad" style="margin-bottom:var(--pad-3);">
    <form id="search-form" style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap;">
        <input type="text" name="search" id="today-search"
               placeholder="Search species…  (prefix NOT to exclude)"
               style="flex:1;min-width:200px;"
               hx-get="/pages/today-list"
               hx-trigger="input changed delay:300ms, search"
               hx-target="#today-results"
               hx-swap="innerHTML"
               hx-include="[name='search']">
        <span class="htmx-indicator bnb-meta">Searching…</span>
    </form>
</div>

<div id="today-results"
     hx-get="/pages/today-list"
     hx-trigger="load, every 15s"
     hx-swap="innerHTML"
     hx-include="#today-search">
    <p style="color:var(--text-muted)">Loading detections...</p>
</div>

<script>
(function() {
    var d = new Date();
    var ds = d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0');
    var el = document.getElementById('today-date');
    if (el) el.textContent = ds;
})();
</script>
