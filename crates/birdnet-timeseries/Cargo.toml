[package]
name = "birdnet-timeseries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "DuckDB time-series analytics for bird detection temporal patterns"

[features]
## Enable the DuckDB executor module for running time-series queries.
## Requires the detections_ts view to exist (created by birdnet-behavioral).
## Adds a ~7 min C++ compile for bundled libduckdb on first build.
analytics = ["dep:duckdb"]

[dependencies]
duckdb = { workspace = true, optional = true }
serde.workspace = true

[dev-dependencies]
# The execution gate opens a real `AnalyticsDb` rather than hand-building a
# DuckDB connection: that is how `birdnet-web` reaches these queries
# (`TimeSeriesDb::new(db.conn())`), and it is where ICU gets loaded and
# `detections_ts` gets created. An approximation of it in the fixture is how
# this gate came to depend on a pre-populated `~/.duckdb`.
birdnet-behavioral = { path = "../birdnet-behavioral", features = ["analytics"] }
# The fixture's date arithmetic comes from `birdnet-core::civil` rather than a
# private copy: a test computing dates a different way from the code under test
# is exactly how a date bug hides.
birdnet-core.workspace = true
duckdb.workspace = true
tempfile.workspace = true

[lints]
workspace = true
