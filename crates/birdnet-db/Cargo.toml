[package]
name = "birdnet-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Database layer: SQLite (operational) with WAL resilience, backup, and integrity"

[dependencies]
serde.workspace = true
tracing.workspace = true
rusqlite.workspace = true
# Password hashing for the accounts surface (O-14 / O-15 wire flip).
argon2.workspace = true
password-hash.workspace = true

[dev-dependencies]
proptest.workspace = true
# The rule export is JSON on the wire; its serde attributes (a defaulted,
# skipped-when-zero field) are only observable through a JSON round trip.
serde_json.workspace = true
tempfile = "3"
criterion.workspace = true
rusqlite = { workspace = true, features = ["trace"] }

[[bench]]
name = "db_queries"
harness = false

[lints]
workspace = true
