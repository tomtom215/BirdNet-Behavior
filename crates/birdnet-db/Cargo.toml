[package]
name = "birdnet-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/birdnet-db"
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Database layer: SQLite (operational) with WAL resilience, backup, and integrity"

[dependencies]
serde.workspace = true
tracing.workspace = true
rusqlite.workspace = true
# Canonical JSON and its SHA-256 for the records a methods section cites: a
# run's deciding configuration, a validation sample's protocol (RES-11, RES-07);
# SHA-256 also gives a clip's checksum, recorded when it is written and checked
# on demand (RES-23).
serde_json.workspace = true
sha2.workspace = true
# Password hashing for the accounts surface (O-14 / O-15 wire flip).
argon2.workspace = true
password-hash.workspace = true
# The null models and dependence-aware intervals the analytic queries attach to
# what they count (`birdnet_behavioral::null_model`), without the `DuckDB`
# feature: one definition of each, shared with the analytics copy.
birdnet-behavioral.workspace = true

[dev-dependencies]
proptest.workspace = true
# The rule export is JSON on the wire; its serde attributes (a defaulted,
# skipped-when-zero field) are only observable through a JSON round trip.
serde_json.workspace = true
tempfile = "3"
criterion.workspace = true
rusqlite = { workspace = true, features = ["trace"] }

[[bench]]
name = "db_queries"
harness = false

[lints]
workspace = true
