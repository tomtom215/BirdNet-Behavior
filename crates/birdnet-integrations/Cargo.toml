[package]
name = "birdnet-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "External service integrations: BirdWeather, Apprise, Wikipedia, email, MQTT, auto-update"

[dependencies]
birdnet-db.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# `form` is for Pushover, whose API takes url-encoded parameters rather than
# JSON; reqwest 0.13 gates `RequestBuilder::form` behind it.
# `stream`: the offsite backup target streams a file body rather than
# buffering it — a station database can be hundreds of megabytes and the
# board it uploads from has 512 MB of RAM.
reqwest = { workspace = true, features = ["blocking", "json", "form", "stream"] }
tokio.workspace = true
lettre.workspace = true
# SHA-256 verification of downloaded auto-update archives against the
# release's published `SHA256SUMS` before the new binary is swapped in.
sha2.workspace = true
# MQTT over TLS: the hand-rolled MQTT 3.1.1 publisher wraps its TcpStream in a
# rustls session when the broker speaks mqtts.
rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
# Offsite backups: ChaCha20-Poly1305 for the envelope, HMAC-SHA256 for the
# S3-compatible target's SigV4 signature, argon2id to turn the operator's
# passphrase into a key.
#
# No `base64`: it was added here for a key fingerprint and an SFTP quoting
# scheme, neither of which the finished code needed — SigV4 is hex throughout
# and the batch-file quoting is `"` and `\`. `cargo-machete` caught it.
ring.workspace = true
# Wraps the backup file as an async byte stream for reqwest's streaming body.
tokio-util.workspace = true
hmac.workspace = true
argon2.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The MQTT-over-TLS gate stands up a real rustls server, so it needs the
# server half of the same crate the publisher uses for the client half.
rustls = { workspace = true, features = ["std"] }

[lints]
workspace = true
