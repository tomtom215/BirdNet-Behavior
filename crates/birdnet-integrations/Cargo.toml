[package]
name = "birdnet-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "External service integrations: BirdWeather, Apprise, Wikipedia, email, MQTT, auto-update"

[dependencies]
birdnet-db.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# `form` is for Pushover, whose API takes url-encoded parameters rather than
# JSON; reqwest 0.13 gates `RequestBuilder::form` behind it.
reqwest = { workspace = true, features = ["blocking", "json", "form"] }
tokio.workspace = true
lettre.workspace = true
# SHA-256 verification of downloaded auto-update archives against the
# release's published `SHA256SUMS` before the new binary is swapped in.
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
