# Configuration for the `typos` spell checker.
#
# We use it as an advisory tool, not a grammar checker: only obvious typos
# in identifiers, log messages, and documentation should fail the build.
# Bird names, scientific terms, and abbreviations the dictionary doesn't
# know about live in the [default.extend-words] table below.

[files]
# Generated and vendored content should not be flagged.
extend-exclude = [
    "Cargo.lock",
    "*.svg",
    "*.png",
    "*.jpg",
    "tests/testdata/**",
    "target/**",
    "docs/screenshots/**",
    # Vendored design-handover artifacts: hi-fi HTML mockups with JS ported
    # verbatim from the Rust renderers (short identifiers like `rin`, `TWEEKS`).
    # They're a provenance record, not source we maintain or spell-check.
    "docs/design/handover/**",
    "LICENSE",
    "LICENSE-UPSTREAM",
    # Vendored / minified JS (htmx, etc.) — too dense for spell-check and
    # not our code to fix.
    "**/static/htmx.min.js",
    "**/static/*.min.js",
    "**/*.min.js",
]

[default]
# Bird taxonomy, scientific names, abbreviations, library terms.
extend-ignore-identifiers-re = [
    # ISO codes that look like typos.
    "ISO[0-9]+",
    # German/French/etc. species name fragments.
    "ue|oe|ae",
    # "PNGs" (plural of PNG) is split into "PN"+"Gs" and "PN" is read as a
    # typo for "ON". Ignore the whole token, not "PN" (which is a real typo).
    "PNGs",
    # `flate2`, the DEFLATE crate. Same shape as PNGs: typos splits the token
    # at the digit, and the leading "flate" is read as a typo for "flat".
    #
    # In Rust and TOML the name is parsed as one identifier and passes, so this
    # only ever fires in prose — which is why a crate the workspace has linked
    # for a long time first tripped the checker the day it was written about.
    #
    # Ignored as the whole token rather than allow-listing "flate" in
    # [default.extend-words], which is global: a real "flate" for "flat"
    # anywhere in the repository is still caught.
    "flate2",
]

# Literal text spans to ignore (matched anywhere, not just identifiers).
extend-ignore-re = [
    # CSS @font-face unicode-range hex, e.g. "U+0100-02BA" — codepoints, not prose.
    'U\+[0-9A-Fa-f]{4,6}(-[0-9A-Fa-f]{4,6})?',
    # Backticked git SHAs, e.g. `ba84180`. typos splits an identifier at the
    # first digit, so a SHA beginning with hex letters is read as a word —
    # `ba84180` becomes "ba", flagged as a typo for "by"/"be". Docs that cite
    # a commit are normal here (CHANGELOG, RELEASING, the release plan), so
    # match the shape rather than allow-listing each SHA as it appears.
    '`[0-9a-f]{7,40}`',
    # An ordinal suffix attached to digits: 100ths, 4th, 2nd, 1000ths. typos
    # splits the token at the digit and reads the tail as a word, so `100ths`
    # becomes "ths" — flagged as a typo for "the"/"this". Same shape as the
    # `PNGs` and `flate2` cases above, and never a real typo in any spelling of
    # English, so it is matched as a rule rather than allow-listed once.
    #
    # It first fired on a verbatim quotation of BirdNET-Pi's own
    # `install_config.sh` in `audio/extraction/convert.rs`, which is the
    # primary-source evidence that the frequency shift runs downward. Editing a
    # quotation to please a spell-checker would falsify the evidence.
    '[0-9]+(st|nd|rd|th)s?\b',
    # `installer/test/service-unit.sh` misspells a systemd directive on purpose:
    # its counterpart section proves `systemd-analyze verify` reports an unknown
    # key name — and reports it while still exiting 0, which is why that test
    # greps the output instead of trusting the status. The typo is the fixture.
    #
    # Matched as the whole compound token rather than allow-listing "Privilages"
    # in [default.extend-words], which is global: a real misspelling of
    # "Privileges" anywhere else in the repository is still caught.
    'NoNewPrivilages',
]

[default.extend-words]
# Words that the dictionary thinks are typos but are correct in context.
# Each entry must be lowercase = lowercase to avoid case-sensitive misses.
ot = "ot"             # ONNX op type
nd = "nd"             # ndarray crate
nin = "nin"           # NIN (neural network in network)
arange = "arange"     # numpy-style function name
ot_ = "ot_"
crate_ = "crate_"
mosquitto = "mosquitto" # MQTT broker, correct spelling (not "mosquito")
yoy = "yoy"           # year-over-year, domain abbreviation
inh = "inh"           # short for "inhibit" — used as local var name
unparseable = "unparseable" # alternative spelling of "unparsable", widely used
cardinalis = "cardinalis" # Latin species epithet — Cardinalis cardinalis (Northern Cardinal)
ater = "ater"         # Latin species epithet — Periparus ater (Coal Tit)
aas = "aas"           # CSS class prefix for the admin_audio_sources templates
thr = "thr"           # CSS class prefix for the species threshold table
woth = "woth"         # four-letter banding code for Wood Thrush (Hylocichla mustelina)
iif = "iif"           # token split from "IIFE" (immediately-invoked function expression)
redoc = "redoc"       # Redoc — the OpenAPI documentation renderer
redocly = "redocly"   # Redocly — the OpenAPI linter / CLI (see redocly.yaml)
