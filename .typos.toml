# Configuration for the `typos` spell checker.
#
# We use it as an advisory tool, not a grammar checker: only obvious typos
# in identifiers, log messages, and documentation should fail the build.
# Bird names, scientific terms, and abbreviations the dictionary doesn't
# know about live in the [default.extend-words] table below.

[files]
# Generated and vendored content should not be flagged.
extend-exclude = [
    "Cargo.lock",
    "*.svg",
    "*.png",
    "*.jpg",
    "tests/testdata/**",
    "target/**",
    "docs/screenshots/**",
    # Vendored design-handover artifacts: hi-fi HTML mockups with JS ported
    # verbatim from the Rust renderers (short identifiers like `rin`, `TWEEKS`).
    # They're a provenance record, not source we maintain or spell-check.
    "docs/design/handover/**",
    "LICENSE",
    "LICENSE-UPSTREAM",
    # Vendored / minified JS (htmx, etc.) — too dense for spell-check and
    # not our code to fix.
    "**/static/htmx.min.js",
    "**/static/*.min.js",
    "**/*.min.js",
]

[default]
# Bird taxonomy, scientific names, abbreviations, library terms.
extend-ignore-identifiers-re = [
    # ISO codes that look like typos.
    "ISO[0-9]+",
    # German/French/etc. species name fragments.
    "ue|oe|ae",
    # "PNGs" (plural of PNG) is split into "PN"+"Gs" and "PN" is read as a
    # typo for "ON". Ignore the whole token, not "PN" (which is a real typo).
    "PNGs",
]

# Literal text spans to ignore (matched anywhere, not just identifiers).
extend-ignore-re = [
    # CSS @font-face unicode-range hex, e.g. "U+0100-02BA" — codepoints, not prose.
    'U\+[0-9A-Fa-f]{4,6}(-[0-9A-Fa-f]{4,6})?',
]

[default.extend-words]
# Words that the dictionary thinks are typos but are correct in context.
# Each entry must be lowercase = lowercase to avoid case-sensitive misses.
ot = "ot"             # ONNX op type
nd = "nd"             # ndarray crate
nin = "nin"           # NIN (neural network in network)
arange = "arange"     # numpy-style function name
ot_ = "ot_"
crate_ = "crate_"
mosquitto = "mosquitto" # MQTT broker, correct spelling (not "mosquito")
yoy = "yoy"           # year-over-year, domain abbreviation
inh = "inh"           # short for "inhibit" — used as local var name
unparseable = "unparseable" # alternative spelling of "unparsable", widely used
cardinalis = "cardinalis" # Latin species epithet — Cardinalis cardinalis (Northern Cardinal)
ater = "ater"         # Latin species epithet — Periparus ater (Coal Tit)
aas = "aas"           # CSS class prefix for the admin_audio_sources templates
thr = "thr"           # CSS class prefix for the species threshold table
woth = "woth"         # four-letter banding code for Wood Thrush (Hylocichla mustelina)
iif = "iif"           # token split from "IIFE" (immediately-invoked function expression)
