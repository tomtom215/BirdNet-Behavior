# Redocly lint config for the BirdNet-Behavior OpenAPI spec
# (crates/birdnet-web/openapi.json). Run: `redocly lint crates/birdnet-web/openapi.json`.
#
# One of Redocly's opinionated "recommended" rules does not apply here:
#   - operation-4xx-response: several read-only GETs with no input to validate
#     have no 4xx path, so requiring one would only add fictitious responses.
#     The write endpoints added for O-1 do document 400/401/404.
#
# `security-defined` used to be off too, on the premise — stated in the spec's
# own `description` — that the surface was unauthenticated and read-only. That
# stopped being true when the four token-authenticated `/detections/*` write
# endpoints were added, so the rule is back on and the spec now declares a
# `bearerAuth` scheme for them to reference.
extends:
  - recommended
rules:
  operation-4xx-response: off
